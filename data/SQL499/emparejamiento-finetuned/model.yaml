- source_sentence: 'Formacion: ADMINISTRACIÓN DE EMPRESAS (Egresado). Experiencia: INGENIERIA EN CONSTRUCCIÓN'
  sentences:
  - 'Azafatas de restaurante. Sector: Restaurantes. Ocupacion: mayordomo/ azafata. Competencias: ayudar a clientes con necesidades
