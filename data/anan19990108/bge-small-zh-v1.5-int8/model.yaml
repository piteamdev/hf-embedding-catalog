configJson:
  model: BGE-small-zh-v1.5
  task: Chinese text embeddings
  source:
    repo: BAAI/bge-small-zh-v1.5
    revision: 7999e1d3359715c523056ef9478215996d62a620
  native:
    file: qnn/linux-aarch64-htpv73-qairt2.47/context_qnn.bin
    sha256: 3ddb44cc68df9448a425acd77333d70c979966797f5ca5a804c9bc4a9be2fb66
    target: QCS8550 HTP v73, QTI Linux aarch64, QAIRT 2.47.0.260601
  input:
    name: packed_tokens
    shape:
    - 2
    - 128
    dtype: int32 little-endian
    rows:
    - token IDs
    - binary attention mask
    tokenizer: assets/tokenizer
    truncation: true
    padding: max_length
    retrieval_instruction: Not applied; STS evaluation uses raw text
  output:
    name: cls_embedding
    shape:
    - 1
    - 512
    dtype: float32 little-endian
    postprocessing: Host L2 normalization; cosine is dot product of normalized vectors
  precision:
    neural: W8A8, all neural graph on HTP
    exceptions:
    - INT32 token/shape metadata and accumulators
    - FP32 output boundary
    host: Tokenizer and L2 normalization only
  transforms:
  - Static batch 1 and sequence 128
  - Tanh GELU approximation
  - Attention mask magnitude 16
  - Percentile 99.99 calibration on 32 train-only sentences
  unsupported_formats: []
  onnx:
    file: onnx/model.onnx
    sha256: b58f36d1aa94430f1b278bb5a4203ecdd0d49c405b6b446d2b00ea1d63db88fc
    runtime: Linux aarch64 ORT 1.24.4 QNN EP, QAIRT 2.47.0.260601, HTP v73
    input:
      name: token_bytes
      shape:
      - 3
      - 128
      dtype: float32 little-endian
      rows:
      - token ID low byte (id % 256)
      - token ID high byte (id // 256)
      - binary attention mask
      note: Integer-valued bytes encoded as FP32 at the boundary; graph reconstructs INT32 token IDs exactly. Not the native
        packed_tokens input.
    output:
      name: cls_embedding
      shape:
      - 1
      - 512
      dtype: float32
      postprocessing: Host L2 normalization
  tflite:
    file: tflite/model.tflite
    sha256: ad7ece1b86add223830914b1faea3bcc714042691db7810567239a53c3b8f4d2
    runtime: QTI Linux aarch64, QCS8550 HTP v73, QAIRT 2.47.0.260601, TFLite C 2.11.1
    input:
      name: packed_tokens
      shape:
      - 3
      - 128
      dtype: uint8
      rows:
      - token ID low byte
      - token ID high byte
      - binary attention mask
    output:
      name: cls_embedding
      shape:
      - 1
      - 512
      dtype: float32
      postprocessing: Host L2 normalization
    precision: Learned graph W8A8; UINT8 token metadata, INT32 normalization/index/bias/accumulators; FP32 output; no internal
      floating arithmetic
    transforms:
    - CLS-only final query
    - Per-head key centering
    - Five integer normalization replacements
    - 128 length-stratified train calibration sentences
    tokenization: Same included tokenizer, truncation/padding to 128; no retrieval instruction
