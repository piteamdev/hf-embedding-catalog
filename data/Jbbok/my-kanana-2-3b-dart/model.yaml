    pad_token: <|end_of_text|>
  chat_template_jinja: '{{bos_token}}{% for message in messages %}{% if (message[''role''] == ''user'') != (loop.index0 %
    2 == 0) %}{{ raise_exception(''Conversation roles must alternate user/assistant/user/assistant/...'') }}{% endif %}{%
    if message[''role''] == ''user'' %}{{ ''<|start_header_id|>user<|end_header_id|>\n\n'' + message[''content''] + ''<|eot_id|>''
    }}{% elif message[''role''] == ''assistant'' %}{{ ''<|start_header_id|>assistant<|end_header_id|>\n\n'' + message[''content'']
    + ''<|eot_id|>'' }}{% elif message[''role''] == ''system'' %}{{ ''<|start_header_id|>system<|end_header_id|>\n\n'' + message[''content'']
    + ''<|eot_id|>'' }}{% endif %}{% endfor %}{% if add_generation_prompt %}{{ ''<|start_header_id|>assistant<|end_header_id|>\n\n''
    }}{% endif %}'
