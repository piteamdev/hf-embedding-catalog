widgetData:
- text: Risicofactoren die de nierfunctie negatief beïnvloeden bij levertransplantatiepatiënten omvatten pretransplant renale
    disfunctie, acute nierinsufficiëntie (AKI), hepatitis C-infectie en nefrotoxische immunosuppressieve regimes. Deze factoren
    kunnen bijdragen aan het ontstaan van chronische nierziekte na levertransplantatie, wat een grote impact heeft op de mortaliteit.
    Strategieën voor vroege detectie en preventieve maatregelen om de progressie van chronische nierziekte te vertragen, zijn
    nodig.
- text: Hoe draagt verhoogde plasma TMAO-niveaus bij aan de pathogenese van atherosclerose en hart- en vaatziekten?
- text: De relatie tussen pulsdrukgolf-snelheid (PWV) en de afmetingen van het aortale lumen is complex. Volgens de Moens-Korteweg-
    en Bramwell-Hill-vergelijkingen is PWV omgekeerd gerelateerd aan de grootte van het aortale lumen. Echter, verharding
    en verwijding van de aortawand kunnen de belasting overbrengen op stijvere collageenvezels, wat resulteert in een toename
    van PWV ondanks de toename in diameter.
- text: Dopamine-infusie resulteert in een hoger zuurstofverbruik (VO2) in vergelijking met de gecombineerde dopamine-dobutamine-infusie.
    Beide infusies hebben een vergelijkbaar effect op de hartoutput, maar de capaciteit van dopamine alleen om de hartoutput
    te verbeteren kan bij sommige patiënten met hartfalen door uitputting van endogene noradrenalinevoorraden verminderd zijn.
- text: Hoe verhoudt glucose-intolerantie bij zwangerschapsdiabetes mellitus (GDM) zich tot insulineresistentie en insulinesecretie?
