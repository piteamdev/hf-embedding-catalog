- source_sentence: 請問中興大學的去是正常的嗎相關規定或資訊？
  sentences:
  - '新生實戰QA-電資 請問我看選課系統時年級1的部分沒有選修 但年：【大一新生群真實提問】：電資 請問我看選課系統時年級1的部分沒有選修 但年級2的有 這樣能選年級2的選修嗎？還是就不用選選修課呢？麻煩了謝謝


    【在校學長姐解答與經驗建議】：

    農藝30 可以不用選也可以上修，但上修要看老師讓不讓你上修；動科10 看課程有沒有說明需要修過哪些課才可以修2年級的選修課 如果你覺得目前這個學期你的課表很滿不需要選修課也可以先不選；喔喔喔 okok 非常謝謝


    【備註】：本解答彙整自中興大學新生大群學長姐社群即時答覆，具體行政流程請以學校各處室官方公告為準。'
  - '中興大學僑生聯誼會與各國同學會組織：【中興大學僑生社團與同鄉互助組織】：

    • **組織架構**：學務處學安室下轄輔導之「國立中興大學僑生聯誼會」。

    • **下設分會**：包含港澳同學會、馬來西亞同學會、印尼同學會、緬甸同學會及環球同學會。

    • **重要活動**：每年定期舉辦迎新接機、僑生文化祭、春節僑生祭祖圍爐餐會、體育競賽及送舊活動，是僑生在台生活最重要的互助生活圈。'
  - '新生實戰QA-土木工程系 請問現在的學校信箱登不進去是正常的嗎：【大一新生群真實提問】：土木工程系 請問現在的學校信箱登不進去是正常的嗎


    【在校學長姐解答與經驗建議】：

    令人旋轉；生科 就是只有普化沒有選到；生科20 對 那個等初選再選就好


    【備註】：本解答彙整自中興大學新生大群學長姐社群即時答覆，具體行政流程請以學校各處室官方公告為準。'
- source_sentence: 請問中興大學的僑生聯誼會相關規定或資訊？
