    hubert:
      shape:
      - batch
      - frames
      - '128'
      frame_rate_hz: 50.0
      hop_samples: 320
      description: WakeHuBERT-tiny int8 features, bit-identical to wakehubert_int8.onnx
    layers:
      shape:
      - batch
      - frames
      - '9'
      - '256'
      frame_rate_hz: 50.0
      hop_samples: 320
      description: 'dequantised int8 trunk taps: stem output then the 8 block outputs, after ReLU'
    logmel:
      shape:
      - batch
      - mel_frames
      - '64'
      frame_rate_hz: 100.0
      hop_samples: 160
      description: BatchNorm-normalised log-mel, 2 frames per feature frame
    mfcc:
      shape:
      - batch
      - mel_frames
      - '20'
      frame_rate_hz: 100.0
      hop_samples: 160
      description: orthonormal DCT-II of the un-normalised log-mel
    vad:
      shape:
      - batch
      - frames
      - '1'
      frame_rate_hz: 50.0
      hop_samples: 320
      description: active-speaker probability (sigmoid)
    ipa:
      shape:
      - batch
      - frames
      - '392'
      frame_rate_hz: 50.0
      hop_samples: 320
      description: CTC posteriors (softmax) over the vocab ids; index 0 <pad> is the blank, indices 1-3 (<s>, </s>, <unk>)
        are dropped when decoding; trained with a 5-frame (100 ms) teacher delay
    features:
      shape:
      - batch
      - frames
      - '521'
      frame_rate_hz: 50.0
      hop_samples: 320
      description: hubert, vad, ipa joined on the last axis
