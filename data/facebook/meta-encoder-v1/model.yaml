  chat_template_jinja: "{#-\n  MetaEncoder v1 embedding template: renders one input exactly as the encoder was trained on\
    \ it.\n\n  messages: an optional {\"role\": \"system\"} message whose content is the task instruction, then one\n  {\"\
    role\": \"user\"} message holding the input as {\"type\": \"image\"} parts followed by an optional\n  {\"type\": \"text\"\
    } part. The embedding is the final hidden state of the closing <|eot|>.\n  The date line is fixed so an input embeds identically\
    \ on any day.\n-#}\n{%- macro render_content(content) -%}\n    {%- if content is string -%}\n        {{- content -}}\n\
    \    {%- elif content is not none -%}\n        {%- for part in content -%}\n            {%- if part['type'] == 'image'\
    \ -%}\n                {{- '<|patch|>' -}}\n            {%- elif part['type'] == 'text' -%}\n                {{- part['text']\
    \ -}}\n            {%- endif -%}\n        {%- endfor -%}\n    {%- endif -%}\n{%- endmacro -%}\n{%- set ns = namespace(instruction='')\
    \ -%}\n{%- for message in messages -%}\n    {%- if message['role'] == 'system' -%}\n        {%- set ns.instruction = render_content(message['content'])\
    \ -%}\n    {%- endif -%}\n{%- endfor -%}\n{{- bos_token -}}\n{{- '<|start|>system<|message|>You are Meta AI, a friendly\
    \ AI Assistant.\\n\\nKnowledge cutoff: 2025-10-26.\\n\\nCurrent date: 2026-01-01.\\n\\nRepresent the user\\'s input.'\
    \ -}}\n{%- if ns.instruction -%}\n    {{- '\\n\\n' + ns.instruction -}}\n{%- endif -%}\n{{- '\\n\\n# Valid recipients:\
    \ \"user\".<|eot|>' -}}\n{%- for message in messages -%}\n    {%- if message['role'] == 'user' -%}\n        {{- '<|start|>user<|message|>'\
    \ + render_content(message['content']) + '<|eot|>' -}}\n    {%- endif -%}\n{%- endfor -%}\n"
