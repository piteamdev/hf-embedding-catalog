    from partnership interests and income from certain derivative transactions. Interest is recognized on an accrual basis
    and dividends are recorded at the ex-dividend date. Interest income on mortgage-backed and asset-backed securities is
    determined using the effective yield method, based on estimated principal repayments. Interest income on certain beneficial
    interests in securitized financial assets is determined using the prospective yield method, based upon projections of
