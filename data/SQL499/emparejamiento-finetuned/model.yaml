  - 'Analista Sr. De Tecnología e Información de Riesgos. Sector: Banca/Finanzas/Seguros. Ocupacion: analista de probabilidades.
    Competencias: Hablar diferentes idiomas; Realizar resúmenes estadísticos de datos; Seguimiento de variables para modelos
    de Riesgo; aplicar conocimientos sobre el comportamiento humano; calcular las probabilidades de ganar apuestas'
  - 'TECNICO MECANICO – EXPERIENCIA EN MONTACARGA. Sector: Servicios. Ocupacion: arquitecto tecnico/ arquitecta tecnica/aparejador/aparejadora.
