widgetData:
- source_sentence: Pourquoi les proverbes et contes sont-ils importants dans l'éducation malienne ?
  sentences:
  - une fiche de budget est un document où l'on note les revenus et les dépenses pour suivre l'argent et s'assurer qu'on ne
    dépense pas plus que ce qu'on gagne.
  - Les proverbes et les contes sont essentiels au Mali pour la transmission des valeurs morales, des leçons de vie et de
    la sagesse ancestrale aux jeunes générations, de manière imagée et mémorable.
  - Les proverbes et les contes sont de simples divertissements pour les enfants. (Réduction de leur rôle pédagogique et social).
- source_sentence: Jateminɛ kɛ 18/9 kan.
  sentences:
  - 2. Sabula 18/9 = 2.
  - 90. Sabula 81 + 9 = 90.
  - Dugukolo birikiw (banco) dilanni ka ca Mali kɔnɔ bawo a ye sigida, sɔrɔko, sigida laminiko ye min bɛ funteni-sɔrɔ-minɛn
    ɲuman di, min bɛ bɛn waati cogoya ma.
- source_sentence: Quelle est la boisson nationale du Mali, présente dans toutes les célébrations ?
  sentences:
  - Le café est la boisson la plus populaire, surtout le matin. (Confusion avec les habitudes occidentales).
  - Le fleuve Niger occupe une place primordiale dans les mythes maliens, étant souvent personnifié comme une entité sacrée,
    source de vie et de prospérité, peuplé d'esprits et de créatures mystiques.
  - Le thé vert, appelé 'ataya', est la boisson la plus consommée au Mali, symbolisant l'hospitalité et les liens sociaux.
- source_sentence: fɛɛrɛ jumɛnw bɛ se ka kɛ walasa ka dɔ bɔ fanga musakaw la so kɔnɔ?
  sentences:
  - fanga, faturaw, bolomafaraw, fanga tiɲɛni,fanga musakaw bɛ sigi sen kan, foyi tɛ se ka kɛ walasa ka dɔ bɔ u la. (nkalon,
    a tacogo bɛ se ka dɔgɔya kosɛbɛ ni wale nɔgɔmanw ye).
  - aw bɛ se ka dɔ bɔ wari sarataw la ni aw ye lanpanw faga minnu tɛ mako ɲɛ, ka minɛnw tigɛ minnu tɛ baara kɛ ni u ye ani
    ka baara kɛ ni anpuluw ye minnu musaka ka dɔgɔ.
  - Waati labatoli ye laadala nafa ye. Laada dɔw la (misali la, tilebin yanfan fɛ), ka kɛ waati la, o ye bonya ni baarakɛcogo
    ɲuman taamasyɛn ye. Dɔw la (i n'a fɔ Mali), waati hakilina bɛ se ka wuli ka bɔ a nɔ na, wa hadamadenw ka jɛɲɔgɔnyaw bɛ
    se ka bila ɲɛfɛ ka tɛmɛ waati tigitigi kan.
- source_sentence: misali di daɲɛw sɛbɛnni seko kan Mali kɔnɔ.
  sentences:
  - nsiirin, da-sɛbɛnw, mali, laadala seko,jiri ja. (ja ye plastiki seko ye wa a tɛ daɲɛw sɛbɛnni sugu dɔ ye).
  - maanafɔ ye Mali daɲɛgafe suguba dɔ ye, min bɛ kɛ ka nafaw, ɲɛnamaya kalanw ani ɲɛnajɛw lase mɔgɔw ma.
  - l'eau potable est exempte de micro-organismes et de substances chimiques nocives. boire de l'eau non potable peut entraîner
    des maladies hydriques graves comme le choléra ou la typhoïde.
