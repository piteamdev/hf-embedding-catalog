    sentences:
    - '[Wijzigt de Algemene wet bestuursrecht.]'
    - '[Wijzigt de Belastingwet BES.]'
    - '[Bevat wijzigingen in andere regelgeving.]'
    - Indien de advocaat jegens wie het voornemen bestaat een procedure inzake de onbehoorlijke praktijkuitoefening aan te
      vangen, zich krachtens het nationale recht van een andere lidstaat van de Europese Unie of een andere staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte dat uitvoering geeft aan artikel 3 van richtlijn 98/5/EG
      van het Europees Parlement en de Raad van de Europese Unie van 16 februari 1998 ter vergemakkelijking van de permanente
      uitoefening van het beroep van advocaat, heeft laten inschrijven, stelt de raad van toezicht voor de aanvang van de
      procedure de bevoegde autoriteit in die lidstaat of lidstaten van dit voornemen op de hoogte en verstrekt hij aan die
      autoriteit of autoriteiten alle dienstige inlichtingen.
    - 'Subsidie op grond vanartikel 6wordt slechts verstrekt voor zover: a. de student gedurende het desbetreffende studiejaar
