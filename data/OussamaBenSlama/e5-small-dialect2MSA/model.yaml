    - 'أسطورة أبطال الكوندور (بالصينية: 射鵰英雄傳) هي رواية مستلهمة من صنف ووشيا (أبطال فنون القتال) من تأليف لويس تشا المعروف
      باسمه القلمي (جين يونغ). تعد الرواية الجزء الأول من ثلاثية تليها "عودة أبطال الكوندور" و "سيف السماء والتنين الصابر".
      تم نشرها لأول مرة بطريقة متسلسلة بين 1 يناير 1957 و19 مايو 1959 في صحيفة هونغ كونغ اليومية.[1]'
    - يتكون أسطول كوندور للطيران من 42 طائرة.
    - بعد وفاة الأخ غوه شياوسيان واختفاء يانغ تيشين، يكبر ابن غوه شياوسيان غوه جينغ في منغوليا تحت رعاية جنكيز خان حيث يتعلم
      فنون الدفاع عن النفس من "Seven Freaks of Jiangnan" وفنون ماو يو من مدرسة كوان شين، فضلا عن مهارات الرماية من القائد
      جبه نويان. في المقابل عاش ابن يانغ تيشين يانغ كانغ كابن لأمير جورشن. على الرغم من أنه تم تدريبه من قبل تشيو تشوجي التابع
      لمدرسة كوان شين، فإنه تعلم سرا فنون الشر المسماة "Nine Yin White Bone Clawء" من مي تشاوفينغ.
    - دبليو 73 (قنبلة نووية) هو رأس نووي أمريكي لصاروخ كوندور من طراز 53. تمت الموافقة على إنتاج كوندور عام 1975 ولكن تم إلغائهه
      في أوائل عام 1976.
    - تدور أحداث الرواية خلال حروب جين سونغ. حيث عاش الشقيقان يانغ تيشين وغوه شياوسيان كوطنيين حلفاء منتصرين لسلالة هان وكارهين
      الغزاة من جورشن. متعهدين بأن أطفالهما اللذان سيولدون وجب أن يصبحا إما شقيقين حليفين (إذا ولد لهما ذكور) أو زوجين (إذا
      ولدا لهما ذكر وأنثى).
    - 'كان تأثير أسطورة إيزيس وأوزوريس في الثقافة المصرية القديمة أعظم وأكثر انتشارًا من أي أسطورة أخرى. في الأدب، لم تكن
      الأسطورة قائمة على هدف الحكي فحسب مثل "الصراعات". لكنها توفر أيضًا الأساس ل أخرى متعقلة بهذه الأسطورة عن بعد. فتتضمن
      "قصة الأخوين"، الحكاية الشعبية ذات الأبطال البشر، بعض العناصر المشابهة لأسطورة إيزيس وأوزوريس. ففيها تأكل سمكة العضو
      التناسلي لإحدى الشخصيات، وفي وقت لاحق تموت هذه الشخصية ويتم . كما أن "قصة الحقيقة والكذب" تتبنى الصراع بين حورس وست
      في صورة حكاية رمزية تقوم فيها الشخصيات بتشخيص الحقيقة والكذب مباشرة بدلًا من الإتيان بالآلهة المرتبطة بهذه المفاهيم.

      منذ وقت نصوص الأهرام على أقل تقدير، تمنى الملوك أن يقوموا بعد موتهم بمحاكاة أوزوريس وحكمه ل الموتى. وفي بداية الدولة
      الحديثة (2055-1650 ق.م)، اعتقد بعض المصريين من خارج الأسرة الملكية أنهم هم أيضًا يمكنهم التغلب على الموت مثلما فعل أوزوريس،
      وذلك بعبادتهم له والمرور بنفس الطقوس الجنائزية التي قامت عليها الأسطورة جزئيًا. وبهذا أصبح أوزوريس أهم إله للحياة الآخرة
      في مصر. كما أثرت الأسطورة على الفكرة التي انتشرت في الدولة الحديثة بأن ذوي الفضيلة من الناس فقط هم من يصلون إلى الآخرة.
      وبما أن الآلهة المجتمعة قضت بكون أوزوريس وحورس صالحَين إبطالًا للظلم الناتج عن قتل أوزوريس، فكان من اللازم أن يُحكم
      بصلاح روح المتوفى حتى يمكن إبطال موته. بصفة أوزوريس إلهًا حاكمًا لأرض الموتى متصلًا بماعت، أصبح هو القاضي في محاكمته
      بعد الموت، وعرض الحياة بعد الموت لمن يحذو حذوه.'
    - بمساعدة غو جينغ، ينتصر الجيش المغولي على سلالة جين الحاكمة، ثم ينتقل بعد ذلك إلى سلالة سونغ الحاكمة. لكن غو جينغ لم
      يرد مساعدة المغول في مهاجمة أرضه الأصلية فغادر منغوليا. يعود غوه جينغ إلى أسرة سونغ ويساعد زملائه الهان الصينيين على
      مواجهة الغزو المغولي الوشيك. من ناحية أخرى، يموت يانغ كانغ مسموما بعد محاولة قتل هوانغ رونغ لكن انتهى به الأمر إلى ارتداد
      درعه المسموم عليه. يترك وراءه مو نيانشي وابنهم الذي لم يولد بعد والذي يدعى غوه جينغ يانغ غوه. في هذه الأثناء، يتوقف
      الغزو المغولي مؤقتًا عندما يموت جنكيز خان بشكل غير متوقع.
    - 'تستخدم كلمة « Fabula » اللاتينية الأصل والتي يقصد بها الخرافة في التعبير عن نفس المعنى الذي استخدمت فيه كلمة « Mythos
      » والتي يقصد بها الأسطورة ؛أي في الإشارة إلى قصة خيالية أو خرافية، وهذا المعنى نفسه موجود في الخرافة الإنجليزية أيضا.
      فالقصص التي تسرد أحداثا زائفة هي أشبه ما تكون بالخرافة ويمكن أن يطلق عليه (كذبة خرافية).

      أما القصص التثقيفية والخيالية كالقصص التي كتبها أيسوبوس «Aesop» فيطلق عليها خرافات. وقد يقابل هذا كله الأساطير الأصلية
      التي لا تفسر على أنها قصصا خيالية أو غير حقيقية.

      ولم تكن كلمة موثوس « Muthos » والتي يقصد بها الأسطورة عند اليونان في بداية أمرها-إذا عدنا إلى أصلها الإشتقاقى-سوى كلمة
      عادية جدا ومعناها الحكاية Récit أو السرد Narration أو ما يحكى في الأسواق. وكانت تتعلق بنسب الآلهة والأبطال كما ذكرنا
      من قبل في تعريف الأسطورة, أو تحكى جملة الأوامر التي يأمر بها الملك أو الإله مثلما كانت تحكيها الطقوس تمثيلا بالإيماء
      والإشارة.

      وكانت تعنى عند أرسطو حبكة الرواية أو بناءها والكلمة التي تقابله عند الفرنسيين الآن هي Fable بمعنى الخرافة.

      إذا نظرنا إلى جميع ما سبق من تعريف لكل من الأسطورة والخرافة والعلاقة بينهما فسوف لانجد سوى اختلاف واحد فقط بينهما قد
      لا يلاحظه الكثيرمن الناس ألا وهو (الحقائق التاريخية).

      فالأسطورة تختلف عن الخرافة أن فيها بعض الحقائق التاريخية كقصة طروادة مثلا والتي ذكرنا نبذة عنها من قبل.

      ومن هنا نرى أن فيكتور هوجو عرف الملحمة بقوله :(هي التاريخ ينشد على باب الأسطورة) ولم يقل الخرافة لأن الأسطورة هي التي
      تذكر الحقائق التاريخية.'
  - source_sentence: ما هي الاشتراكية؟
    sentences:
    - الاقتصاد الاشتراكي هي النظرية والممارسة للنظم الاقتصادية القائمة على الاشتراكية. ويستند الاقتصاد الاشتراكي على الملكية
      العامة أو ملكية تعاونية مستقلة لوسائل الإنتاج، ويتم الإنتاج فيها إلى استخدام مباشر لتحديد معيار للاقتصاد الاشتراكي ويميز
      الاشتراكية عن الرأسمالية (الذي يقوم على الإنتاج من أجل الربح). وكان هذا المعيار واحد من الخصائص الأساسية للاشتراكية
      وتعريف مشترك في البداية من قبل الاشتراكيين الماركسية والاشتراكيين المتطورين، الفوضويين والاشتراكيون المسيحيون, ولكن
      ليس دائما.
    - الاشتراكية الثورية هي مصطلح يشير إلى الاتجاهات الاشتراكية التي تدعو إلى الحاجة إلى التغيير الاجتماعي من خلال ثورة من
      قبل الحركات الجماهيرية للطبقة العاملة، كاستراتيجية للوصل إلى المجتمع الاشتراكي. يستخدم هذا المصطلح من قبل التيارات الاشتراكية
      والشيوعية لوصف الاتجاه المقابل للديموقراطية الاشتراكية (الإصلاحية)، والتي تدعو إلى التغيير التدريجي كوسيلة لتحقيق الاشتراكية
      أو على الأقل تخفيف الرأسمالية، وبما أنها تؤمن بمشاركة الجماهير، فهي على النقيض أيضاً من البلانكية، والتي تؤمن بمشاركة
      جماعة ثورية محدودة منظمة ومدربة إلى هذا التغيير.
    - إن الاشتراكية الديمقراطية الحديثة حركة سياسية واسعة الانتشار تبحث عن الانتقال من الرأسمالية إلى الاشتراكية من خلال سياق
      نظام ديموقراطي. تطلق الاشتراكية الديمقراطية عامة على أي حركة سياسية تبحث عن نظام اقتصادي يعتمد على الديمقراطية الاقتصادية.
      يرفض الاشتراكيون الديموقراطيون المركزية الديموقراطية وحزب الطليعة الثوري اللينيني. من الصعب تعريف الاشتراكية الديموقراطية،
      وهناك مجموعات من الباحثين وضعوا تعريفات مختلفة لهذا المصطلح. تصنف بعض هذه التعريفات كل أشكال التنظيمات الاشتراكية التي
      تتبع نظام انتخابي أو ثوري ديمقراطي تحت خانة "الاشتراكية الديمقراطية".
    - 'جمهورية طاجيكستان السوفيتية الاشتراكية ذاتية الحكم (بالروسية: Таджикская Автономная Социалистическая Советская Республика)
      كانت جمهورية ذاتية الحكم مستقلة ضمن جمهورية أوزبكستان السوفيتية الاشتراكية في الاتحاد السوفيتي. أُنشئت الجمهورية في
      أكتوبر من العام 1924 من خلال سلسلة من القوانين التي قسمت الكيانات الإقليمية الثلاثة الموجودة في آسيا الوسطى - جمهورية
      تركستان السوفيتية الاشتراكية ذاتية الحكم، جمهورية بخارى الشعبية السوفيتية، وجمهورية الخوارزمية الشعبية السوفيتية - إلى
      خمسة كيانات جديدة تقوم على المبادئ العرقية هي: جمهورية أوزبكستان السوفيتية الاشتراكية وجمهورية تركمانستان السوفيتية
      الاشتراكية، جمهورية طاجيكستان الاشتراكية السوفياتية ذاتية الحكم (داخل جمهورية أوزبكستان السوفيتية الاشتراكية)، وكارا
      كيرغيز ذاتية الحكم أوبلاست (كمقاطعة من جمهورية روسيا الاتحادية الاشتراكية السوفيتية) ، وجمهورية قراقلباغيون أوبلاست
      ذاتية الحكم (باعتبارها مقاطعة من جمهورية كازاخستان السوفيتية الإشتراكية ذاتية الحكم).'
    - الحركات السياسية الاشتراكية الأساسية كما سيلي شرحها بعد هذه الفقرة. المنظرون المستقلون الاشتراكيون والكتاب الاشتراكيون
      الخياليون والمدعمون الأكاديميون للاشتراكية من الممكن ألا يمثلوا في أي من الحركات السياسية التالية. أطلقت بعض الأحزاب
      السياسية على أنفسهم اشتراكيين بينما يؤمنوا بآراء تناقض الأفكار الاشتراكية. استخدم بعض الساسة مصطلح اشتراكي على اليمين
      السياسي كصفة ضدالافراد الذين لا يعتبروا أنفسهم اشتراكيين، وضد السياسيات التي لا تعتبر الاشتراكية من أنصارها.
    - 'الاشتراكية الخيالية هي الاشتراكية الطوباوية نسبة لمدينة أفلاطون يوطوبيا. الفرق ما بين الاشتراكية الخيالية والاشتراكية
      العلمية وضحها صراحةً فريدريك انغلز في كتابه (الاشتراكية: الخيالية والعلمية) حيث بين أن "الخيالية تصور ظروف اجتماعية
      مثالية" للمصلحين الاشتراكيين بمبدأ ماركسي اشتراكي علمي. بدأت الاشتراكية العلمية باختبار الظواهر الاجتماعية والاقتصادية
      -دراسة تجريبية للعمليات الحقيقية في المجتمع والتاريخ. بالنسبة للماركسيين، تطور الرأسمالية في غرب أوروبا زود قاعدة مادية
      لإحتمالات جلب الاشتراكية، وطبقاً للبيان الشيوعي، "ما يتنجه البرجوازي فوق الكل هو بمثابة حفارات لقبره"، بمسمى الطبقة
      العاملة، لابد أن نعي المنظورات التاريخية التي يضعها المجتمع. راجع إدوارد بيرنشتين هذه النظرية ليقترح أن تحرك المجتمع
      نحو الاشتراكية هو أمر حتمي، ليجلب العنصر الآلي والغائي للماركسية ومشعلاً لمبدأ الاشتراكية التطورية. رأى ثورشتين فيلبن
      أن الاشتراكية كمرحلة فورية في عملية التطور المتواصلة في الاقتصاد أن الناتج من التدهور الطبيعي لنظام العمل التجاري، وبمناقضة
      ماركس لم يؤمن بأن نتيجة الصراع السياسي أو ثورة الطبقة العاملة ولم يؤمن بأنها الهدف الأسمى للإنسانية. أسس الاشتراكيون
      الطوباوين مجموعة من المُثل والأهداف التي تقدم الاشتراكية بديلاً للرأسمالية، مع سمات فعالة أفضل. مثالاً لذلك الهيئة الاشتراكية
      التي تشمل مجتمع روبرت أوين الذي يدعى (نيو هارموني New Harmony).'
    - تعود الاشتراكية من أعلى إلى الرأي القائل بأن إصلاحات وثورات الاشتراكية ستأتي من أو ستقاد بواسطة أعضاء مجتمع من ذوي المراكز
      العليا راغبين في نظام اقتصادي أكثر كفاءة وعقلانية. يعتقدكل من كلود هنري دي سان سيمون والاقتصادي التطوري ثورشتين فيبلن
      أن الاشتراكية هي ناتج عمل مهندسين مبدعين وعلماء وفنيين يريدوا أنن يرتبوا المجتمع والاقتصاد بطريقة عقلانية بدلاً من الطبقة
      العاملة. الديموقراطية الاشتراكية تدافع عن العقلانين والطبقة الوسطى، وبالمثل قطاعات من الطبقة العاملة. أما الاشتراكية
      من الأسفل فتعود إلى الموقف الذي يمكن أن تأتي منه الاشتراكية فقط، ويقودها تحرك تضامني وسياسي من الطبقات السفلى، مثل الطبقة
      العاملة والطبقة المتوسطة السفلى. أنصار منظور الاشتراكية من الأسفل أمثال النقابيين والماركسيين المتشددين وعادة مايشبه
      منظور الاشتراكية من الأعلى بالنخبوية و، أو الستالينية.
    - في عام 1951، عبر وزير الصحة البريطاني عن رأيه قائلاً " من المحتمل صحة أن أوروبا الغربية قد إتجهت للاشتراكية بعد الحرب
      إن لم يعط السلوك السوفييتي صورة قاتمة جداً، الشيوعية والاشتراكية السوفييتية لم تفرق بينهم العقول بعد." وفي عام 1951
      اعاد تأسيس الدولية الاشتراكية الأحزاب الاشتراكية الأوروبية. وصرحت "شَقت الشيوعية الحركة العمالية الدولية وأعادت للوراء
      تحقيق الاشتراكية في عديد من الدول لعقود من الزمن... وتدعي الشيوعية مغالطةً أن لها سهماً في التقليد الاشتراكية. حقيقةً
      شوهت هذا التقليد بدون تمييز. وبنت لاهوتاً جامداً لا يتماشى مع الروح النقدية للماركسية." وفي الأعوام التابعة للحرب، أصبحت
      الاشتراكية ذات تأثير متزايد فيما يسمى بالعالم الثالث. أممت دول بأفريقيا وآسيا وأمريكا اللاتينية الصناعات التي إمتلكها
      مُلاك أجانب. أما الاتحاد السوفييتي فأصبح قوة عظمى من خلال تبنيه للاقتصاد المُخطط. ولو على التكلفة البشرية. هذا الإنجاز
      أصبح وقعاً من الخارج، وأقنع العديد من القوميين في المستعمرات السابقة ليسوا بالضرورة شيوعيين أو اشتراكيين، لهم مميزات
      بأنهم يخططوا للدولة ويحتذوا النماذج المُرشدة للتطور الاشتراكي. وهذا لاحقاً كان له نتائج هامة في بلاد كالصين ومصر والهند
      حيث حاولت استيراد وتجربة النموذج السوفييتي.
    - نشأ مصطلح "الاشتراكية الأخلاقية" في بدء الأمر على يد الماركسية الثورية روزا لوكسمبورغ في إطار الازدراء من الماركسي الثوري
      الإصلاحي إدوارد برنشتاين الذي كان يحض على اعتناق المُثل اللبيرالية لإيمانويل كانت. ومع ذلك، ظهر الأشخاص الذين قدموا
      أنفسهم كاشتراكيين أخلاقيين لاسيما في بريطانيا أمثال آر أتش تاوني، الاشتراكي الديني البريطاني وارتبطت المُثل التي تدعو
      إليها الاشتراكية الأخلاقية بمثل الاشتراكية الدينية الفانية واشتراكية الحرفيين. كما تمثل الاشتراكية الأخلاقية فكرًا هامًا
      داخل حزب العمل البريطاني، وقد حظيت الاشتراكية الأخلاقية بدعم عام من رؤساء الوزراء البريطانيين رامزي ماكدونالد وكليمنت
      أتلي وتوني بلير.
    - 'الاشتراكية هي نظام اقتصادي يمتاز بالملكية الجماعية لوسائل الإنتاج والإدارة التعاونية للاقتصاد؛ أو هي فلسفة سياسية تدافع
      عن هذا النظام الاقتصادي. الملكية الاجتماعية تعود لأي شخص ما أو مجموعة مما يلي: شركات تعاونية أو ملكية شائعة أو ملكية
      عامة مباشرة أو دولة المؤسسات المستقلة.[1] الاقتصاديات الاشتراكية تعتمد على الإنتاج من أجل الاستخدام والتخصيص المباشر
      لمدخلات الاقتصاد لإشباع المتطلبات الاقتصادية والحاجات البشرية (قيمة الاستخدام)؛ المحاسبة تعتمد على كميات طبيعية من الموارد،
      كمية طبيعية أو قياس مباشر لوقت العمل.[2] كحركة سياسية، تشمل الاشتراكية على مصفوفة مختلفة من الفلسفات السياسية، تتراوح
      ما بين الاشتراكية الإصلاحية إلى الاشتراكية الثورية. يدافع أنصار اشتراكية الدولة عن قومية وسائل الإنتاج، توزيع وتبادل
      خطة لتنفيذ الاشتراكية. يدافع الديموقراطيون الاشتراكيون عن إعادة توزيع الضرائب وتنظيم الحكومة لرأس المال من خلال هيكل
      اقتصاد السوق[3]. بخلاف ما سبق، الحركة اللاسلطوية تدافع عن تحكم العامل المباشر في وسائل الإنتاج بدون الاعتماد على سلطة
      الدولة أو السياسيات البرلمانية أو ملكية الدولة للصناعة لتحقيق الاشتراكية. الاشتراكية الحديثة تنبع من مفكري القرن الثامن
      عشر والحركة السياسية للطبقة العاملة التي تنتقد آثار الصناعة والملكية الخاصة على المجتمع.على الرغم من أن المصطلح اشتراكي
      في القرن التاسع عشر كان يطلق على أي اهتمام بالمشاكل الاجتماعية للرأسمالية، بدون النظر للحل، بنهاية القرن التاسع عشر
      حدث تضاد واضح بين الاشتراكية والرأسمالية وأصبحت نظاماً بديلاً يعتمد على الملكية الجماعية. الاشتراكيون الخياليون أمثال
      روبرت أوين حاول أن يؤسس كميونات معتمدة على نفسها بالانفصال عن المجتمع الرأسمالي. ألهم النموذج السوفيتي لتطور اقتصاد
      الاشتراكيين أمثال اللينيين-الماركسيين، ودافعوا عن خلق اقتصاد مخطط مركزياً يوجهه حزب الدولة الحاكم الذي يملك وسائل الإنتاج.
      الحكومات الشيوعية اليوغوسلافية والمجرية والألمانية الشرقية والصينية أنشأت أشكال لاشتراكية السوق متعددة، تدمج نماذج الملكية
      التعاونية وملكية الدولة مع تبادل السوق الحر ونظام الأسعار الحرة (ولكن الأسعار الحرة ليست لوسائل الإنتاج)[4].'
  - source_sentence: متى تولى جلال طالباني الحكم في العراق ؟
    sentences:
    - على رغم وجود التوتر بين المجموعتين على كركوك إلا إنها تنتهى ببطء. وفي 30 يناير 2006 قال الرئيس العراقي جلال طالباني،
      أن "الأكراد يعملون على خطة لمنح الحكم الذاتي لتركمان العراق في المناطق التي يشكلون فيها الأغلبية في الدستور الجديد يقيمون
      بصياغتة بإقليم كردستان العراق". غير أن ذلك لم يحدث أبدا، كما أن سياسات التكريد بواسطة الحزب الديمقراطي الكردستاني والإتحاد
      الوطني الكردستاني بعد عام 2003 (مع غير الأكراد) أدت إلى مشاكل خطيرة بين الأعراق.
    - جلال حسام الدين نور الله نوري طالباني (12 نوفمبر، 1933 - 3 أكتوبر 2017) (بالكردية:جەلال تاڵەبانی) هو سياسي كردي عراقي
      وهو رئيس جمهورية العراق السابع في الفترة من 2005 إلى 2014،[1] وكذلك شغل منصب رئيس مجلس الحكم العراقي، ويعد أول رئيس
      غير عربي لجمهورية العراق، ويعرف بين الشعب الكردي باسم «مام جلال» أي «العم جلال».[2][3]
    - 'كردستان والحركة القومية الكردية. جلال طالباني: مواقف وآراء. الطريق إلى الأمام. حول القضية الكردية في العراق.[45]'
    - تمت محاكمته من قبل المحكمة الجنائية العراقية الخاصة التي وجهت إليه إتهامات بجرائم آنفة الذكر مثل الأنفال، وقد حكم عليه
      بالإعدام شنقًا وذلك في الحكم الصادر بتاريخ 24 يونيو 2007 بعد أن أدين بتهمة الإبادة الجماعية بحق الأكراد في الثمانينيات.
      وفي يوم الجمعة 29 فبراير 2008 صادق مجلس الرئاسة العراقي على حكم الإعدام. وكانت هيئة التمييز التابعة للمحكمة الجنائية
      العراقية العليا قد صادقت في سبتمبر 2007 على حكم الإعدام. وقد تأخر تنفيذ الأحكام بسبب تأخير مجلس الرئاسة على المصادقة
      عليها بعد إبداء رئيس الجمهورية جلال طالباني ونائبه طارق الهاشمي رفضهما المصادقة على الحكم بحق سلطان هاشم أحمد وزير الدفاع
      الأسبق.
    - وفي 1 يوليو 2008، صافح وزير الدفاع الإسرائيلي إيهود باراك والتقى بالرئيس العراقي جلال طالباني بإيجاز في مؤتمر الأممية
      الاشتراكية في اليونان. كان باراك وطالباني على حد سواء في المؤتمر كممثلين لأحزابهم السياسية، العمل، والاتحاد الوطني الكردستاني.
    - قباد طالباني هو سياسي كردي عراقي ولد في يوم 21 تموز 1977 في مدينة دمشق عاصمة سوريا، هو سياسي من حزب الإتحاد الوطني الكردستاني
      وهو ابن رئيس جمهورية العراق السابق جلال طالباني من زوجته هيرو إبراهيم أحمد، يشغل حالياً منصب نائب رئيس وزراء إقليم كردستان
      وهو متزوج من سيدة الأعمال الأمريكية اليهودية شيري كراهام، وله شهادة من في الهندسة الميكانيكية من جامعة كينغستن في بريطانيا.
    - قبل هذا الانهيار كانت هناك بوادر خلافات ظهرت بين زعيم الحزب الديمقراطي الكردستاني مصطفى البارزاني وجلال طالباني الذي
      كان عضوا في اللجنة المركزية للحزب انذاك مما أدى إلى انفصال جلال طالباني عن الحزب ليشكل حلفا مع الحكومة المركزية العراقية
      انذاك.
    - ولاحظت انطونيا جوهاز تركيز هذه الدراسة على النفط العراقي في فصل الافتتاح والتوصية 63 وخلص إلى أن مجموعة دراسة العراق
      مددت الحرب على العراق حتى شركات النفط الأميركية قد ضمنت الحصول القانونية لجميع حقول النفط العراقية. ودعا الرئيس العراقي
      جلال الطالباني نتائج المجموعة "بالخطيرة جدا" على سيادة العراق والدستور.وقال الطالباني "ككل، أنا أرفض هذا التقرير،".
    - تم تأسيس الحزب الديمقراطي الكردي (PDK) في عام 1946م من قبل الملا مصطفى بارزاني، بدافع من أجل الحكم الذاتي الكردي في
      ظل الحكومة العراقية. في عام 1975م، ظهر حزب سياسي آخر في كردستان العراق، بقيادة جلال طالباني - الاتحاد الوطني الكردستاني.
      منذ تأسيس الاتحاد الوطني الكردستاني، كانت تفتقر إلى التعاون. وتشارك في نزاع عنيف مع الحزب الديمقراطي الكردستاني بسبب
      الفلسفات والديموغرافيات والأهداف المختلفة.
    - آلا تحسين حبيب الطالباني هي قائدة كردية، ومن أقارب الرئيس العراقي السابق جلال الطالباني، وقد شغلت منصب رئيسة كتلة الاتحاد
      الوطني الكردستاني في مجلس النواب العراقي على مدار 3 دورات.
  - source_sentence: كم نوع للملاريا؟
    sentences:
    - 'كانت أراضي مرج السلطان مرعى لخيول السلطان عبد الحميد, ومن هنا جاء اسم الموقع, وقد انتشر مرض الملاريا بين السكان في
      بداية استيطانهم, وقضى على أغلب السكان خلال فترة قصيرة عند بدء استيطانهم.

      كان عدد السطان أول وصولهم إلى مرج السلطان 750 عائلة, أي 3000 ثلاثة آلاف نسمة. وقد سكن قسم منهم حينها في قرية حوش الدوير
      غربي مرج السلطان حوالي 8 كم التي قضي على أغلب سكانها أيضاً من مرض الملاريا وعاد القليل منهم إلى مرج السلطان.'
    - 'المتصورة المنجلية: هذا النوع السائد في أفريقيا، وهو أكثر الأعراض شدة، وهي مسؤولة عن معظم الوفيات الناجمة عن الملاريا.
      المتصورة النشيطة: هذا النوع يوجد معظمه في أسيا، ويسبب أعراض أقل في الحدة ولكن الطفيلي يبقى في الكبد ويسبب انتكاسات لمدة
      تصل إلى أربع سنوات. المتصورة الملارية: هذا النوع يوجد في أفريقيا، ويمكن أن يسبب أعراض الملاريا النمطية، ولكن في حالات
      نادرة من الممكن أن يبقى الطفيل في مجرى الدم لسنوات بدون ظهور أي أعراض، في هذه الحالات من الممكن أن ينقل الشخص الحامل
      للطفيل العدوى إلى أخر سليم إذا قامت البعوضة بلدغه ثم لدغ الشخص السليم. المتصورة البيضوية: يتواجد هذا النوع ومعظمها في
      غرب أفريقيا، على الرغم من ندرته إلا أنه يبقى في الكبد ويسبب انتكاسات لمدة تصل إلى أربع سنوات.'
    - نوعٌ آخر من الفِطْر وهو "بوليبوروس المظلي" الذي ثبت أنه يستطيع تثبيط وكَبْح المُتصوِّرة المنجلية، وهو نوع من الطفيليات
      التي تسبب الإصابة بأخطر نوع من عدوى الملاريا .
    - 'فقر الدم: نتيجة للتكسير المستمر الذي تسببه الملاريا لكريات الدم الحمراء فإن ذلك قد يسبب حالة من حالات فقر الدم الشديد
      حيث تصبح كريات الدم الحمراء غير قادرة على حمل كميات كافية من الأكسجين لأنحاء الجسم مما ينتج عنه شعور الجسم بالكسل والضعف
      والإغماء أحيانًا. الملاريا الدماغية: وفي بعض حالات الملاريا النادرة، فإن خلايا الدم الحمراء المصابة بالملاريا تقوم بسد
      وإغلاق مجرى الأوعية الدموية المؤدية إلى الدماغ وهذا ما يعرف بالأنيميا الدماغية مما يؤدي إلى انتفاخ الدماغ وفي بعض الحالات
      إلى إصابته بضرر دائم. كما يمكن أن تتسبب في حدوث الصرع (وهو عبارة عن نوبات مرضية تتميز بحدوث انقباضات لاإرادية لعضلات
      الجسم) أو أن تؤدي إلى دخول المريض في غيبوبة. مشاكل في التنفس (مثل تجمع المياه في الرئتين) جفاف و حدوث الصدمة تعطل وظائف
      الكبد حدوث نزيف تلقائي الإصابة بالصفارى (اصفرار لون الجلد نتيجة لزيادة مادة تدعى البيلليروبين في الدم) انخفاض مستوى
      السكر في الدم فشل كلوي تضخم وانفجار الطحال'
    - 'هناك نوعان من الملاريا: حميدة وخبيثة. الملاريا الحميدة أقل خطورة وأكثر استجابة للعلاج. الملاريا الخبيثة قد تكون شديدة
      الخطورة، وقاتلة أحياناً. إذا كان هناك شك أن الحالة خبيثة، يجب توفير الرعاية الصحية بأسرع وقت. مسببات الملاريا حوالي
      170 نوع من المتصورات، ولكن أربعة فقط يسبب الملاريا في البشر.'
    - تسبب المتصورة المنجلية المسببة للملاريا الخبيثة النسبة الأكبر لحالات الإصابة بالملاريا في السعودية، وبها أُصيبت 1444
      حالة في عام 2015، تليها المتصورة النشيطة والمتصورة البيضاوية (الملاريا الحميدة الثلاثية) بـ 1164 إصابة، ومن ثم المتصورة
      الملاريية (الملاريا الحميدة الرباعية) بعشر حالات فقط، ومعظم الإصابات في المملكة منفردة بنوع واحد من طفيليات الملاريا،
      ولكن قد تحدث أحيانًا إصابات مختلطة بأكثر من نوع.
    - اكتشف شارل لافران، الطبيب الفرنسي، في 6 نوفمبر 1880، أن الملاريا (والتي أُطلق عليها فيما بعد "حمى مارس") ما هي إلا طفيل
      بروتوزي، وأن البعوض يحمل وينقل مرض الملاريا. إذن فالملاريا مرضٌ طفيليٌ معدٍ والذي ينتقل إلأى البشرعموماً من خلال عضات
      البعوض فيما بين فترتي الغسق والفجر. والسلالة الأوروبية من المرض، والمعروفة باسم "فيفاكس" تيمناً باسم طفيل المتصورة النشيطة
      أو بلازموديوم فيفاكس ، والتي تسبب مرضاً خفيفاً نسبياً، ولكنه مدمراً بصورةٍ مزمنةٍ. في حين تتسبب الطفيليات البائغة ،
      المتصورة المنجلية ، بالإصابة بالنوع الغربأفريقي، والتي ينتج عنها مرضاً منهكاً ومميتاً بصورةٍ حادةٍ.
    - أكدت الوسائل الجزيئية الانتشار الواسع لملاريا المتصورة المنجلية في مصر القديمة. وقد كتب المؤرخ الإغريقي القديم هيرودوت،
      أنه كان يُقَدَم إلى بناة الأهرامات المصرية (تقريبا عام 1700-2700 قبل الميلاد) كميات كبيرة من الثوم؛ ربما لحمايتهم من
      الملاريا. سنفرو مؤسس الأسرة الرابعة، والذي حكم في الفترة 2613-2589 قبل الميلاد، استخدم الناموسية كحماية من البعوض. كانت
      كليوباترا السابعة، الفرعون الأخير لمصر القديمة، أيضاً تنام تحت الناموسية. ومع ذلك، سواء كانت الناموسية تستخدم لغرض الحماية
      من الملاريا أو لغرض دنيوي آخر كتجنب إزعاج قرصات البعوض، فإنها لم تكن معروفة. وقد تم التأكيد على تواجد الملاريا في مصر
      فترة 800 قبل الميلاد تقريبا باستخدام طرق معتمدة على الدي أن إيه (الحمض النووي الصبغي أو DNA).
    - أفريقيا تكافح الملاريا (AFM) هي منظمة غير حكومية مقرها في واشنطن العاصمة، الولايات المتحدة وجنوب أفريقيا والتي تنص على
      أنها "تسعى إلى تثقيف الناس حول آفة الملاريا وتعزيز الاقتصاد السياسي لمكافحة الملاريا". المنظمة عموما "تعزز الحلول القائمة
      على السوق والحرية الاقتصادية باعتبارها أفضل السبل لضمان تحسين الرفاهية وطول العمر المتوقع في البلدان الفقيرة"، حسب البيان
      المالي. تأسست في عام 2000 من خلال إجراء مفاوضات استكهولم بشأن الملوثات العضوية الثابتة، وكان التركيز على تعزيز إعفاء
      الصحة العامة لمبيد الحشرات (دي. دي. تي) في مكافحة الملاريا. حسب الموقع الحالي، مهمتها هي "جعل مكافحة الملاريا أكثر شفافية
      واستجابة وفعالية من خلال تحميل المؤسسات العامة المسؤولية عن تمويل وتنفيذ سياسة دولية فعالة ومتكاملة لمكافحة الملاريا."
    - أوضحت دراسات مؤسسة روكفيلر في المكسيك أن الدي دي تي يظل فعالاً من 6 إلى 8 أسابيع إذا تم رشه على الجدران الداخلية وأسقف
      المنازل وبنايات أخرى. الاختبار الميداني الأول الذي تم فيه رش بقايا الدي دي تي على الأسطح الداخلية للمساكن و ملحقات المباني،
      كان في مركز إيطاليا في ربيع عام 1944. وكان الغرض منه تحديد التأثير المتخلف عن رشه على كثافة الأنوفيليس وبدون استخدام
      أي نوع آخر من وسائل التحكم. بدأ الرش في قصر فولتورنو و،بعد بضعة شهور، في الدلتا والتيبر. تم التأكيد عندها على كفاءة
      المادة الكيميائية التي لم يسبق لها مثيل؛ حيث تمكن المبيد الحشري الجديد من إبادة الملاريا عن طريق إبادة البعوض. ومع نهاية
      الحرب العالمية الثانية، تم القيام ببرنامج تحكم شامل في الملاريا مبني على رش الدي دي تي في إيطاليا. بين عامي 1946 و1951
      في سردينيا ، ثاني أكبر جزيرة في البحر الأبيض المتوسط، قامت مؤسسة روكفيلر بإدارة تجربة واسعة النطاق لاختبار جدوى إسْتراتِيجيّة
      "إبادة الفصائل" في منطقة موبوءة بناقل الملاريا. تم التخلص نهائياً من الملاريا من الولايات المتحدة باستخدام الدي دي تي
      تبعاً للبرنامج القومي لإبادة الملاريا (1947-1952). ساد مبدأ إبادة الملاريا في عام 1955 في التجمع الثامن لمنظمة الصحة
      العالمية وتم تبني الدي دي تي كأداة أولية في الصراع ضد الملاريا.
  - source_sentence: هل يؤدي ورم العصب السمعي لفقدان السمع؟
    sentences:
    - '"ورم العصب السمعي ينمو بشكل تدريجي خلال سنوات، بمعدل 1-2 ملم كل سنة. يزداد حجمه في منطقة نشوئه، وعندما يكبر قد يضغط
      على نسيج الدماغ الطبيعي المحيط به. لا يغزو الورم نسيج الدماغ لكن بفعل الضغط يؤثر عليه، العمليات الحيوية اللازمة للمحافظة
      عل الحياة قد تتعرض للخطر في حالة الأورام الكبيرة التي قد تؤثر بضغط كبير على جذع الدماغ و المخيخ. ويوصف الورم أنه صغير
      (أقل من 1.5سم) متوسط (من 1.5 سم إلى 2.5 سم) أو كبير الحجم (أكبر من 2.5 سم)." الأعراض المبكرة قد لا تستدعي الانتباه؛
      حيث يتم اعتبارها من التغيرات الاعتيادية مع تقدم العمر، أو تعزى للتعرض للضجيج، مما يؤدي لتأخر التشخيص. في 90% من الحالات
      يكون أول عرض هو فقدان السمع في أذن واحدة، مترافق مع طنين في تلك الأذن. فقدان السمع بالعادة يكون تدريجي و يسوء ببطئ،
      مع العلم أنه قد يحصل فجأة في بعض الحالات. قد يصاحب ما سبق شعور بالامتلاء في الأذن المتأثرة. الورم يؤثرعادة على الجزء
      المسؤول عن التوازن من العصب الثامن، لذلك أعراض عدم التوازن وعدم الثبات أو حتى الشعور بالدوار قد تحصل أثناء نمو الورم،
      لكن، أحيانا باقي أجزاء جهاز التوازن تعادل الضرر و قد لا يحصل أي من تلك الأعراض. الأورام الكبيرة قد تضغط على العصب القحفي
      الخامس (العصب ثلاثي التوائم) وذلك قد يؤدي لخدران وتنميل في الوجه، بشكل دائم أو متقطع. أيضاً، قد يضغط الوم على العصب
      القحفي السابع (العصب الوجهي)، لكن لا يتعرض المرضى بالعادة لضعف أو شلل في الوجه. قد يحصل أحيانا ارتفاع الضغط داخل الدماغ
      بسبب الورم قد يؤدي إلى صداع، ترنح في المشي واضطراب في التفكير (تشويش) بالإضافة للتقيؤ، هذا قد يكون من المضاعفات المهددة
      للحياة ويحتاج لعلاج عاجل. الأورام الكبيرة التي تضغط جذع الدماغ قد تؤثر على الأعصاب القحفية المحلية، والعصب القفحي السابع
      نادرا ما يتم ضغطه. إصابة العصب ثلاثي التوائم قد يؤدي إلى فقدان الإحساس في الوجه والفم في نفس جهة الورم. ونادراً ما يصاب
      العصبان القحفيان التاسع (العصب البلعومي اللساني) والعاشر (العصب المبهم) ، ولكن قد تؤدي إصابتهما إلى فقد بعض ردود الفعل
      الطبيعية للعصبين. قد تؤدي الأورام الكبيرة لارتفاع الضغط داخل الجمجمة، بما يرتبط به من أعراض مثل الصداع، والقيء، و تغير
      في الوعي.'
    - 'كما يستخدم المصطلح للإشارة إلى أي تورم في العصب. حتى في حالة عدم وجود نمو غير طبيعي للخلايا. على وجه الخصوص العصب الذي
      ينتج عن الصدمة، غالبا أثناء إجراء العمليات الجراحية. ورم عصبي مورتون يؤثر على القدم. يمكن أن تكون الأورام العصبية مؤلمة،
      أو أحيانًا، كما في حالة ورم العصب السمعي، يمكن أن تؤدي إلى أعراض أخرى.

      إما بشكل سطحي (سطح الجلد، دهون تحت الجلد) أو عميقة مثل بعد عملية استئصال المرارة .غالبا تكون مؤلمة. مرادفات أخرىscar
      neuroma ، amputation neuroma, or pseudoneuroma.'
    - 'الطنين هو إدراك صوت في الأذنين أو الرأس مع عدم وجود مصدر خارجي في الأساس. البعض يسميها "طنين في الأذنين" أو "ضوضاء
      الرأس". وهذه الحالة شائعة جدا تؤثر على 1من 5 من الناس ولا يوجد لها علاج. ليس كل المرضى الذين يعانون من طنين الأذن لديهم
      ورم العصب السمعي وليس كل مرضى ورم العصب السمعي يعانون من طنين. ولكن أغلب الحالات تعاني من طنين في الأذن، سواء قبل أو
      بعد العلاج[4]. ارتفاع الضغط في الأذنين: المرضى بأورام العصب السمعي يشكون أحيانا من شعور بأن آذانهم مسدودة أو "مليئة"
      [4].'
    - اقترحت دراسات قام بها باحثون من جامعة أستراليا الغربية أن الطنين يكون بسبب زيادة النشاط العصبي في الدماغ السمعية حيث
      يستقبل المخ الأصوات، مما يؤدى إلى أن بعض خلايا العصب السمعي تصبح مثارة. وبناء على هذه النظرية فإن معظم الناس مع الطنين
      أيضا يعانون من فقدان السمع ، والترددات التي لا تُسمع ترتبط بالترددات الغير موضوعية للطنين. نماذج من فقدان السمع ويؤيد
      المخ الفكرة القائلة بأن رد فعل التماثل الساكن من نواة الخلايا العصبية المركزية الخلفية يمكن أن يؤدي إلى إثارتها في عملية
      تعويض لفقدان مدخلات السمع. وهذا بدوره يتصل بالتغيرات في الجينات المسؤولة عن تنظيم نشاط هذه الخلايا العصبية. تقترح هذه
      الآلية المقترحة العلاجات الممكنة للحالة، والتي تنطوي على تطبيع أو قمع النشاط العصبى الزائد من خلال وسائل كهربائية أو
      كيميائية.
    - "(SSD)... \nهو احد انواع صمم حيث يكون السمع طبيعي في أذن واحدة و ضعيف في الأذن الأخرى.\nالمرضى في هذه الحالة من الصمم\
      \ يواجهون صعوبة في :\nفي حالة الظروف الهادئة، يكون تمييز الحديث ليس أسوأ من السمع الطبيعي للمرضى ذوي الصمم الجزئي، \n\
      و مع ذلك، في حالة الضوضاء يكون تمييز الحديث بمشقة. \nالحالات المعروفة تشمل الصدمات الجسدية، ورم العصب السمعي، الحصبة،\
      \ التهاب الأذن الداخلية،صغر صيوان الاذن Microtia، التهاب السحايا، مرض منيير، متلازمة واردينبيرغ، النكاف، التهاب النتوء\
      \ الحلمي. \nدراسة في عام 1998 على تلاميذ المدارس اوضح ان بين ألف تلميذ، 6-12 لديهم نموذج من حالة فقدان السمع بجهة واحدة،\
      \ 0-5 من حالة متوسطة إلى شديدة \"prfound\"."
    - خيار آخر لعلاج أورام العصب السمعي هو الإشعاع. يمكن تقديم الاشعاع الجسيمي كجلسة واحدة بالجراحة الجسيمية(SRS) او كمعالجة
      اشعاعية جسيمية (FSR)مجزأة على عدة جلسات. يتم تنفيذ كل من التقنيات في العيادات الخارجية، التي لا تتطلب التخدير العام
      أو الإقامة في المستشفى. والغرض من هذه التقنيات هو لوقف نمو الورم مما يتسبب في موت الورم، وهو ما يسمى النخر. هذا العلاج
      لم يتم دراسته جيدا، وبالتالي فإنه من غير الواضح ما اذا كان أفضل من المراقبة أو الجراحة.[13] في العلاج بجلسة واحدة، يتم
      توجيه عدة مئات من حزم الاشعاعات الصغيرة إلى الورم، وهذا يؤدي إلى جرعة عالية من الإشعاع إلى الورم وقليلة جدا على هياكل
      الدماغ المحيطة بها. وقد تمت معالجة العديد من المرضى بهذه الطريقة مع معدلات نجاح عالية. ضعف في الوجه أو خدر على أيدي
      أطباء الأشعة ذوي الخبرة، يحدث فقط في نسبة صغيرة من الحالات. يمكن الحفاظ على السمع في بعض الحالات مع فرصة أكبر قليلا
      مع FSR. علاج متعددة الجرعات، FSR، يقدم جرعات صغيرة من الإشعاع على مدى فترة من الزمن، مما يتطلب من المريض العودة إلى
      مكان العلاج يومياً، من 3 إلى 30 مرة، على مدى عدة أسابيع. كل زيارة تستمر بضع دقائق ومعظم المرضى أحرار في الذهاب إلى أعمالهم
      اليومية قبل وبعد كل جلسة علاج. وتشير البيانات في وقت مبكر أن FSR قد يؤدي إلى تحسين الحفاظ على السمع بالمقارنة إلى جلسة
      واحدة SRS. فريق المعالجة يجب أن يتكون من جراح اعصاب و/ او طبيب اعصاب (جراح الأذن وقاعدة الجمجمة) ، واختصاصي الأورام
      الإشعاعي والفيزيائي. المتابعة بعد SRS وFSR عادة ما تنطوي على التصوير بالرنين المغناطيسي وتخطيط السمع بعد ستة أشهر، سنة
      واحدة، ثم سنويا لعدة سنوات، ثم كل سنتين أو ثلاث سنوات إلى أجل غير مسمى للتأكد من عدم بدء الورم في النمو مرة أخرى. ينبغي
      أن يفهم المرضى أن كل أنواع العلاج الإشعاعي للورم العصبي السمعي قد يؤدي إلى "السيطرة على الورم" الذي يؤدي إلى موت الخلايا
      السرطانية وحدوث النخر. تعني السيطرة على ورم أن نمو الورم قد يبطؤ أو يتوقف، وفي بعض الحالات، الورم قد يتقلص . في الحجم،
      ولم يتم القضاء التام على الورم في اي من علاجات الورم الاشعاعية، وبعبارة أخرى، الإشعاع لا يقوم بإزالة الورم مثل الجراحة
      المجهرية. علاوة على ذلك، المرضى يحتاجون إلى متابعة بالتصوير بالرنين المغناطيسي لمدى الحياة . الأورام تحت 2.5 - 3.0 سم،
      دون اصابة كبيرة لجذع الدماغ، هي أكثر ملاءمة للعلاج الإشعاعي. يمكن أن تحدث آثار جانبية عند تعرض جذع الدماغ للاشعاع، وفي
      بعض حالات الأورام الكبيرة العلاج الاشعاعي مرفوض . هناك تقارير نادرة من التنكس الخبيث ( ورم حميد أصبح خبيث) بعد العلاج
      الإشعاعي. في بعض الحالات لا يموت الورم ويستمر في النمو، في تلك الحالات، من الضروري اللجوء لعلاج آخر - إما جراحة مجهرية
      أو أحيانا جرعة أخرى من الإشعاع. ويجب أن يتم إعادة المعالجة كما هو الحال دائما في أيدي الأطباء ذوي الخبرة.
    - مباشرة بعد عملية جراحة العصب السمعي، من المتوقع الشعور بآلام الرأس في معظم المرضى (المرحلة الحادة) بسبب الشق الذي تم
      خلال العملية، الاختلافات في ضغط السائل النخاعي، ألم في العضلات، أو حتى ألم التهاب السحايا. ويستجيب عادةً للأدوية المخصصة
      ويختفي خلال عدة أسابيع. الصداع الذي لا يزال قائما لمدة شهور أو حتى سنوات بعد الجراحة (المرحلة المزمنة) قد يؤثر على حياة
      الشخص. و يعتبر الصداع أحيانا كعرض لا يقدر الجميع مساوئه عند معالجة الورم العصب السمعي. في المرضى الذين يعانون من الصداع
      المزمن، الألم في كثير من الأحيان يستمر لفترات طويلة من الزمن، ولا يستجيب دائما بشكل جيد لمختلف العلاجات الطبية والجراحية،
      نسبة حدوث وأسباب الصداع المزمن بعد العملية الجراحية (POH) غير معروفة، تراوحت الحالات التي تعاني من الصداع بعد العلاج
      الجراحي للورم العصب السمعي والمبلغ عنها في جمعية المصابين بورم العصب السمعي 2012 ما بين 0٪ إلى 35٪ اعتمادا على نوع نهج
      الجراحة، التقنية المستخدمة والإبلاغ عن الحالة بعد الجراحة. الصداع المتكرر المصاحب لما بعد العملية قد تمت ملاحظته أكثر
      عند استخدام نهج تَحْتَ القَذال او نهج التحت السيني مقارنة بنهج فوق التيهي و نهج الحفرة الوسطى.
    - يستند النهج المتبع لكل فرد على عدة عوامل مثل حجم الورم وموقعه ومهارة وخبرة الجراح، وعما إذا كان الحفاظ على السمع هدف.
      كل نهج جراحي له مزاياه وعيوبه، وحُققت نتائج ممتازة باستخدام كل من التقنيات الثلاث[9].
    - هو النهج المفضل لدى طاقم الجراحة عندما يكون المريض فاقد لسمعه، أو عملية الحفاظ على السمع غير عملية. الشق لهذا النهج
      يكون خلف الأذن و يكشف القناة السمعية الداخلية والورم بشكل جيد.وهذا يؤدي أيضا إلى فقدان السمع بشكل دائم و كامل في تلك
      الأذن، ولكن الجراح لديه افضلية و هي معرفة موقع العصب الوجهي قبل تشريح الورم وإزالته. يمكن إزالة أي ورم بغض النظر عن
      الحجم باستخدام هذا النهج وهذا النهج يتيح أقل احتمال للاصابة بصداع الراس طويل المدى المصاحب لما بعد العمليات.[11]
    - الشق لهذا النهج يقع في موقع مختلف قليلا. هذا النهج يخلق فتح في الجمجمة وراء الجزء الخشاء من الأذن، بالقرب من مؤخرة الرأس
      و من جانب الورم. الجراح يكشف الورم من الجزء الخلفي، وبالتالي الحصول على رؤية جيدة للورم بالنسبة لجذع الدماغ. عند إزالة
      أورام كبيرة باستخدام هذا النهج، يمكن أن يكشف العصب الوجهي عن طريق الفتح المبكر للقناة السمعية الداخلية. ويمكن إزالة
      أي ورم بغض النظر عن حجم ذلك الورم باستخدام هذا النهج. واحدة من المزايا الرئيسية لنهج خلف السيني هو إمكانية الحفاظ على
      السمع. للأورام الصغيرة، العيب يكمن في الاصابة بصداع الراس طويل المدى المصاحب لما بعد العمليات.[12]
