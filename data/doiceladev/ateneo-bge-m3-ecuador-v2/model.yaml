  - "Inserción velamentosa del cordón: los vasos umbilicales se abren dentro de las membranas a cierta distancia del borde\
    \ placentario, el cual alcanzan circundados solo por un pliegue de amnios [12].\n\nVasa previa: condición de alto riesgo\
    \ obstétrico en la cual los vasos sanguíneos aberrantes procedentes de la placenta o del cordón umbilical, cruzan la entrada\
    \ del canal del parto por delante de la presentación fetal [13].\n\n9.\t Aspectos relevantes de las anomalías de inserción\
    \ placentaria y vasos\n\nsanguíneos fetales\n\nLas anomalías de la inserción placentaria y de los vasos sanguíneos fetales\
    \ se clasifican en placenta previa, acretismo placentario, vasa previa e inserción velamentosa del cordón umbilical.\n\
    \nLa sospecha clínica de placenta previa debe darse cuando clásicamente se presenta un sangrado indoloro generalmente\
    \ rojo. Se piensa que el sangrado se produce en asociación con el desarrollo del segmento uterino inferior en el tercer\
    \ trimestre, es una de las principales causas de hemorragia en el tercer trimestre [14].\n\nLa placenta previa puede asociarse\
    \ a placenta acreta, increta o percreta. Esa fijación anormalmente firme de la placenta podría deberse a una disminución\
    \ del grosor de la capa basal del endometrio que generaría deciduas que están poco desarrolladas, condición que puede\
    \ ocurrir por lesiones secundarias a legrados y cirugías previas con la cesárea; por tanto, es más frecuente que se presente\
    \ en el segmento uterino inferior. En la placenta acreta puede haber adicionalmente un desarrollo imperfecto de la capa\
    \ fibrinoide o de Nitabuch, lo que hace que las vellosidades se fijen al miometrio. En la placenta increta, estas invaden\
    \ al miometrio y, en la placenta percreta, penetran a través del miometrio. Es posible que esté adherido todo o parte\
    \ de un solo lóbulo o todos los cotiledones. El diagnóstico histológico de placenta acreta no puede establecerse con la\
    \ placenta sola, se necesita el útero o material de raspado con miometrio [12]."
  - '• Score radiológico


    En los niños menores de cinco años o en las formas leves de la enfermedad, la radiografía de tórax puede ser normal; no
    obstante, se recomienda realizarla al momento del diagnóstico. En lo posterior, se instará de forma progresiva cambios
    como el atrapamiento aéreo, imágenes varias de consolidación (neumonía, atelectasias), bronquiectasias, lesiones quísticas
    y finalmente imágenes de fibrosis pulmonar claramente establecida. Por eso es útil emplear un sistema de puntuación, que
    permita evaluar las alteraciones radiológicas; para ello, el más utilizado es el score de Brasfield, que se lo obtiene
    restando los 25  puntos de la radiología normal de los obtenidos en cada categoría.


    Anexo 2. Score de Brasfield'
