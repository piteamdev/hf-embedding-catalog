    rate. Financial Liabilities Carried At Other Than Fair Value Certificates of Deposit Certificates of deposit (CDs) are
    recorded at their historical issuance cost on the Consolidated Balance Sheets. Fair value is estimated using a discounted
    cash flow methodology based on the future cash flows and the discount rate that reflects the current market rates for
    similar types of CDs within similar markets. Long-term Debt Long-term debt is recorded at historical issuance cost on
    the Consolidated Balance Sheets adjusted for (i) unamortized discount and unamortized fees, (ii) the impact of movements
    in exchange rates on foreign currency denominated debt and (iii) the impact of fair value hedge accounting on certain
    fixed-rate notes that have been swapped to floating rate through the use of interest rate swaps. The fair value of our
    long-term debt is measured using quoted offer prices when quoted market prices are available. If quoted market prices
    are not available, the fair value is determined by discounting the future cash flows of each instrument at rates currently
    observed in publicly-traded debt markets for debt of similar terms and credit risk. For long-term debt, where there are
    no rates currently observable in publicly traded debt markets of similar terms and comparable credit risk, we use market
    interest rates and adjust those rates for necessary risks, including our own credit risk. In determining an appropriate
    spread to reflect our credit standing, we consider credit default swap spreads, bond yields of other long-term debt offered
    by us, and interest rates currently offered to us for similar debt instruments of comparable maturities. NONRECURRING
    FAIR VALUE MEASUREMENTS We have certain assets that are subject to measurement at fair value on a nonrecurring basis.
