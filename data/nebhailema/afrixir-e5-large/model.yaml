      ዞን የኢፌዲሪ ጠቅላይ ሚንስትር አቢይ አሕመድ (ዶ/ር) በትናንትናው ዕለት ታኅሳስ 13/2013 ከአካባቢው ነዋሪዎች እና የተለያዩ የሕብረተሰብ ክፍሎች ጋር በአካባቢው ዘላቂ ሰላም ለማምጣት
      ሲመክሩ እንደነበር የሚታወስ ነው። በውይይቱም ጠቅላይ ሚንስትሩ በተፈጠሩት ችግሮች ተሳተፉ ከክልል እስከ ፌደራል የሚገኙ አመራሮች ለሕግ እንደሚቀርቡም መናገራቸው አይዘነጋም።'
    - 'passage: ጠቅላይ ሚኒስትር ዐቢይ አህመድ በመተከል ዞን ነዋሪዎችን ባወያዩበት ማግስት ጭፍጨፋ መፈጸሙ ለሰጡት የሥራ መመሪያ የቤኒሻንጉል ጉሙዝ ክልል አመራሮች ተገዢ አለመሆናቸውን
      እንደሚያሳይ ተገለጸ፡፡በመተከል ዞን ቡለን ወረዳ ዛሬም ዘርን መሰረት ያደረገ ጭፍጨፋ እንደተፈጸመ ነዋሪዎች ለአብመድ ገልጸዋል፡፡ድርጊቱ ካሁን ቀደም በተደጋጋሚ የተፈጸመ ቢሆንም አሁንም
      እየተባበሰ መምጣቱን ነዋሪዎች ተናግረዋል፡፡ጭፍጨፋው ዘር ተኮር በመሆኑ ሁሉም የኢትዮጵያ ህዝቦች ድርጊቱን በማውገዝ የጋራ ድምጽ ማሰማት እንዳለባቸው የሕግ አማካሪዉ አስረስ ማረ ገልጸዋል፡፡'
    - 'passage: በጉባ ወረዳ አቡጃር ቀበሌ በሚኖሩ የአማራ ክልል ተወላጆች ላይ የታጠቁ ኃይሎች ትናንት ሌሊት በድንገት ጥቃት መፈጸማቸውን የአካባቢው ነዋሪዎች ለአብመድ አረጋግጠዋል፡፡
      በዚህም የንጹኃን ሕይወት ጠፍቷል፤ ለአካል ጉዳትም ተዳርገዋል፡፡ ተጎጂዎች የሕክምና ዕርዳታ እየተደረገላቸው እንደሆነም ምንጮቻችን ነግረውናል፡፡'
    - 'passage:  በተለይም በቤንሻንጉል ጉዝም ክልል መተከል ዞን ዳንጉር ወረዳ ሕዝብ ላይ ጥቃት መድረሱ ተቀባይነት የሌለውና አሳዛኝ መሆኑን ገልፀው የመንግሥት የፀጥታ ኃይሎች፣ የሕግ
      የባላይነትና ሰላም የማስከበሩብ ኃላፊነት እንደሚወጡ ተናግረዋል፡፡ጉዳዩ የሚያስቆጭና የሚያስቆጣ ቢሆንም ግን ሕዝብ ለሕዝብ የራሱ ያፀፋ ዕርምጃ እንዳይወስድ መክረዋል፡፡  '
    - 'passage: ባሕር ዳር፡ ኅዳር 03/2013 ዓ.ም (አብመድ) የጠቅላይ ሚኒስትር ጽሕፈት ቤት በይፋዊ ገጹ መልዕክት አስተላላፏል፡፡“እውቅና ያላቸውን ዓለም አቀፍ ድርጅቶች ጨምሮ ሁሉም
      ግለሰብ በወቅታዊ ሁኔታዎች ላይ በመሬት ላይ ያለውን እውነታ የማያንፀባርቅና ያልተረጋገጠ መረጃ ከማሰራጨት እንዲቆጠቡ እናሳስባለን” ብሏል፡፡'
  - source_sentence: 'query: ኣብ ዓመጺ - ንኡስ ዞባ በሪኽ ኣብ መንጎ ደቂ ዓዲ ዝጸንሐ ዘይምርድዳእ፡ ብመዓስ ኣብ ዝተኻየደ ስነ-ስርዓት ብዕርቂ ተፈቲሑ?'
    sentences:
    - 'passage: ንጸጸር ኩሊት ዘቃልዑ ዋሕዲ ፈሰስቲ፡- እዚ ሓደ ካብቶም ቀንዲ ጠንቅታትን ተኽእሎታት ጸጸር ኩሊት ዘጋድዱን እዩ። ሓደ ሰብ ኣብ መዓልቲ ክሳብ ሰለስተ ሊትሮ ማይ የድልዮ።
      እዚ ማይ’ዚ ብመልክዕ ጽሩይ ማይ፡ ፈሰስቲ፡ ወይ ምስ መግቢ ናብ ኣካላት ይኣቱ። ኣብ ዝተፈላለዩ ጥቕምታት ምስ ወዓለ ኣብ ኩሊት ይጻረ’ሞ ብመልክዕ ሽንቲ ንደገ ይወጽእ። እዚ መጠን ማይ
      ኣብ ኣካላትና ብዝተፈላለዩ ምኽንያታት ምስዘይህሉ፡ ጸጸር ኣብ ኩሊት ወይ ስርዓተ ሽንቲ ክኽሰት ዘለዎ ተኽእሎ ኣዝዩ ይዓቢ።'
    - 'passage: ዓመጺ፡ ኣብ መንጎ ደቂ ዓዲ ዝጸንሐ ዘይምርድዳእ ብዕርቂ ተፈቲሑ

      ኣብ ዓመጺ - ንኡስ ዞባ በሪኽ ኣብ መንጎ ደቂ ዓዲ ዝጸንሐ ዘይምርድዳእ፡ ብ22 ለካቲት ኣብ ዝተኻየደ ስነ-ስርዓት ብዕርቂ ተፈቲሑ።


      ወኪል ሚኒስትሪ ዞባዊ ምምሕዳር፡ መራሕቲ ሃይማኖት፡ ኣባላት ባይቶን ተወለድቲ ዓድን ኣብ ዝተረኽቡሉ ስነ- ስርዓት፡ ኣመሓዳሪ ዞባ ማእከል ሜጀር ጀነራል ሮሞዳን ዑስማን ኣውልያይ ኣብ ዘስመዖ
      ቃል፡ ናጽነት ፍረ ሓያል ሓድነትን ክቡር መስዋእትነትን ምዃኑ ድሕሪ ምጥቃስ፡ እዚ ክብርታት’ዚ’ውን ኣብ ህንጸት ሃገር መሰረታዊ ብምዃኑ፡ ዜጋታት ዕጥቆም ክገብርዎ ኣዘኻኺሩ።'
    - 'passage: ቁንጣሮ ብዛዕባ ሓርማዝ

      ኣብቲ ኣብ ኬንያ ዝርከብ ሰፊሕ ሃገራዊ መናፈሻ እምቦሶሊ ድሕሪ ቐትሪ ኣብ ግዜ ሃሩር: ብዙሓት መጓሰ ሓራምዝ ኣብ ሰፈሮም ዝህውኾም ነገራት ዘይብሎም ቀሲኖም ዝነብሩ ኢዮም ዝመስሉ። ይኹን
      እምበር: ካብቲ ትሑት ዕርምርም ዝብል ድምጺ ጀሚርካ ኽሳዕ እቲ ብርቱዕ ገዓር: እርታ: ነብሒ: ኩርፍታ እተፈላለየ “ዘረባ ሓርማዝ” ይስማዕ ኢዩ። ገለ መጠን ናይቲ ድምጺ ትሑት ፍሪኰንሲ
      ስለ ዘለዎ ወድሰብ ክሰምዖ ዘይክእል እኳ እንተዀነ ኣዝዩ ብርቱዕ ካብ ምዃኑ እተላዕለ ሓያሎ ኪሎ ሜተራት ርሒቑ ዘሎ ሓርማዝ ግን ክሰምዖ ይኽእል ኢዩ።'
    - 'passage: ኣብ እርጋኑ ከይተረፈ ኣቦይ ንዘልዎ ‘እታ ቅድሚ ዳኘው ደላ ግደፋ’ ይብሉ ነይሮም ይብልዎም። መውረርያኹም እንዶ ግዳ ሰሓቡ፡ ነገር ፈረሰኛ መርዓት ከይስሕቶ።

      መርዓዊን መርዓትን ‘ኣሽነን በለ’ ብዝብሃል ወግዒ ካብ ቤት ሒማ ንእንዳ መርዓዊ ይኣትው። ካብኡ ተረፈ ሓደ ምርጫ ይተርፍ። መርዓዊ ወደይ ዝብሎ ስድራ እንተዘይ ሃለወ መርዓዊ መርዓቶም
      ሒዞም ናብ ሓደ ዓበይቲ ዓዲ ዘዳለውዎ ቤት ይኣትው። ‘ቤት ጸኒሕ’ ከኣ ይብልዎ። እዚ ቤት ንኸምዚ ጥራሕ ዘይኮነ ካበየ ቦታታት ንዝተፈላለየ ምኽንያት ዝመጹ ገያሾ‘ውን ክኣትውዎ ይኽእሉ።
      ጥሪ ኣትዩ ጾመ ኣርብዓ ክሳዕ ዝሓልፍ ግና እዚ ቤት ንኻልእ ምዓላ ኣይውዕልን። እቶም ጸጋ ምድርን ሰማይን ዘለዎም መርዓዊ ግና ናብ ጠለት ስድራኦም ይኣትዉ።'
    - 'passage: ኣካላት ፈሳሲ ምስ ዝበዝሖ ወይ ምስ ዝውሕዶ ነዚ ምቅይያራት ንምዕትርራይ ኩላሊት ኣብ ዝያዳ ስራሕ ይጽመዳ። ኩሊት ዝተፈላለዩ ነዝዕታ፡ ኣብ ምምስራሕን ምምንጫውን ትነጥፍ።
      ከም ኩሉ ክፋል ኣካላት፡ ኩሊት ብዝተፈላለዩ ጠንቅታት ብሕማም ክትጥቃዕ ትኽእል። ናብ ቅልጡፍ ውድቀት ወይ’ውን ቀስ ብቐስ ሕዱር ውድቀት ከምጽኡ ዝኽእሉ ሕማማት ኩሊት ኣለዉ። እዚ ማለት
      ግን ኩሎም ሕማማት ኩሊት ናብ ውድቀት ይምዕብሉ ንምባል ኣይኮነን። ጸጸር ኩሊት ሓደ ካብ ሕማማት ኩሊት’ዩ።'
  - source_sentence: 'query: የኪርጊዝ ሪፐብሊክ እግር ኳስ ፌዴሬሽን'
    sentences:
    - "passage: ሱክሬ በይፋ የቦሊቪያ ዋና ከተማ ነው።\n\nበ1890 ዓ.ም. የቦሊቪያ መንግሥት መቀመጫ በተግባር ከሱክሬ ወደ ላፓዝ ተዛወረ። ይሁንና በሕጋዊ ረገድ (በስም ብቻ) ሱክሬ\
      \ እስከ ዛሬ ድረስ ዋና ከተማነቱን ይዟል።   ላይኛ ችሎቱ ግን እስካሁን በሱክሬ ይገኛል። \n\nቦሊቪያ\nዋና ከተሞች"
    - "passage: የኪርጊዝ ሪፐብሊክ እግር ኳስ ፌዴሬሽን የኪርጊዝስታን እግር ኳስ አስተዳዳሪ አካል ነው። ፌዴሬሽኑ የኪርጊዝስታን ብሔራዊ እግር ኳስ ቡድንንና የኪርጊዝስታን ብሔራዊ ፉትሳል\
      \ ቡድንን ይቆጣጠራል። በተጨማሪም የተለያዩ ብሔራዊ ውድድሮችን ያዘጋጃል።\n\nየውጭ መያያዣዎች\n  ይፋዊ ድረ ገጽ\n  የፊፋ ድረ ገጽ ስለ ኪርጊዝስታን \n\nኪ\nኪርጊዝስታን"
    - 'passage: ስላቫዊ ቋንቋዎች ወይም ስላቪክ ቋንቋዎች አንድ የሕንዳዊ-አውሮፓዊ ቋንቋዎች ቤተሠብ ቅርንጫፍ ናቸው። ከባልታዊ ቋንቋዎች ጋራ አንድላይ የባልቶ-ስላቫዊ ቋንቋዎች ቅርንጫፍ
      ይሠራሉ።


      ስላቫዊ ቋንቋዎች ሁሉ ከቅድመ-ስላቭኛ ደረሱ፤ እሱም ከቅድመ-ባልቶ-ስላቭኛ እንደ ደረሰ ይታስባል።


      የስላቫዊ ቅርንጫፍ ሦስት ክፍሎች ምሥራቅ ስላቫዊ፣ ምዕራብ ስላቫዊ እና ደቡብ ስላቫዊ ናቸው።


      ምሥራቅ ስላቫዊ

      ሩስኛ

      ሩጤንኛ *

      ቤላሩስኛ

      ዩክሬንኛ


      ምዕራብ ስላቫዊ

      ፖልኛ

      ካሹብኛ

      ሳይሌሲያን

      ቸክኛ

      ስሎቫክኛ

      ሶርብኛ *

      ላይኛ ሶርብኛ

      የታችኛው ሶርብኛ


      ደቡብ ስላቫዊ

      ቡልጋርኛ

      ሰርብኛ

      ክሮኤሽኛ

      ስሎቬንኛ

      መቄዶንኛ


      ሰው ሠራሽ ቋንቋዎች

      ቸርች ስላቪክ

      ኢንተርስላቪክ'
    - 'passage: የኮንጎ ዲሞክራስያዊ ሪፑብሊክ ሞሴ ካቱምቢ (Moise Katumbi) የተባሉ ተቃዋሚ ፖለቲከኛ ባዕዳን ቅጥረኞችን ተጠቅመዋል በሚለው ወሬ ላይ ምርመራ እንደጀመረች የመንግስት
      ባለስልጣኖች ትላንት ረቡዕ ተናግረዋል።የፍትህ ሚኒስትር አሌክስ ታምብዌ ምዋምባ በርካታ የቀድሞ አሜሪካውያን ወታደሮች በካታንጋ ክፍለ-ሀገር የካቱምቢ ጠባቂዎች ሆነው እንየሰሩ መሆናቸውን
      የሚያሳይ “የሰነድ መረጃ” አለን ብለዋል።ካታንጋ የተባለችው የነሃስ ማዕዳን ያላት ክፍለ-ሀገር አስተዳዳሪ ሆነው ሰርተው የነበሩት ካቱምቢ ባለፈው መስከረም ወር ከፕረዚዳንት ጆሴፍ ካቢላ
      መንግስት ወጥተው ከተቃዋሚዎች ጋር ተቀላቅለዋል።አንድ ተቃዋሚ ቡድን ካቱምቢ በያዝነው አመት በሚካሄደው ፕረዚዳንታዊ ምርጫ እንዲወዳደሩ የሚጠይቅ የስም ዝርዝር ባለፈው እሁድ አቅርቦ ካቱምቢ
      ተቀብለውታል።ተቃዋሚው ፖለቲከኛ ባዕዳን ቅጥረኞችን እየመለመሉ ነው የሚለውን ክስ አስተባብለዋል። እኔን በፖለቲካ ለመጉዳት የታቀደ ክስ ነው ብለዋል።'
    - 'passage: ኮንጎ ዴምክራሲያዊት ሪፖብሊክ ምሥራቃዊ አካባቢዎች ውስጥ እሥላማዊ ታጣቂዎች ትናንት ፈፀሙት በተባለ ጥቃት 46 ሲቪሎች መገደላቸውን የክፍለሃገሩ የደህንነት ኃላፊ አድጆ
      ጊዲ ለሮይተርስ ገልፀዋል።የተባበሩት ዴሞክራሲያዊ ኃይሎች የሚባል ቡድን ከጥቃቱ ጀርባ እንዳለ በመጠቆም የከሰሱት ጊዲ ኢሩሙ በሚባለው አካባቢ ወደምትገኘው ቀበሌ ወታደሮች መላካቸውንና ምርመራ
      መጀመሩን አመልክተዋል። ምሥራቃዊዎቹ የኮንጎ አካባቢዎች ላይ ባለፉት ሁለት ዓመታት ውስጥ በዚሁ ታጣቂ ቡድን በተጣሉ ጥቂቶች ከአንድ ሺህ በላይ ሲቪሎች መገደላቸውን የተባበሩት መንግሥታት
      ድርጅት መረጃ ይጠቁማል።በዩሃንዳ፣ በሩዋንዳና በቡሩንዲ አዋሳኝ አካባቢዎች ላይ ከመቶ በላይ ታጣቂ ቡድኖች በየጫካው እንደሚገኙ ተዘግቧል። ቀደም ሲል ለተጣሉት ጥቃቶች እሥላማዊ መንግሥት
      ቡድን ኃላፊነት ቢወስድም የመንግሥታቱ ድርጅት ግን በታጣቂዎቹና በእሥላማዊ መንግሥት ቡድን መካከል ግንኙነት ሰለመኖሩ ማረጋገጫ አለማግኘቱን ይናገራል።'
