    \ ~ tc.function.name -%}\n                        {%- endif -%}\n                    {%- endfor -%}\n                {%-\
    \ endif -%}\n            {%- endfor -%}\n        {%- endif -%}\n    {%- elif message.role == \"assistant\" and message.name\
    \ is defined and message.name -%}\n        {%- set header.text = header.text ~ message.name -%}\n    {%- endif -%}\n \
    \   {%- set rtok = header.text -%}\n    {%- set rendered -%}\n\n    {%- if message.role == \"assistant\" and message.reasoning_content\
    \ is defined and message.reasoning_content -%}\n        {{- rtok ~ \"<|content_thinking|>\" ~ message.reasoning_content\
    \ ~ \"<|end_message|>\" -}}\n    {%- endif -%}\n\n    {%- if message.content is string and (message.content or not (message.role\
    \ == \"assistant\" and (message.tool_calls or message.reasoning_content))) -%}\n        {{- rtok ~ \"<|content_text|>\"\
    \ ~ message.content ~ \"<|end_message|>\" -}}\n    {%- elif message.content -%}\n        {%- for part in message.content\
    \ -%}\n            {%- if part is string -%}\n                {{- rtok ~ \"<|content_text|>\" ~ part ~ \"<|end_message|>\"\
    \ -}}\n            {%- elif part.type is not defined or part.type in (\"text\", \"input_text\") -%}\n                {%-\
    \ set text_part = (part.text if part.text is defined and part.text is string else \"\") -%}\n                {{- rtok\
    \ ~ \"<|content_text|>\" ~ text_part ~ \"<|end_message|>\" -}}\n            {%- elif part.type in (\"image\", \"input_image\"\
    , \"image_url\") -%}\n                {%- if message.role not in (\"user\", \"tool\") -%}\n                    {{- raise_exception(\"\
    Image content is only supported for user and tool messages\") -}}\n                {%- endif -%}\n                {{-\
    \ rtok ~ \"<|content_image|><|unused_200054|><|end_message|>\" -}}\n            {%- elif part.type in (\"audio\", \"input_audio\"\
    , \"audio_url\") -%}\n                {{- raise_exception(\"Inkling 2 does not accept audio input\") -}}\n           \
    \ {%- else -%}\n                {{- raise_exception(\"Unsupported content part type: \" ~ part.type) -}}\n           \
    \ {%- endif -%}\n        {%- endfor -%}\n    {%- endif -%}\n\n    {%- if message.role == \"assistant\" and message.tool_calls\
    \ -%}\n        {%- for tc in message.tool_calls -%}\n            {%- set fn = tc.function -%}\n            {%- if fn.name\
    \ is not defined or fn.name is not string -%}\n                {{- raise_exception(\"tool call function name must be a\
    \ string\") -}}\n            {%- endif -%}\n            {%- if message.name is defined and message.name and message.name\
    \ != fn.name -%}\n                {{- raise_exception(\"assistant name \" ~ message.name ~ \" does not match its tool\
    \ call \" ~ fn.name) -}}\n            {%- endif -%}\n            {%- set args = fn.arguments if fn.arguments is defined\
