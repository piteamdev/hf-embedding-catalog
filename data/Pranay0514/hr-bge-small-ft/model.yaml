      \ (ESI) Scheme. Coverage begins after 30 consecutive days of employment and requires a minimum of 20 working hours per\
      \ week. The employer contributes 4.75 % of the employee’s wages (up to ₹21,000), while the employee contributes 1.75 %\
      \ toward the scheme.  \n\nESI benefits include:  \n• **Sickness benefits** – up to ₹15,000 for 91 days of sickness per\
      \ year, payable after 15 days of medical certification.  \n• **Maternity benefits** – ₹15,000 for 26 weeks, available\
      \ to female employees after 90 days of employment.  \n• **Disabled and dependent benefits** – up to ₹15,000 for permanent\
      \ disability and ₹5,000 for dependent children per annum.  \n\nEmployees on temporary, seasonal, or contractual arrangements,\
      \ and those earning above ₹21,000 per month, are exempt from ESI coverage. All benefits are subject to the national\
      \ ESI Act limits and can be accessed through the company’s designated ESI portal. The company will provide ESI insurance\
      \ certificates upon completion of the 30‑day probation period."
    - 'Employees are expected to report to their assigned store at least 30 minutes before the official shift start time.
      An employee is considered late if they arrive after the scheduled start time minus the 30‑minute grace period. For full‑time
      staff, a single late arrival is recorded as a 5% attendance penalty. If an employee accumulates more than three late
      arrivals in any 30‑day window, an attendance flag is raised and a formal warning will be issued. A total of six late
      arrivals within a calendar year will lead to a deduction of one day of paid leave from the employee’s annual leave balance.
      Employees with less than 6 months of continuous service are exempt from the penalty until they complete their probationary
      period; thereafter the same rules apply. Part‑time and shift employees are assessed on a pro‑rated basis, with a maximum
      of 2 late arrivals per month allowed before a warning is issued. Exceptions: medical emergencies, documented travel
      disruptions, or store‑wide operational disruptions (e.g., power outage) are excused if the employee submits a written
      notice within 24 hours or a medical'
    - 'Employees eligible for work‑from‑home (WFH) are those in permanent, full‑time roles with a minimum of 6 months tenure,
      holding a regular or higher grade as per the company’s grading system. Each eligible employee may work from home up
      to 2 days per week, not exceeding 8 hours per day, and the total WFH hours must not surpass 70 % of the monthly work
      hours (≈ 120 hours for a 40‑hour work week). WFH is allowed only on days when the employee’s functional responsibilities
      can be fulfilled remotely and no client‑specific on‑site requirement is in place. Managers must obtain prior approval
      for WFH days via the internal portal; approvals are granted by the employee’s immediate supervisor and the HR Business
      Partner. Exceptions include: (i) employees in client‑facing roles with active on‑site contracts, (ii) roles requiring
      physical equipment or presence, (iii) periods of public health or natural disaster where office access is impossible,
      and (iv) emergency situations requiring immediate on‑site presence. The company reserves the right to revoke WFH privileges
