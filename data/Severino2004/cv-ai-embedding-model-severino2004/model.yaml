widgetData:
- source_sentence: 'Larissa Yamada — Agent·e Immobilier·ère — Toronto

    BTS Professions Immobilières | 6 ans d''expérience

    Expérience : Estimation et mise en vente de biens immobiliers

    Compétences : négociation, droit immobilier, relation client, prospection'
  sentences:
  - 'Notre organisation est à la recherche d''un·e Commercial·e motivé·e.


    Missions :

    - Reporter l''activité commerciale via le CRM

    - Négocier les contrats commerciaux

    - Prospecter de nouveaux comptes


    Profil recherché :

    - CRM

    - négociation

    - objectifs de vente'
  - 'Dans le cadre de notre développement, nous recrutons un·e Enseignant·e / Formateur·rice.


    Missions :

    - Préparer et animer des séances pédagogiques

    - Assurer le suivi individualisé des apprenants


    Profil recherché :

    - préparation de cours

    - pédagogie

    - évaluation'
  - 'Notre organisation est à la recherche d''un·e Responsable Qualité motivé·e.


    Missions :

    - Animer l''amélioration continue

    - Réaliser des audits internes


    Profil recherché :

    - gestion des non-conformités

    - documentation qualité

    - amélioration continue

    - audit qualité'
- source_sentence: 'Hassan Tanaka

    Acheteur·se

    Paris


    FORMATION

    Master Achats et Supply Chain


    EXPÉRIENCE PROFESSIONNELLE (6 ans)

    - Négociation des conditions contractuelles et tarifaires


    COMPÉTENCES

    appels d''offres, sourcing, gestion de contrats, ERP'
  sentences:
  - 'Dans le cadre de notre développement, nous recrutons un·e Juriste d''Entreprise.


    Missions :

    - Rédiger et négocier des contrats commerciaux

    - Suivre les éventuels contentieux


    Profil recherché :

    - rédaction d''actes

    - droit des contrats

    - droit du travail

    - veille juridique'
  - 'Dans le cadre de notre développement, nous recrutons un·e Chargé·e de Marketing Digital.


    Missions :

    - Animer les réseaux sociaux et produire du contenu

    - Optimiser le référencement naturel du site


    Profil recherché :

    - réseaux sociaux

    - Google Ads

    - content marketing'
  - 'Nous recherchons un·e Responsable Logistique pour rejoindre notre équipe.


    Missions :

    - Négocier avec les fournisseurs et prestataires

    - Suivre les commandes via l''ERP

    - Planifier et coordonner les transports


    Profil recherché :

    - planification des transports

    - supply chain

    - négociation fournisseurs'
- source_sentence: 'Ravi Martin — Conducteur·rice de Travaux — Montréal

    BTS Bâtiment | 4 ans d''expérience

    Expérience : Lecture et interprétation de plans techniques

    Compétences : AutoCAD, gestion d''équipe terrain, normes de sécurité, lecture de plans'
  sentences:
  - 'Nous recherchons un·e Data Scientist pour rejoindre notre équipe.


    Missions :

    - Concevoir et entraîner des modèles de machine learning

    - Automatiser des pipelines de traitement de données


    Profil recherché :

    - Power BI

    - Machine Learning

    - Python'
  - 'Notre organisation est à la recherche d''un·e Juriste d''Entreprise motivé·e.


    Missions :

    - Assurer la veille réglementaire

    - Rédiger et négocier des contrats commerciaux


    Profil recherché :

    - rédaction d''actes

    - négociation contractuelle

    - droit du travail

    - droit des contrats'
  - 'Dans le cadre de notre développement, nous recrutons un·e Acheteur·se.


    Missions :

    - Négocier les contrats et les conditions tarifaires

    - Suivre la performance et les coûts d''achat

    - Piloter les appels d''offres


    Profil recherché :

    - appels d''offres

    - négociation fournisseurs

    - sourcing

    - analyse de coûts'
- source_sentence: 'Maya Popescu — Agent·e Immobilier·ère — Buenos Aires

    BTS Professions Immobilières | 6 ans d''expérience

    Expérience : Estimation et mise en vente de biens immobiliers

    Compétences : prospection, négociation, droit immobilier, relation client, estimation immobilière'
  sentences:
  - 'Nous recherchons un·e Graphiste pour rejoindre notre équipe.


    Missions :

    - Décliner les chartes graphiques sur différents supports

    - Assurer une veille sur les tendances graphiques


    Profil recherché :

    - Illustrator

    - charte graphique

    - Photoshop'
  - 'Pour renforcer notre équipe, nous ouvrons un poste de Chef·fe de Cuisine.


    Missions :

    - Encadrer et former la brigade de cuisine

    - Garantir le respect des normes d''hygiène


    Profil recherché :

    - gestion de brigade

    - gestion des coûts matières

    - normes HACCP

    - élaboration de menus'
  - 'Notre organisation est à la recherche d''un·e Travailleur·se Social·e motivé·e.


    Missions :

    - Accompagner socialement les usagers

    - Orienter vers les dispositifs d''aide adaptés

    - Travailler en réseau avec les partenaires


    Profil recherché :

    - travail en réseau

    - écoute active

    - médiation

    - accompagnement social'
- source_sentence: 'Anya Fernández

    Chargé·e de Projet

    Tokyo


    FORMATION

    Master en Management de Projet


    EXPÉRIENCE PROFESSIONNELLE (5 ans)

    - Identification et suivi des risques projet


    COMPÉTENCES

    budget, reporting, gestion des risques, Scrum'
  sentences:
  - 'Dans le cadre de notre développement, nous recrutons un·e Comptable.


    Missions :

    - Préparer les clôtures mensuelles et annuelles

    - Participer à l''élaboration du budget prévisionnel


    Profil recherché :

    - déclarations TVA

    - comptabilité générale

    - Excel avancé

    - SAGE

    - clôtures comptables'
  - 'Nous recherchons un·e Data Scientist pour rejoindre notre équipe.


    Missions :

    - Automatiser des pipelines de traitement de données

    - Présenter les résultats aux équipes non techniques

    - Concevoir et entraîner des modèles de machine learning


    Profil recherché :

    - statistiques

    - Machine Learning

    - SQL

    - Power BI'
  - 'Dans le cadre de notre développement, nous recrutons un·e Chargé·e de Projet.


    Missions :

    - Rendre compte de l''avancement à la direction

    - Élaborer et suivre le planning et le budget des projets


    Profil recherché :

    - Scrum

    - budget

    - planning

    - gestion des risques'
