    12일 배출권 할당대상업체로 지정되어(환경부 고시 제2014-162호), 2015년부터 온실가스 배출권거래제 참여기업으로 할당된 온실가스 배출량을 달성하기 위해 온실가스 저감장치(스크러버) 측정 기술을 개발/운영하여
    배출량 저감을 유도하고, 배출권 거래를 포함한 배출권 관리/감축 등의 전사 TF 활동을 추진하고 있습니다. 배출권거래법 제24조에 따라, 정부에 보고하는 명세서 기재 내용을 기준으로 2025년 예상 온실가스 배출량은
    최종 4,994,862만톤CO2e(tCO2e)입니다.


