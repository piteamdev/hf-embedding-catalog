    - 'Σαμτρέντια

      Η Σαμτρέντια (γεωργιανά: , ) είναι πόλη στο Ιμερέτι της Γεωργίας. Βρίσκεται σε μια πεδιάδα ανάμεσα στους ποταμούς Ριόνι
      και Τσχένις-Τσκάλι, 244 χιλιόμετρα δυτικά της Τιφλίδας και 27 χιλιόμετρα δυτικά του Κουτάισι. Οι πιο σημαντικοί σιδηρόδρομοι
      της χώρας συνδέονται εδώ και αποτελεί συγκοινωνιακό κόμβο ζωτικής σημασίας. Το αεροδρόμιο του Κοπιτνάρι βρίσκεται 10
      χιλιόμετρα από την Σαμτρέντια. Το 2014 είχε 25.318 κατοίκους και ήταν η 10η μεγαλύτερη πόλη της χώρας. Η πόλη έχει υγρό
      υποτροπικό κλίμα με ήπιους και θερμούς χειμώνες και ζεστά καλοκαίρια.

      Η Σαμτρέντια εξελίχθηκε από μια σιδηροδρομική διασταύρωση ζωτικής σημασίας και απέκτησε καθεστώς πόλης το 1921. Το 1895
      ιδρύθηκε το πρώτο σχολείο στην πόλη, το 14ο δημόσιο σχολείο που τώρα είναι το 12ο δημόσιο σχολείο. Υπό την σοβιετική
      εξουσία, η τοπική οικονομία διαφοροποιήθηκε από τις μεταφορές και επεκτάθηκε στην παραγωγή τροφίμων και ξυλείας.

      Λόγω της στρατηγικής τοποθεσίας της πόλης, είχε σημαντικό ρόλο στην πολιτική αναταραχή της δεκαετίας του 1990 όταν οι
      αντισοβιετικές αντιπολιτευτικές ομάδες απέκλεισαν την διασταύρωση της Σαμτρέντια από τις 26 έως τις 31 Ιουλίου 1990
      για να πιέσουν την σοβιετική γεωργιανή κυβέρνηση να υιοθετήσει ένα πιο φιλελεύθερο εκλογικό νόμο. Η διασταύρωση αποκλείστηκε
      πάλι τον Μάρτιο με Απρίλιο του 1991 από τη νέα κυβέρνηση του Ζβιάντ Γκαμσαχούρντια, σε μια προσπάθειες να ασκηθεί πίεση
      στις σοβιετικές αρχές. Αυτός ο αποκλεισμός προκάλεσε μεγάλη ζημιά όχι μόνο στην Γεωργιανή οικονομία αλλά και στην Αρμενική
      οικονομία η οποία εξαρτώταν σε μεγάλο βαθμό από τους γεωργιανούς σιδηροδρόμους. Το 1993, η Σαμτρέντια αποτέλεσε ένα
      από τα κύρια πεδία μάχης του Γεωργιανού Εμφυλίου Πολέμου όπου οι δυνάμεις που ήταν πιστές στον έκπτωτο πρόεδρο Γκαμσαχούρντια
      συγκρούστηκαν με τις μεταπραξικοπηματικές δυνάμεις της κυβέρνησης και κατέλαβαν την πόλη για μια εβδομάδα, από τις 17
      έως τις 23 Οκτωβρίου 1993, βάζοντας υπό απειλή όλες τις επαφές της πόλης με τη Τιφλίδα. Παρόλο που η Σαμτρέντια από
      τότε είναι σταθερή πόλη, η μετασοβιετική κρίση οδήγησε σε'
    - 'Αγέλη

      Στην αρχαία Κρήτη και την αρχαία Σπάρτη, αγέλη ήταν η ονομασία ομάδων στις οποίες εντάσσονταν οι νέοι.

      Στην Κρήτη οι νέοι, εντάσσονταν σε αγέλες από την ηλικία των 18 ετών ως και την ώρα του γάμου τους, όπου ζούσαν όλοι
      μαζί. Είχαν κοινό συσσίτιο, ασκούνταν και γυμνάζονταν, και συντηρούνταν με έξοδα της πολιτείας. Ως μέλη της αγέλης,
      οι νέοι ονομάζονταν αγελαίοι, ενώ ο αρχηγός της ομάδας ονομαζόταν αγελάτης. Ο αγελάτης μπορούσε να ασκήσει ποινική εξουσία
      στα υπόλοιπα μέλη της αγέλης, ενώ οι αρχές της πόλης επιτηρούσαν τον αγελάτη.

      Στη Σπάρτη τα αρσενικά παιδιά κατατάσσονταν σε αγέλες από τα 7 ως τα 30 τους χρόνια. Όσοι ανήκαν στην αγέλη της Σπάρτης,
      χωρίζονταν σε τρεις τάξεις: στα παιδιά (17-18 ετών), στους μελλείρινες (18-20 ετών) και στους είρηνες (20-30 ετών).
      Υπάρχουν αναφορές και για διαφορετική οργάνωση των ομάδων των νέων στη Σπάρτη, με χωρισμό σε βούες, ανάλογο των σχολικών
      τάξεων, και σε ίλες, στις οποίες γινόταν στρατιωτική εκπαίδευση. Η σχέση της αγέλης με τις δύο άλλες ομαδοποιήσεις δεν
      είναι εξακριβωμένη. Άλλοτε ταυτίζεται με τη βούα, άλλοτε με την ίλα, ενώ, σύμφωνα με μία άλλη άποψη, η βούα ήταν υποδιαίρεση
      της αγέλης.'
    - 'Τίτλος: ΚΑΝΟΝΙΣΜΟΣ ΥΠ'' ΑΡΙΘΜ. 67

      Έτος: 1994

      «Περί διαρθρώσεως, λειτουργίας, διοικήσεως και διαχειρίσεως της εκ της Ιεράς Συνόδου εξηρτημένης Ειδικής Υπηρεσίας του
      επισήμου Δελτίου «ΕΚΚΛΗΣΙΑ» και των Περιοδικών «ΕΦΗΜΕΡΙΟΣ» και «ΘΕΟΛΟΓΙΑ».

      Άρθρον 9

      Τίτλος άρθρου: Διάθεσις των πόρων

      Οι πόροι της Ειδικής Υπηρεσίας διατίθενται:

      α) Δια την έκδοσιν των περιοδικών «Εκκλησία», «Εφημέριος», «Θεολογία», της «Ελληνικής Θεολογικής Βιβλιογραφίας», του
      «Αρχείου Θεολογίας», των Ευρετηρίων των περιοδικών, ειδικών βιβλίων, φυλλαδίων, εγκυκλίων, δελτίων, ανακοινώσεων κ.α.,
      τα οποία αποσκοπούν εις την ενημέρωσιν του εφημεριακού Κλήρου, του Χριστεπωνύμου πληρώματος, των εκκλησιαστικών ή πολιτειακών
      παραγόντων, των ομοδόξων ή ετεροδόξων Εκκλησιών κ.λπ.

      β) Δια την μισθοδοσίαν του προσωπικού της Ειδικής Υπηρεσίας (διοικητικού και συντακτικού) και την κάλυψιν των νομοθετημένων
      απαιτήσεων των Ασφαλιστικών Οργανισμών.

      γ) Δια την εκτέλεσιν δαπανών, αι οποίαι ανατίθενται εις την Ειδικήν Υπηρεσίαν δι'' αποφάσεως της Ιεράς Συνόδου.'
  - source_sentence: In a standard oven you should be able to have three rows with five potatoes in each row.
    sentences:
    - 'Τίτλος: ΝΟΜΟΣ ΥΠ'' ΑΡΙΘΜ. 2963

      Έτος: 2001

      Οργάνωση και λειτουργία των δημόσιων επιβατικών μεταφορών με λεωφορεία, τεχνικός έλεγχος οχημάτων και ασφάλεια χερσαίων
      μεταφορών και άλλες διατάξεις.

      Άρθρο 4

      Τίτλος άρθρου: Σκοπός ΚΤΕΛ ΑΕ

      1. Σκοπός των ΚΤΕΛ ΑΕ είναι η εκτέλεση του συγκοινωνιακού έργου, όπως αυτό ορίζεται στο άρθρο 6, καθώς και οποιοδήποτε
      άλλο έργο οδικών συγκοινωνιών τους ανατεθεί.

      2. Για την εκτέλεση του σκοπού αυτού τα ΚΤΕΛ ΑΕ μπορούν:

      α. Να εκπονούν μελέτες συναφείς με την οργάνωση και λειτουργία του συγκοινωνιακού έργου που τους ανατίθεται.

      β. Να κατασκευάζουν και εκμεταλλεύονται κάθε είδους εγκαταστάσεις εξυπηρέτησης του επιβατικού κοινού, ιδίως σταθμούς
      άφιξης και αναχώρησης λεωφορείων, στέγασης, συντήρησης, τροφοδοσίας και εφοδιασμού με καύσιμα ή χώρων αναμονής και εξυπηρέτησης
      επιβατών.

      γ. Να συνεργάζονται με σιδηροδρομικές, αεροπορικές ή ναυτιλιακές εταιρείες για την παροχή σχετικών υπηρεσιών.

      δ. Να ιδρύουν σε νομαρχιακό ή διανομαρχιακό ή εθνικό επίπεδο από τις ΚΤΕΛ ΑΕ, προμηθευτικούς συνεταιρισμούς μη κερδοσκοπικού
      χαρακτήρα, για την προμήθεια οχημάτων, ανταλλακτικών και εξαρτημάτων και άλλων υλικών.'
    - 'Ίντσον

      Η Ίντσον (χάνγκουλ: , χάντσα: , ) είναι μια μεγαλούπολη που βρίσκεται στη βορειοδυτική Νότια Κορέα, και συνορεύει με
      τη Σεούλ και τη Γκιόνγκι στα ανατολικά. Στην απογραφή του 2020 είχε πληθυσμό 2,957,900 κατοίκους. Η περιοχή κατοικήθηκε
      κατά τη νεολιθική εποχή, και το 1883 που το Ίντσον έγινε διεθνής λιμένας ο πληθυσμός του ήταν μόνο 4.700 άτομα. Σήμερα,
      περίπου 3 εκατομμύρια άνθρωποι ζουν στην πόλη, που είναι η τρίτη μεγαλύτερη πόλη της Νότιας Κορέας, μετά τη Σεούλ και
      το Μπούσαν.

      Η ανάπτυξη της πόλης συνδέεται με την παράκτια γεωγραφική της θέση, την ανάπτυξη του λιμανιού της και την εγγύτητά της
      με την πρωτεύουσα της Νότιας Κορέας. Το Ίντσον πρωτοπόρησε στην οικονομική ανάπτυξη της Κορέας ανοίγοντας το λιμάνι
      του στον κόσμο, και οδήγησε στον εκσυγχρονισμό και την εκβιομηχάνιση της Κορέας. Το 2003, η πόλη έγινε η πρώτη ελεύθερη
      οικονομική ζώνη της Κορέας. Από τότε, μεγάλες εγχώριες και παγκόσμιες επιχειρήσεις έχουν αυξήσει τις επενδύσεις τους
      στην Ελεύθερη Οικονομική Ζώνη του Ίντσον, όπως η Samsung που επέλεξε τη Διεθνή πόλη Σόνγκντο ως νέο επενδυτικό προορισμό
      για τη βιοτεχνολογική βιομηχανία της.

      Στη διεθνή πόλη του Ίντσον έχουν πραγματοποιηθεί πολυάριθμα μεγάλα διεθνή συνέδρια. Στις 19 Σεπτεμβρίου-4 Οκτωβρίου
      2014 το Ίντσον φιλοξένησε τους Ασιατικούς Αγώνες. Είναι ένας σημαντικός συγκοινωνιακός κόμβος στη βορειοανατολική Ασία
      με Διεθνές Αεροδρόμιο και λιμάνι. Στο Ίντσον έχει, επίσης, την έδρα του το Πράσινο Ταμείο για το Κλίμα, ένας διεθνής
      οργανισμός που ασχολείται με περιβαλλοντικά ζητήματα. Στο Παγκόσμιο πρωτάθλημα ποδοσφαίρου το 2002, τρεις αγώνες έγιναν
      στο Στάδιο Ίντσον-Μούνχακ.

      Η πρώτη ιστορική αναφορά στην περιοχή του Ίντσον ήταν το 475 μ.Χ., κατά την περίοδο του Βασιλιά Τζάνγκσου του Γκογκούριο,
      με το όνομα Μιτσούχολ, που μάλλον αντιστοιχεί στο σημερινό λόφο Μουνχάκ ( ). Στην πορεία της ιστορίας, η περιοχή έχει
      ονομαστεί ποικιλοτρόπως καθώς άλλαζαν τα βασίλεια και οι δυναστείες. Κατά την περίοδο του βασιλιά Γιονγκντογκ της Σίλα,
      ενός από τα Τρία Βασίλεια, η περιοχή ονομάστηκε Σοσόνγκιον. Τον'
    - Space the potatoes on a rack in the preheated oven so there is at least an inch of space around each potato. In a standard
      oven you should be able to have three rows with five potatoes in each row. Bake the potatoes for about 50 minutes. Use
      an oven mitt to remove one potato to test it. The potato is done if it feels soft and has a tender feel when you pierce
      it with a fork. If the potato is not done, put it back in and cook an additional 10 minutes.
  - source_sentence: Πώς έχει επηρεάσει η εξωτερική πολιτική της Κυβέρνησης τις σχέσεις με την Τουρκία;
    sentences:
    - 'Ροκατέντα

      Το Ροκατέντα ("Rokatenda") ή Παλουβέχ ("Paluweh") είναι ενεργό ηφαίστειο το οποίο σχηματίζει το μικρό νησί Παλούε, με
      διάμετρο περίπου 8 χιλιόμετρα και έκταση 41 χλμ, περίπου 10 χιλιόμετρα βόρεια της νήσου Φλόρες. Η κορυφή του ηφαιστείου
      βρίσκεται 875 μέτρα πάνω από την επιφάνεια της θάλασσας και περισσότερα από 3 χιλιόμετρα πάνω από τον πυθμένα της. Η
      κορυφή του περιλαμβάνει αλληλοεπικαλυπτόμενους κρατήρες και αρκετούς δόμους λάβας. Η σύσταση της λάβας του ηφαιστείου
      είναι κυρίως ανδεσιτική.

      Εκρήξεις με ισχύ 3 στη κλίμακα VEI έλαβαν χώρα περίπου το 1650, το 1928, το 1972 και τη περίοδο 2012-13. Η έκρηξη του
      1928 ήταν εκρηκτική και προκάλεσε τσουνάμι λόγω κατολισθήσεων, ενώ έλαβε χώρα η δημιουργία ενός δόμου, ο οποίος ονομάστηκε
      Ροκατέντα. Οι εκρήξεις του 1963, 1972, 1973, 1980-81, 1984 και 1985 έλαβαν χώρα σε αυτόν τον δόμο. Η έκρηξη του 1981
      προκάλεσε μια πυροκλαστική που έκαψε 36 σπίτια, όμως το νησί είχε προηγουμένως εκκενωθεί.

      Η πιο πρόσφατη έκρηξη του ηφαιστείου ξεκίνησε τον Νοέμβριο του 2012 με εκρηκτικές στήλες ύψους 2,4 χιλιομέτρων, ενώ
      παράλληλα άρχισε να σχηματίζεται ένας νέος ηφαιστειακός δόμος, με ύψος 150 μέτρα και διάμετρο στη βάση 250 μέτρα, ο
      οποίος ήταν το νέο ψηλότερο σημείο του νησιού. Ο δόμος βρίσκεται λίγο δυτικότερα του προηγούμενου και έλαβε το όνομα
      Ρερομπόλα. Τον Δεκέμβριο η στάχτη έφτανε σε υψόμετρο 4 χιλιόμετρων και απόσταση 55 χιλιομέτρων από το ηφαίστειο. Στις
      10 Αυγούστου 2013, μια πυροκλαστική ροή κατέβηκε τις πλαγιές του ηφαιστείου με αποτέλεσμα, σύμφωνα με την αρχική αναφορά,
      τον θάνατο 6 ατόμων τα οποία βρίσκονταν στη παραλία όπου κατέληξε η πυροκλαστική ροή, αν και είχε διαταχθεί η εκκένωση
      του νησιού. Η πυροκλαστική ροή προκλήθηκε από τη μερική κατάρρευση του δόμου.'
    - Ευχαριστώ, κύριε Πρόεδρε. Κυρία Υφυπουργέ, θα αναφερθώ κι εγώ στο θέμα αυτό το οποίο μπορεί σε εσάς να φαίνεται σαν
      ένα λάθος, αλλά για εμάς, όπως και για όλους τους Έλληνες είναι δυναμίτης στα θεμέλια της προσπάθειας που γίνεται για
      να ελευθερωθεί η Κύπρος και όχι για να δούμε λύσεις διζωνικές, αλλά να δούμε την Κύπρο ανεξάρτητη και ελεύθερη, όπως
      ήταν πριν το 1974. Η Κύπρος είναι μία και δεν είναι χωρισμένη σε ζώνες ή σε τουρκική παρουσία. Στις 18 Ιουνίου, λοιπόν,
      οι κύριοι αυτοί του ΕΛΙΑΜΕΠ, ο κ. Γρηγοριάδης, η κ. Πωλίνα Λάμψα, όπως και κάποιοι άλλοι που ήταν μαζί, παρευρέθησαν
      κάτω από τις σημαίες του ψευδοκράτους και συνομίλησαν με τον κ. Τατάρ σε μια συνάντηση στην οποία πιστεύουμε ότι υπήρχε
      μια σιωπηρή συναίνεση, γιατί αποκλείεται να πάνε κάποιοι, κυρία Υφυπουργέ, σε μία τέτοια συνάντηση και να μην το γνωρίζει
      το Υπουργείο Εξωτερικών. Είναι αδύνατο να πάνε κάποιοι σε μια τέτοια συνάντηση χωρίς να έχετε ενημερωθεί. Ωστόσο, εγώ
      θέλω να κάνω τον καλόπιστο και να πω ότι δεν είχατε ενημερωθεί. Όμως, μετά την επιστροφή τους ή μόλις έγινε η συνάντηση,
      θα έπρεπε να έχετε καταδικάσει επισήμως και όχι να πείτε ότι είναι λάθος. Θα έπρεπε να είστε λάβροι εναντίον αυτής της
      προσπάθειας του ΕΛΙΑΜΕΠ. Και μην ξεχνάτε ότι στην πολιτική υπάρχει η de jure και η de facto αναγνώριση. Με τέτοιες παρουσίες,
      λοιπόν, μπορεί να δώσουμε δικαίωμα στο να υπάρχει μία de facto αναγνώριση ψευδοκρατών, όταν βλέπουν Έλληνες και «think
      tanks» τα οποία τροφοδοτούν στη συνέχεια την Κυβέρνηση με μέλη. Μην ξεχνάμε ότι ο κ. Θάνος Ντόκος είναι σύμβουλος του
      Πρωθυπουργού σήμερα σε θέματα εθνικής άμυνας, όπως δεν πρέπει να ξεχνάμε και κάποια άλλα μέλη τα οποία συμμετέχουν στην
      Κυβέρνηση και προέρχονται από το ΕΛΙΑΜΕΠ. Η Κυβέρνηση, όπως και η κάθε κυβέρνηση, θα πρέπει να ξεκαθαρίσει τη θέση της
      από αυτό το εθνοπροδοτικό «think tank», γιατί δεν κάνει καμία άλλη δουλειά από το να μην υπερασπίζεται τα εθνικά μας
      συμφέροντα παρά μόνο τα συμφέροντα των Τούρκων. Αυτό είναι το μόνιμο θέμα το οποίο έχει σαν προμετωπίδα το ΕΛΙΑΜΕΠ,
      είτε με την ΑΟΖ είτε με τ
    - 'Ευχαριστώ πολύ, κύριε Πρόεδρε, και ευχαριστώ πάρα πολύ και τους συναδέλφους για την ευγενική παραχώρηση. Κυρίες και
      κύριοι συνάδελφοι, η έβδομη τροποποίηση της Σύμβασης Εκμετάλλευσης Υδρογονανθράκων στη θαλάσσια περιοχή του Θρακικού
      Πελάγους, που έχει φέρει η Κυβέρνηση για κύρωση στη Βουλή, αναδεικνύει μια σειρά ζητημάτων που απαιτούν απαντήσεις:
      την έλλειψη στρατηγικού σχεδίου από το Υπουργείο Περιβάλλοντος και Ενέργειας, τη μη ικανοποιητική πρόοδο στην αποθήκευση
      διοξειδίου του άνθρακα και την αξιοποίηση των κοιτασμάτων του Πρίνου, τη διατήρηση των ενεργειακών εξόδων της χώρας
      και την αδυναμία της κυβερνητικής πολιτικής να μειώσει τα βάρη για τα ελληνικά νοικοκυριά. Κι ενώ το ενεργειακό κόστος
      έρχεται να προστεθεί στο καλάθι της ακρίβειας για τους Έλληνες και τις Ελληνίδες, η ενεργειακή αυτονομία της χώρας φαίνεται
      να γίνεται ξανά όμηρος μιας διαπραγμάτευσης που ξεκίνησε η Κυβέρνηση με την Τουρκία, μια Τουρκία που πλάι στις υπόλοιπες
      αξιώσεις της εκφράζει την απαίτηση να μη δημιουργηθούν από τη χώρα μας θαλάσσια πάρκα στο Αιγαίο. Την ίδια στιγμή η
      Κυβέρνηση διαχειρίζεται την εξωτερική πολιτική της χώρας ως προσωπική υπόθεση. Προχθές μόλις ο Υπουργός Εξωτερικών κ.
      Φιντάν δικαιολόγησε τις απειλές της Χεζμπολάχ κατά της Κύπρου, ενισχύοντας μάλιστα αυτές τις απειλές. Και καταθέτω και
      το σχετικό απόσπασμα. (Στο σημείο αυτό ο Βουλευτής κ. Μιχαήλ Κατρίνης καταθέτει για τα Πρακτικά το προαναφερθέν έγγραφο,
      το οποίο βρίσκεται στο αρχείο του Τμήματος Γραμματείας της Διεύθυνσης Στενογραφίας και Πρακτικών της Βουλής) Υπουργείο
      Εξωτερικών, χλιαρή ανακοίνωση. Αυτή η ανακοίνωση, που είναι πολύ χλιαρή, λέει πολλά σε επίπεδο ερμηνειών και πολύ φοβάμαι
      ότι υποκρύπτει πολλά περισσότερα. Άλλωστε, το ότι η χώρα μας στηρίζει την υποψηφιότητα του Τούρκου διπλωμάτη κ. Σινιρλίογλου
      για τη θέση του Γενικού Γραμματέα του ΟΑΣΕ είναι ένα γεγονός που καθιστά αυταπόδεικτη τη συνεργασία του ελληνικού Υπουργείου
      Εξωτερικών με το Υπουργείο Εξωτερικών της Τουρκίας. Ποιος είναι, όμως, ο κ. Σινιρλίογλου τον οποίον η χώρα μας στηρίζει
      αναφανδόν; Εί'
  - source_sentence: What is the procedure for publishing the law in the Official Journal of the Government?
    sentences:
    - ' Η στήλη αποτελείται από τρία μέρη: τη βάση με το ανάγλυφο, έναν μονολιθικό κίονα από γκρίζο γρανίτη Συήνης ύψους 10
      περίπου μέτρων και την κορυφή όπου βρίσκεται ένα μαρμάρινο κυβολιθικό κορινθιακό κιονόκρανο με διακόσμηση αετών στις
      γωνίες. Και οι τέσσερις πλευρές της βάσης διαθέτουν ανάγλυφες διακοσμήσεις. Στις τρεις από αυτές υπάρχουν δακτύλιοι
      μέσα στους οποίους βρίσκονται ασπίδες, που φέρουν σταυρό με έξι κεραίες. Τη βόρεια όμως πλευρά της βάσης κοσμούσαν δύο
      φτερωτές Νίκες από τις οποίες η μια σώζεται σε καλή κατάσταση, ενώ από την άλλη σώζεται τμήμα του φτερού της. Πάνω από
      την παράσταση των φτερωτών Νικών διακρίνεται ακόμη η αναθηματική επιγραφή στα Λατινικά, με χαρακτήρες αρκετά βαθουλούς
      εξαιτίας του γεγονότος ότι αρχικά ήταν μέσα τους προσαρμοσμένα μεταλλικά γράμματα: Περίεργο είναι το γεγονός ότι η βάση
      είναι τοποθετημένη με διεύθυνση από τα βορειοδυτικά προς τα νοτιοανατολικά, ενώ το κιονόκρανο και η βάση του αγάλματος
      έχουν διεύθυνση από βορρά προς νότο. Η εμφανής έλλειψη ευθυγράμμισης μεταξύ βάσης και κιονόκρανου έχει προταθεί ότι
      οφείλεται στην ανάγκη να στραφεί το άγαλμα προς την κατεύθυνση όπου βρισκόταν ο Ναός των Αγίων Αποστόλων. Αναφορικά
      με τη μορφή και την τύχη του αγάλματος του Μαρκιανού δεν γνωρίζουμε τίποτε. Η τουρκική ονομασία της στήλης ως "κολόνα
      με τις κόρες" οφείλεται στην ανάγλυφη φιγούρα της Νίκης, η οποία υπάρχει στη βάση. Λόγω του αναγλύφου οι περιηγητές
      μπερδεύανε τη στήλη αυτή με τη διάσημη στήλη της Αφροδίτης, η οποία υπήρχε εκεί κοντά.Η στήλη αυτή ήταν γνωστή στον
      οθωμανό περιηγητή Εβλιγιά Τσελεμπή (1611 - περίπου 1684), καθώς αναφέρεται στο «Βιβλίο των ταξιδιών», αλλά η ύπαρξή
      της ήταν άγνωστη στη Δύση, καθώς δεν αναφέρεται από ευρωπαίους περιηγητές της εποχής εκείνης, όπως τον γάλλο Pierre
      Gylles (Αλμπί 1490 – Ρώμη 1555). Η στήλη επισημάνθηκε για πρώτη φορά από ευρωπαίο περιηγητή το 1675, συγκεκριμένα τον
      γάλλο Ζακόμπ Σπον (1647–1685) και αργότερα από τον άγγλο Τζωρτζ Γέλερ (1650–1723). Μέχρι το 1908 η στήλη ήταν κρυμμένη
      μέσα στον κήπο ενός μεγάλου σπιτιού, ενώ τα γύρω κτήρια έκρυβαν τη θέα. Το 1908 μια φωτιά κατέστρεψε την περιοχή και
      έτσι η στήλη "αποκαλύφθηκε". Με τον νέο ρυμοτομικό σχεδιασμό της περιοχής η στήλη βρίσκεται στο κέντρο πλατείας.'
    - 'Τίτλος: ΝΟΜΟΣ ΥΠ'' ΑΡΙΘΜ. 3812

      Έτος: 2009

      Αναμόρφωση συστήματος προσλήψεων στο δημόσιο τομέα και άλλες διατάξεις

      Άρθρο 18

      Τίτλος άρθρου: Έναρξη ισχύος

      Η ισχύς του παρόντος νόμου αρχίζει από τη δημοσίευση του στην Εφημερίδα της Κυβερνήσεως, εκτός αν ορίζεται διαφορετικά
      στις επί μέρους διατάξεις του.

      Παραγγέλλομε τη δημοσίευση του παρόντος στην Εφημερίδα της Κυβερνήσεως και την εκτέλεση του ως νόμου του Κράτους.'
    - Ελπίζω ότι θα είμαι. Κύριε Υπουργέ, αγαπητοί συνάδελφοι, έχουν ειπωθεί πάρα πολλά πράγματα για το σημερινό νομοσχέδιο
      που συζητάμε, ένα νομοσχέδιο τύποις αναπτυξιακό. Στην πραγματικότητα είναι ένα συνονθύλευμα πολλών ετερόκλητων διατάξεων,
      που επιδιώκουν αφ’ ενός μεν να κάνουν πράξη την αντίληψη «επενδύω όπου να ’ναι, όπως να ’ναι» και αφ’ ετέρου να γκρεμίσουν
      εσπευσμένα κάθε θετικό μέτρο της Κυβέρνησης του ΣΥΡΙΖΑ στις εργασιακές σχέσεις και γενικότερα στο κανονιστικό πλαίσιο
      που περιελάβανε η δική μας αναπτυξιακή στρατηγική πρόταση. Κύριοι της Κυβέρνησης, παίζετε με τη φωτιά, διότι αναβιώνετε
      την ίδια λογική που οδήγησε τη χώρα το 2010 στη χρεοκοπία. Ενσωματώνετε στο δικό σας αναπτυξιακό μοντέλο εξυπηρετήσεις
      και ρουσφέτια προς συγκεκριμένους επιχειρηματίες, εγκαινιάζοντας στην ουσία τη νέα διαπλοκή. Διότι τι άλλο μπορεί να
      είναι η επιδότηση δραστηριοτήτων, όπως οι ταχυμεταφορές-κούριερ, τα ντελίβερι, οι ραδιοτηλεοπτικές παραγωγές; Ποιο είναι
      το πολλαπλασιαστικό όφελος των τομέων αυτών στην οικονομία; Τι άλλο συνιστά παρά διαπλοκή η κατάργηση του «πόθεν έσχες»
      στους καναλάρχες καθώς και η κατάργηση της ονομαστικοποίησης των μετοχών; Τι άλλωστε σημαίνει το άρθρο 206, για προέγκριση
      ειδικού χωρικού σχεδίου από τον γενικό γραμματέα, το οποίο ειδικό χωρικό σχέδιο καταργεί κάθε προγενέστερο πολεοδομικό
      και χωρικό σχεδιασμό σε τοπικό επίπεδο ουσιαστικά με απόφαση του γενικού γραμματέα; Και πρέπει να ξέρουμε ότι με τη
      λογική του νομοσχεδίου, που κάθε επένδυση εντάσσεται στις στρατηγικές επενδύσεις, αυτό έχει αντίκτυπο όχι μόνο στα νησιά
      και στις πιο απομακρυσμένες παραλίες, που ετοιμάζονται μεγάλα συγκροτήματα να δημιουργήσουν επενδύσεις, καταστρέφοντας
      το τελευταίο φυσικό εξαιρετικού κάλλους περιβάλλον το οποίο υπάρχει, αλλά και σε ολόκληρη την τουριστική Ελλάδα. Είναι
      μια βιομηχανία η οποία, αν δεν αναχαιτιστεί από τώρα και δεν μπει σε κανόνες και πλαίσιο με περιβαλλοντικούς όρους,
      τότε θα έχουμε πολύ μεγάλη καταστροφή στο συγκριτικό μας πλεονέκτημα, που είναι ο πολιτισμός και το φυσικό περιβάλλον.
      Αυτό, λοιπόν, το ά
  - source_sentence: Evocati Augusti, Διομητιανός, Κικέρωνας, ρωμαϊκός στρατός
    sentences:
    - 'ΝΟΜΟΣ ΨΛΓ΄ της 7/12 Δεκ. 1878 (ΦΕΚ 72) Περί παραιτήσεως δικαιώματος επιβολής ποινικής ρήτρας εις το εν Στάϋρ της Αυστρίας
      οπλουργείον. Προσωρινής ισχύος, ως και οι: α)Νόμ. ΑΩϞΗ΄ της 26 Φεβρ. /1 Μαρτ. 1891 περί εγκρίσεως δαπανών δια την προμήθειαν
      αρβυλών του στρατού. β)Νόμ. (ΔΡΞΗ) 34 της 31 Μαρτ. /8 Απρ. 1913 περί των ενεργουμένων ή ενεργηθεισών προμηθειών εν γένει,
      μετακομίσεων και εργασιών δια τας ανάγκας του πολέμου και διαρκούσης της επιστρατεύσεως. γ)Νόμ. 426 της 27 Νοεμ./4 Δεκ.
      1914 «περί συμβάσεως δια την κατασκευήν εν Ελλάδι βλημάτων ασκήσεων (ακυρωθείς δια του Ν.Δ. 1759/1919). δ)Νόμ. 1019
      της 31 Οκτ. /3 Νοεμ. 1917 περί εκδόσεως πιστοποιήσεως αγοραίας τιμής αγοραζομένων υπό του στρατού ειδών. ε)Ν.Δ. 1759
      της 5/19 Μαρτ. 1919 περί ακυρώσεως του υπ’ αριθ. 426 Νόμου. ς)Νόμ. 1878 της 17 Ιαν. /6 Φεβρ. 1920 περί κυρώσεως του
      από 4 Μαΐου 1919 Ν.Δ/τος «περί θεραπείας πάσης φύσεως αναγκών εν γένει εις τας στρατιωτικώς καταλαμβανόμενα μέρη της
      Μ. Ασίας. ζ)Νόμ. 2410 της 27 Ιουν. /10 Ιουλ. 1920 περί κυρώσεως του από 28 Σεπτ. 1919 Ν.Δ/τος περί συστάσεως επιτροπών
      παραλαβής αγοραζομένου υλικού εν τω εξωτερικώ. η)Νόμ. 3903 της 13/18 Φεβρ. 1929 περί ακυρώσεως της μεταξύ του Ελλ. Δημοσίυ
      και της Αν. Εταιρείας «Ελληνική Εριουργία» συμβάσεως της 31 Μαρτ. 1926. θ)Νόμ. 4447 της 3/14 Σεπτ. 1929 περί καταργήσεως
      του από 30 Οκτ. /1 Νοεμ. 1925 Ν.Δ/τος περί κυρώσεως συμβάσεως μεταξύ υπουργείου Στρατιωτικών και της Εταιρείας Ελληνικού
      Πυριτιδοποιείου και Καλυκοποιείου περί κατασκευής 450.000.000 φυσιγγίων. ι)Νόμ. 5645 της 31 Αυγ. /7 Σεπτ. 1932 περί
      διαλύσεως της μετά των υφαντουργικών Εταιρειών από 30 Ιουλ. 1917 συμβάσεως του Δημοσίου περί προμηθείας ειδών ιματισμού
      δια την Στρατιωτικήν Υπηρεσίαν.'
    - 'Τίτλος: ΝΟΜΟΣ ΥΠ'' ΑΡΙΘΜ. 4174

      Έτος: 2013

      Φορολογικές διαδικασίες και άλλες διατάξεις.

      Άρθρο 24

      Τίτλος άρθρου: Πρόσβαση στα βιβλία και στοιχεία

      1. Η Φορολογική Διοίκηση έχει δικαίωμα να λαμβάνει αντίγραφα των βιβλίων και στοιχείων, καθώς και λοιπών εγγράφων, για
      τα οποία ο φορολογούμενος δηλώνει ότι αντιπροσωπεύουν ακριβή αντίγραφα. Σε περίπτωση που ο φορολογούμενος αρνείται να
      προβεί στην ανωτέρω δήλωση, ο οριζόμενος από τη Φορολογική Διοίκηση υπάλληλος προβαίνει σε σχετική επισημείωση επί των
      εγγράφων. Ο οριζόμενος υπάλληλος δύναται ταυτόχρονα να απαιτεί από το φορολογούμενο ή τον φορολογικό εκπρόσωπό του να
      παρίσταται στον τόπο όπου διενεργείται ο φορολογικός έλεγχος και να απαντά σε ερωτήματα που του τίθενται, ώστε να διευκολύνεται
      η διενέργεια του φορολογικού ελέγχου.

      2. Εάν τα βιβλία και στοιχεία τηρούνται σε ηλεκτρονική μορφή, η Φορολογική Διοίκηση έχει δικαίωμα πρόσβασης σε οποιαδήποτε
      φυλασσόμενα αρχεία, καθώς και στα λογιστικά προγράμματα και τις πληροφορίες που έχουν καταχωριστεί σε αυτά. Η Φορολογική
      Διοίκηση δικαιούται να λαμβάνει τα ηλεκτρονικά αρχεία σε αναγνώσιμη ηλεκτρονική ή έντυπη μορφή.

      3. Ο υπάλληλος που έχει ορίσει η Φορολογική Διοίκηση δύναται να κατάσχει βιβλία και στοιχεία που τηρούνται ή διαφυλάσσονται
      σύμφωνα με τη φορολογική νομοθεσία και οποιαδήποτε άλλα ανεπίσημα βιβλία, έγγραφα, αρχεία ή στοιχεία, εφόσον το θεωρήσει
      αναγκαίο, προκειμένου να διασφαλισθεί η αποδεικτική αξία αυτών.'
    - 'Evocatus

      Evocatus είναι ο λατινικός όρος που αναφέρεται στο στρατιώτη εκείνο του ρωμαϊκού στρατού που ολοκλήρωσε τη θητεία του,
      έλαβε το απολυτήριό του "(missio)", ωστόσο επέλεξε εθελοντικά να καταταγεί και πάλι, έπειτα από πρόσκληση κάποιου υπάτου
      ή άλλου διοικητή.

      Από ό,τι φαίνεται, πάντα υπήρχε σημαντικός αριθμός από evocati σε κάθε αξιόλογο στρατό, και όταν ο στρατηγός ήταν αγαπητός
      στους άνδρες του, ο αριθμός βετεράνων που κατατάσσονταν και πάλι στα στρατεύματά του ήταν αυξημένος. Οι evocati απαλλάσσονταν,
      όπως οι vexillationes, από τις συνηθισμένες στρατιωτικές αγγαρείες, όπως για παράδειγμα την ύψωση οχυρωμάτων για το
      στρατόπεδο ή την κατασκευή δρόμων Ο βαθμός τους γενικότερα θεωρείτο υψηλότερος από αυτόν των συνηθισμένων λεγεωναρίων.
      Ορισμένες φορές γίνεται κοινή αναφορά σε αυτούς με τους ιππείς, ενώ άλλες φορές κατατάσσονται με τους εκατοντάρχους.
      Φαίνεται δε πως συχνά λάμβαναν προαγωγή για το αξίωμα του εκατοντάρχου. Συνεπώς, ο Πομπήιος παρακίνησε πολλούς από τους
      βετεράνους που υπηρέτησαν υπό τις διαταγές του σε προγενέστερα έτη να ενωθούν μαζί του κατά την περίοδο των εμφυλίων
      πολέμων, υποσχόμενος ανταμοιβές και τη διοίκηση εκατονταρχιών. Ωστόσο δεν μπορούσαν όλοι οι evocati να γίνουν εκατόνταρχοι,
      ούτε να αποτελέσουν τμήμα ορισμένων από τις κοόρτεις. Ο ρήτορας Κικέρων κάνει αναφορά σε κάποιον "praefectus evocatorum",
      έναν αξιωματικό επικεφαλής για τους evocati.

      Με το όνομα evocati ήταν επίσης γνωστά τα μέλη ενός επίλεκτου σώματος νεαρών ανδρών από την τάξη των ιππέων στους οποίους
      ανέθεσε ο Αυτοκράτορας Διομητιανός να φυλάσσουν την κρεβατοκάμαρά του. Ορισμένοι συγγραφείς υποστηρίζουν ότι το σώμα
      αυτό επιβίωσε και κατά την εποχή επόμενων αυτοκρατόρων, με αποτέλεσμα να ταυτίζεται με εκείνους που αργότερα έγιναν
      γνωστοί ως "Evocati Augusti".'
