widgetData:
- text: የኮንጎ ዲሞክራስያዊ ሪፑብሊክ ሞሴ ካቱምቢ (Moise Katumbi) የተባሉ ተቃዋሚ ፖለቲከኛ ባዕዳን ቅጥረኞችን ተጠቅመዋል በሚለው ወሬ ላይ ምርመራ እንደጀመረች የመንግስት ባለስልጣኖች
    ትላንት ረቡዕ ተናግረዋል።የፍትህ ሚኒስትር አሌክስ ታምብዌ ምዋምባ በርካታ የቀድሞ አሜሪካውያን ወታደሮች በካታንጋ ክፍለ-ሀገር የካቱምቢ ጠባቂዎች ሆነው እንየሰሩ መሆናቸውን የሚያሳይ “የሰነድ
    መረጃ” አለን ብለዋል።ካታንጋ የተባለችው የነሃስ ማዕዳን ያላት ክፍለ-ሀገር አስተዳዳሪ ሆነው ሰርተው የነበሩት ካቱምቢ ባለፈው መስከረም ወር ከፕረዚዳንት ጆሴፍ ካቢላ መንግስት ወጥተው ከተቃዋሚዎች
    ጋር ተቀላቅለዋል።አንድ ተቃዋሚ ቡድን ካቱምቢ በያዝነው አመት በሚካሄደው ፕረዚዳንታዊ ምርጫ እንዲወዳደሩ የሚጠይቅ የስም ዝርዝር ባለፈው እሁድ አቅርቦ ካቱምቢ ተቀብለውታል።ተቃዋሚው ፖለቲከኛ
    ባዕዳን ቅጥረኞችን እየመለመሉ ነው የሚለውን ክስ አስተባብለዋል። እኔን በፖለቲካ ለመጉዳት የታቀደ ክስ ነው ብለዋል።
- text: 'ዓመጺ፡ ኣብ መንጎ ደቂ ዓዲ ዝጸንሐ ዘይምርድዳእ ብዕርቂ ተፈቲሑ

    ኣብ ዓመጺ - ንኡስ ዞባ በሪኽ ኣብ መንጎ ደቂ ዓዲ ዝጸንሐ ዘይምርድዳእ፡ ብ22 ለካቲት ኣብ ዝተኻየደ ስነ-ስርዓት ብዕርቂ ተፈቲሑ።


    ወኪል ሚኒስትሪ ዞባዊ ምምሕዳር፡ መራሕቲ ሃይማኖት፡ ኣባላት ባይቶን ተወለድቲ ዓድን ኣብ ዝተረኽቡሉ ስነ- ስርዓት፡ ኣመሓዳሪ ዞባ ማእከል ሜጀር ጀነራል ሮሞዳን ዑስማን ኣውልያይ ኣብ ዘስመዖ
    ቃል፡ ናጽነት ፍረ ሓያል ሓድነትን ክቡር መስዋእትነትን ምዃኑ ድሕሪ ምጥቃስ፡ እዚ ክብርታት’ዚ’ውን ኣብ ህንጸት ሃገር መሰረታዊ ብምዃኑ፡ ዜጋታት ዕጥቆም ክገብርዎ ኣዘኻኺሩ።'
- text: ማንሲቲ ኣንጻር ባርሳ ኣብ ዝሓለፉ ሳምንታት ኣታውን ወጻእን ብቕዓት ከተርኢ ዝጸንሐት ማንሲቲ ኣብ ዝሓለፉ ክልተ ጸወታታት ገፊሕ ዓወት ክትስንድ በቒዓ ኢያ። እዚ ድማ ናብቲ ንቡር ብቕዓታ
    ከምዝተመልሰት ዘርኢ ምዃኑ ኣሰልጣኒኣ ማኑዬል ፐለግሪኒ ይገልጽ። ዝበዝሐ ስዕረት ማንሲቲ ምስ ዘይምህላው ያያ ቱረ ተዛሚዱ’ዩ ዝግለጽ። ምስ ባርሳ ኣብ 2009 ነዚ ውድድር ዝተዓወተሉ ቱረ
    ኣብዚ ናይ ሎሚ ጸወታ ብምኽንያት መቅጻዕቲ ኣይክስለፍን ኢዩ። እዚ ድማ ንመስመር ምክፍፋል’ታ ጋንታ ከፍኩሶ ከምዝኽእል ይንገር። ይኹን እምበር ማንሲቲ ኣብ ልዕሊ ክለባት ባየርሙኒክን ሮማን
    ዘመዝገበቶ ዓወታት ብዘይ ያያ ቱረ ብምንባሩ ፡ ኣብዚ ናይ ሎሚ ምሸት ጸወታ’ውን ተመሳሳሊ ውጽኢት ክምዝገብ ትጽቢት ደገፍቲ ማን ሲቲ ኢዩ። ከም ፈርናንዶ፡ ፈርናንዲኖን ሚልነርን ዝኣመሰሉ
    ተጻወትቲ ንቦታ ቱረ ክሽፍኑ እምንቶ ኣሰልጣኒ ፐለግሪኒ ኢዩ።
- text: 'ሳራዬቮ (Сарајево) የቦስኒያ-ሄርጸጎቪና ዋና ከተማ ነው።


    የሚኖርበት የህዝብ ቁጥር (1998 ዓ.ም.) 602,500 ሆኖ ይገመታል። ከተማው  ላይ ተቀምጦ ይገኛል።


    በታሪክ ብዙ ሰፈሮች በሥፍራው አካባቢ ይገኙ ሲሆን ዘመናዊው ከተማ በኦቶማን ቱርክ መንግሥት በ1453 አ.ም. አካባቢ ተሠራ።


    ዋና ከተሞች

    የአውሮፓ ከተሞች

    ቦስኒያና ሄርጸጎቪና'
- text: ኣብ ሕብሪ ጸጕርና ዘሎ ፍልልይ ክመጽእ ዝኸኣለ ብኸመይ ኢዩ? ዘ ዎርልድ ቡክ ኢንሳይክሎፔድያ ከምዝ ብምባል ይገልጽ፦ “ሕብሪ ጸጕርና ብቐንዱ ዝውሰን ብመጠን ብዝሒ ናይቲ መላኒን ዝበሃል
    ሓውሲ ቡናውን ጸሊምን ቀለም ኢዩ።” መላኒን ተፈጥሮኣዊ ቀለም ኢዩ፡ ኣብ ጸጕርና፡ ቈርበትና፡ ከምኡውን ኣብ ዓይንና ኸኣ ይርከብ። እዝ ቐለም እዝ ብብዝሒ እንተደኣ ሃልዩካ ጸጕርኻ ጸሊም ይኸውን።
    ብዝሒ ናይዝ ቐለም እናወሓደ ምስ ዝኸይድ ከኣ ናይ ጸጕርኻ ቐለም ካብ ጸሊም ናብ ቡናዊ ወይ ቀይሕ ወይ ጨዓይ ይቕየር። ፈጺሙ እንተ ዘይብልካ ድማ ጸጕርኻ ብሪቕርቕ ዝብል ጻዕዳ ይኸውን። ኣብ
    ጸጕሪ ዘጋጥም ጸገም ሓደ ምስሓውን ምምላጥን ኢዩ። እዝ ጸገማት እዝ ካብ ጥንቲ ዝነበረ ኢዩ።
