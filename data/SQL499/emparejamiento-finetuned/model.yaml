- source_sentence: 'Formacion: PROYECTOS DE INVERSION (3 Ciclo). Experiencia: ESPECIALISTA EN PROYECTOS DE INVERSION PUBLICA
    TRABAJE COMO SUBGERENTE DE ESTUDIOS DE UNIDAD FORMULADORA. GESTOR EN EJECUCION DE INVERSIONES. RESPONSABLE DE FORMULAR
