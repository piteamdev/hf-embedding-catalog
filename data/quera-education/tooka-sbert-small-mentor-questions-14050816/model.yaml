widgetData:
- source_sentence: برای بارگزاری داده و تمیزکردن داده ها ازش استفاده میشه
  sentences:
  - پانداز اصلش یه کتابخونه برا رسم نموداره، مث matplotlib، و کاری به خوندن csv یا تمیز کردن دیتا نداره.
  - انتشار رو به عقب وظیفه دارد مقدار پیش‌بینی شبکه را با حرکت از خروجی به ورودی به دست آورد.
  - جیلبریکینگ همان پرامپت اینجکشن است که فقط در نسخه‌های جدیدتر هوش مصنوعی استفاده می‌شود.
- source_sentence: LLMها مخصوص کار با عکس و صوت هستن و اصلاً برای فهم یا ساختن متن ساخته نشدن.
  sentences:
  - چون پانداس یکی از توابع داخلی و built-in پایتونه، هیچوقت لازم نیست با pip نصبش کنیم و همیشه بدون import هم در دسترس هست.
  - این مدل‌ها برخلاف نامشان صرفاً مدل‌های بینایی هستند و توانایی کار با زبان طبیعی را ندارند
  - فرقی بین Model Hub و Spaces نیست و هر دو فقط محل نگهداری مدل‌ها هستن.
- source_sentence: ساختار SUM به صورت SUM(Column) است، درحالی‌که ساختار SUMX به شکل SUMX(Table, Expression) است.
  sentences:
  - نقش Model Hub ساخت رابط کاربری و نقش Spaces نگهداری مدل‌های دسته‌بندی‌نشده است.
  - نفوذ غیرمجاز به زیرساخت‌های شبکه‌ای مدل‌های زبانی را پرامپت هکینگ می‌گویند.
  - SUM یک Iterator است و می‌تواند یک عبارت را روی تک‌تک ردیف‌های جدول اجرا کند.
- source_sentence: SUM برای محاسبه یک Expression به صورت جداگانه روی هر ردیف طراحی شده و سپس نتایج را جمع می‌کند.
  sentences:
  - TDD صرفاً تکنیکی برای تولید رسانه است و ارتباطی با چرخه‌ی Red-Green-Refactor در توسعه نرم‌افزار ندارد.
  - تنها تفاوت SUM و SUMX در نام تابع است و از نظر کاربرد و نحوه پردازش، عملکرد یکسانی دارند.
  - SUM یک Iterator است و می‌تواند یک عبارت را روی تک‌تک ردیف‌های جدول اجرا کند.
- source_sentence: فرقی نمی‌کنه از SUM استفاده کنیم یا SUMX؛ هر دو فقط همه عددهای جدول رو جمع می‌کنن.
  sentences:
  - تنها تفاوت SUM و SUMX در نام تابع است و از نظر کاربرد و نحوه پردازش، عملکرد یکسانی دارند.
  - انتشار رو به عقب وظیفه دارد مقدار پیش‌بینی شبکه را با حرکت از خروجی به ورودی به دست آورد.
  - نفوذ غیرمجاز به زیرساخت‌های شبکه‌ای مدل‌های زبانی را پرامپت هکینگ می‌گویند.
