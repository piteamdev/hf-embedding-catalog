widgetData:
- text: "ዳልጋ ኣንበሳ  ኢትዮጵያ ውስጥ የሚገኝ አጥቢ እንስሳ ነው።\n\nየእንስሳው ሳይንሳዊ ጸባይ\n\nአስተዳደግ\n\nበብዛት የሚገኝበት መልክዓ ምድር  እና ብዛቱ\n\nየእንስሳው ጥቅም\
    \ \n\nየኢትዮጵያ አጥቢ እንስሳት\nታላላቅ ድመቶች"
- text: "ሳላ ኢትዮጵያ፣ አፍሪካና አረቢያ ውስጥ የሚገኝ አጥቢ  እንስሳ ነው።\n\nየእንስሳው ሳይንሳዊ ጸባይ\n\nአስተዳደግ\n\nበብዛት የሚገኝበት መልክዓ ምድር  እና ብዛቱ\n\nየእንስሳው\
    \ ጥቅም \n\nየኢትዮጵያ አጥቢ እንስሳት\nየቶራ አስተኔ"
- text: ጠቅላይ ሚኒስትር ዐቢይ አህመድ በመተከል ዞን ነዋሪዎችን ባወያዩበት ማግስት ጭፍጨፋ መፈጸሙ ለሰጡት የሥራ መመሪያ የቤኒሻንጉል ጉሙዝ ክልል አመራሮች ተገዢ አለመሆናቸውን እንደሚያሳይ
    ተገለጸ፡፡
- text: 'ዓመጺ፡ ኣብ መንጎ ደቂ ዓዲ ዝጸንሐ ዘይምርድዳእ ብዕርቂ ተፈቲሑ

    ኣብ ዓመጺ - ንኡስ ዞባ በሪኽ ኣብ መንጎ ደቂ ዓዲ ዝጸንሐ ዘይምርድዳእ፡ ብ22 ለካቲት ኣብ ዝተኻየደ ስነ-ስርዓት ብዕርቂ ተፈቲሑ።


    ወኪል ሚኒስትሪ ዞባዊ ምምሕዳር፡ መራሕቲ ሃይማኖት፡ ኣባላት ባይቶን ተወለድቲ ዓድን ኣብ ዝተረኽቡሉ ስነ- ስርዓት፡ ኣመሓዳሪ ዞባ ማእከል ሜጀር ጀነራል ሮሞዳን ዑስማን ኣውልያይ ኣብ ዘስመዖ
    ቃል፡ ናጽነት ፍረ ሓያል ሓድነትን ክቡር መስዋእትነትን ምዃኑ ድሕሪ ምጥቃስ፡ እዚ ክብርታት’ዚ’ውን ኣብ ህንጸት ሃገር መሰረታዊ ብምዃኑ፡ ዜጋታት ዕጥቆም ክገብርዎ ኣዘኻኺሩ።'
- text: ኮንጎ ዴምክራሲያዊት ሪፖብሊክ ምሥራቃዊ አካባቢዎች ውስጥ እሥላማዊ ታጣቂዎች ትናንት ፈፀሙት በተባለ ጥቃት 46 ሲቪሎች መገደላቸውን የክፍለሃገሩ የደህንነት ኃላፊ አድጆ ጊዲ ለሮይተርስ
    ገልፀዋል።የተባበሩት ዴሞክራሲያዊ ኃይሎች የሚባል ቡድን ከጥቃቱ ጀርባ እንዳለ በመጠቆም የከሰሱት ጊዲ ኢሩሙ በሚባለው አካባቢ ወደምትገኘው ቀበሌ ወታደሮች መላካቸውንና ምርመራ መጀመሩን አመልክተዋል።
    ምሥራቃዊዎቹ የኮንጎ አካባቢዎች ላይ ባለፉት ሁለት ዓመታት ውስጥ በዚሁ ታጣቂ ቡድን በተጣሉ ጥቂቶች ከአንድ ሺህ በላይ ሲቪሎች መገደላቸውን የተባበሩት መንግሥታት ድርጅት መረጃ ይጠቁማል።በዩሃንዳ፣
    በሩዋንዳና በቡሩንዲ አዋሳኝ አካባቢዎች ላይ ከመቶ በላይ ታጣቂ ቡድኖች በየጫካው እንደሚገኙ ተዘግቧል። ቀደም ሲል ለተጣሉት ጥቃቶች እሥላማዊ መንግሥት ቡድን ኃላፊነት ቢወስድም የመንግሥታቱ
    ድርጅት ግን በታጣቂዎቹና በእሥላማዊ መንግሥት ቡድን መካከል ግንኙነት ሰለመኖሩ ማረጋገጫ አለማግኘቱን ይናገራል።
