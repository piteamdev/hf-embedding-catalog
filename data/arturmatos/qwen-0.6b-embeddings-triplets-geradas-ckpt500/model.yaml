      prevê a instalação de isoladores de pino poliméricos classe 15kV (I-2) e conectores de derivação de cunha (0-9) com
      suas respectivas coberturas (A-7). No que diz respeito aos condutores, o uso de fio coberto para amarração (M-7) deve
      observar as orientações de dimensionamento contidas no capítulo 9, conforme detalhado na Nota 1 das especificações.
      Para a fixação dos componentes na parte inferior do braço suporte, conforme indicado no detalhe A, utilizam-se parafusos
