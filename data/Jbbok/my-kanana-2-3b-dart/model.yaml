- source_sentence: 네이버의 제27기(2025년) 별도 기준 영업수익은 얼마인가요?
  sentences:
  - 'CJ제일제당(주) | 사업보고서 | 2025-12-31


    <미시적/거시적 요인에 따른 분석>


    식품 사업 부문은 주요 곡물 가격이 전년에 이어 하향 안정화되었으나, 국내외 대외 정세 불확실성으로 인해 변동성이 확대되었습니다. 또한, 인플레이션과 경기 불안으로 소비 심리가 위축되며 국내 식품 매출이 전년 대비
    부진했고, 이에 따라 국내 식품 이익이 감소했습니다.

    해외식품 매출의 80% 이상을 차지하는 미국의 경우 피자 등 일부 카테고리에서 가격 경쟁 강도는 심화되었으나, 당사의 브랜드 파워와 뛰어난 제품 경쟁력을 기반으로 지속적으로 시장점유율 1위를 기록하고 있습니다.
    미국의 메인스트림 그로서리 채널에서 비비고 만두와 Red Baron 피자는 1위 지위를 공고히 하며 그 위치를 수성하고 있습니다. 유럽에서는 메인스트림 채널 신규 입점 및 제품 확대, 신규 국가 진출에 힘입어 전년
    대비 매출의 20% 이상 성장하는 등 글로벌 영토 확장세가 지속되고 있습니다.'
  - '네이버(주) | 사업보고서 | 2025-12-31


    ※ 제27기(당기)는 주주총회 승인 전 연결재무제표입니다.

    향후 정기주주총회에서 재무제표 승인 관련 안건이 부결되거나 수정이 발생한 경우

    정정보고서를 통해 그 내용 및 사유 등을 반영할 예정입니다.


    2025년은 글로벌 경기의 불확실성과 경쟁 심화가 지속되는 환경 속에서도 당사는 기술 경쟁력과 플랫폼 역량을 기반으로 안정적인 성장세를 이어갔습니다. 그 결과 2025년 연결 기준 영업수익 12조원, 영업이익 2.2조원을
    기록하며 주요 사업 전반에서 견조한 실적을 기록하였습니다.


    특히 AI 기술을 기반으로 한 서비스 고도화를 통해 사용자 경험과 사업 성과 간의 연결을 강화하였습니다. 맞춤형 콘텐츠 및 광고를 제공하는 피드형 지면 확대와 함께 개인화 추천, 검색 고도화, 광고 타게팅 정교화,
    상품 및 콘텐츠 노출 최적화, 리뷰 요약 등 다양한 영역에서 AI 적용을 확대하며 체류시간 증가 및 광고 효율 개선 성과를 지속적으로 확인하였습니다.'
