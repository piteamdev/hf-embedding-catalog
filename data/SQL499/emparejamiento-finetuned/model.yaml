  - 'APOYO ADMINISTRATIVO EN CONTROL DE ASISTENCIA Y ESCALAFÓN. Sector: Gobierno. Ocupacion: asistente administrativo. Competencias:
    archivar documentos; asegurar la correcta gestión de documentos; realizar actividades corrientes de oficina'
  - 'Jefe de Recursos Humanos. Sector: Servicios sociales y de salud. Ocupacion: responsable de recursos humanos. Competencias:
    Derecho del Trabajo; Excel (Intermedio); apoyar a los empleados en su formación; asistir en la implementación de programas
