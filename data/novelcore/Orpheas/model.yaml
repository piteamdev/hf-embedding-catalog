- source_sentence: Evocati Augusti, Διομητιανός, Κικέρωνας, ρωμαϊκός στρατός
  sentences:
  - 'ΝΟΜΟΣ ΨΛΓ΄ της 7/12 Δεκ. 1878 (ΦΕΚ 72) Περί παραιτήσεως δικαιώματος επιβολής ποινικής ρήτρας εις το εν Στάϋρ της Αυστρίας
    οπλουργείον. Προσωρινής ισχύος, ως και οι: α)Νόμ. ΑΩϞΗ΄ της 26 Φεβρ. /1 Μαρτ. 1891 περί εγκρίσεως δαπανών δια την προμήθειαν
    αρβυλών του στρατού. β)Νόμ. (ΔΡΞΗ) 34 της 31 Μαρτ. /8 Απρ. 1913 περί των ενεργουμένων ή ενεργηθεισών προμηθειών εν γένει,
    μετακομίσεων και εργασιών δια τας ανάγκας του πολέμου και διαρκούσης της επιστρατεύσεως. γ)Νόμ. 426 της 27 Νοεμ./4 Δεκ.
    1914 «περί συμβάσεως δια την κατασκευήν εν Ελλάδι βλημάτων ασκήσεων (ακυρωθείς δια του Ν.Δ. 1759/1919). δ)Νόμ. 1019 της
    31 Οκτ. /3 Νοεμ. 1917 περί εκδόσεως πιστοποιήσεως αγοραίας τιμής αγοραζομένων υπό του στρατού ειδών. ε)Ν.Δ. 1759 της 5/19
    Μαρτ. 1919 περί ακυρώσεως του υπ’ αριθ. 426 Νόμου. ς)Νόμ. 1878 της 17 Ιαν. /6 Φεβρ. 1920 περί κυρώσεως του από 4 Μαΐου
    1919 Ν.Δ/τος «περί θεραπείας πάσης φύσεως αναγκών εν γένει εις τας στρατιωτικώς καταλαμβανόμενα μέρη της Μ. Ασίας. ζ)Νόμ.
    2410 της 27 Ιουν. /10 Ιουλ. 1920 περί κυρώσεως του από 28 Σεπτ. 1919 Ν.Δ/τος περί συστάσεως επιτροπών παραλαβής αγοραζομένου
    υλικού εν τω εξωτερικώ. η)Νόμ. 3903 της 13/18 Φεβρ. 1929 περί ακυρώσεως της μεταξύ του Ελλ. Δημοσίυ και της Αν. Εταιρείας
    «Ελληνική Εριουργία» συμβάσεως της 31 Μαρτ. 1926. θ)Νόμ. 4447 της 3/14 Σεπτ. 1929 περί καταργήσεως του από 30 Οκτ. /1
    Νοεμ. 1925 Ν.Δ/τος περί κυρώσεως συμβάσεως μεταξύ υπουργείου Στρατιωτικών και της Εταιρείας Ελληνικού Πυριτιδοποιείου
    και Καλυκοποιείου περί κατασκευής 450.000.000 φυσιγγίων. ι)Νόμ. 5645 της 31 Αυγ. /7 Σεπτ. 1932 περί διαλύσεως της μετά
    των υφαντουργικών Εταιρειών από 30 Ιουλ. 1917 συμβάσεως του Δημοσίου περί προμηθείας ειδών ιματισμού δια την Στρατιωτικήν
    Υπηρεσίαν.'
  - 'Τίτλος: ΝΟΜΟΣ ΥΠ'' ΑΡΙΘΜ. 4174

    Έτος: 2013

    Φορολογικές διαδικασίες και άλλες διατάξεις.

    Άρθρο 24

    Τίτλος άρθρου: Πρόσβαση στα βιβλία και στοιχεία

    1. Η Φορολογική Διοίκηση έχει δικαίωμα να λαμβάνει αντίγραφα των βιβλίων και στοιχείων, καθώς και λοιπών εγγράφων, για
    τα οποία ο φορολογούμενος δηλώνει ότι αντιπροσωπεύουν ακριβή αντίγραφα. Σε περίπτωση που ο φορολογούμενος αρνείται να
    προβεί στην ανωτέρω δήλωση, ο οριζόμενος από τη Φορολογική Διοίκηση υπάλληλος προβαίνει σε σχετική επισημείωση επί των
    εγγράφων. Ο οριζόμενος υπάλληλος δύναται ταυτόχρονα να απαιτεί από το φορολογούμενο ή τον φορολογικό εκπρόσωπό του να
    παρίσταται στον τόπο όπου διενεργείται ο φορολογικός έλεγχος και να απαντά σε ερωτήματα που του τίθενται, ώστε να διευκολύνεται
    η διενέργεια του φορολογικού ελέγχου.

    2. Εάν τα βιβλία και στοιχεία τηρούνται σε ηλεκτρονική μορφή, η Φορολογική Διοίκηση έχει δικαίωμα πρόσβασης σε οποιαδήποτε
    φυλασσόμενα αρχεία, καθώς και στα λογιστικά προγράμματα και τις πληροφορίες που έχουν καταχωριστεί σε αυτά. Η Φορολογική
    Διοίκηση δικαιούται να λαμβάνει τα ηλεκτρονικά αρχεία σε αναγνώσιμη ηλεκτρονική ή έντυπη μορφή.

    3. Ο υπάλληλος που έχει ορίσει η Φορολογική Διοίκηση δύναται να κατάσχει βιβλία και στοιχεία που τηρούνται ή διαφυλάσσονται
    σύμφωνα με τη φορολογική νομοθεσία και οποιαδήποτε άλλα ανεπίσημα βιβλία, έγγραφα, αρχεία ή στοιχεία, εφόσον το θεωρήσει
    αναγκαίο, προκειμένου να διασφαλισθεί η αποδεικτική αξία αυτών.'
  - 'Evocatus

    Evocatus είναι ο λατινικός όρος που αναφέρεται στο στρατιώτη εκείνο του ρωμαϊκού στρατού που ολοκλήρωσε τη θητεία του,
    έλαβε το απολυτήριό του "(missio)", ωστόσο επέλεξε εθελοντικά να καταταγεί και πάλι, έπειτα από πρόσκληση κάποιου υπάτου
    ή άλλου διοικητή.

    Από ό,τι φαίνεται, πάντα υπήρχε σημαντικός αριθμός από evocati σε κάθε αξιόλογο στρατό, και όταν ο στρατηγός ήταν αγαπητός
    στους άνδρες του, ο αριθμός βετεράνων που κατατάσσονταν και πάλι στα στρατεύματά του ήταν αυξημένος. Οι evocati απαλλάσσονταν,
    όπως οι vexillationes, από τις συνηθισμένες στρατιωτικές αγγαρείες, όπως για παράδειγμα την ύψωση οχυρωμάτων για το στρατόπεδο
    ή την κατασκευή δρόμων Ο βαθμός τους γενικότερα θεωρείτο υψηλότερος από αυτόν των συνηθισμένων λεγεωναρίων. Ορισμένες
    φορές γίνεται κοινή αναφορά σε αυτούς με τους ιππείς, ενώ άλλες φορές κατατάσσονται με τους εκατοντάρχους. Φαίνεται δε
    πως συχνά λάμβαναν προαγωγή για το αξίωμα του εκατοντάρχου. Συνεπώς, ο Πομπήιος παρακίνησε πολλούς από τους βετεράνους
    που υπηρέτησαν υπό τις διαταγές του σε προγενέστερα έτη να ενωθούν μαζί του κατά την περίοδο των εμφυλίων πολέμων, υποσχόμενος
    ανταμοιβές και τη διοίκηση εκατονταρχιών. Ωστόσο δεν μπορούσαν όλοι οι evocati να γίνουν εκατόνταρχοι, ούτε να αποτελέσουν
    τμήμα ορισμένων από τις κοόρτεις. Ο ρήτορας Κικέρων κάνει αναφορά σε κάποιον "praefectus evocatorum", έναν αξιωματικό
    επικεφαλής για τους evocati.

    Με το όνομα evocati ήταν επίσης γνωστά τα μέλη ενός επίλεκτου σώματος νεαρών ανδρών από την τάξη των ιππέων στους οποίους
    ανέθεσε ο Αυτοκράτορας Διομητιανός να φυλάσσουν την κρεβατοκάμαρά του. Ορισμένοι συγγραφείς υποστηρίζουν ότι το σώμα αυτό
    επιβίωσε και κατά την εποχή επόμενων αυτοκρατόρων, με αποτέλεσμα να ταυτίζεται με εκείνους που αργότερα έγιναν γνωστοί
    ως "Evocati Augusti".'
