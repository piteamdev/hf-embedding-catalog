      정정보고서를 통해 그 내용 및 사유 등을 반영할 예정입니다.


      2025년은 글로벌 경기의 불확실성과 경쟁 심화가 지속되는 환경 속에서도 당사는 기술 경쟁력과 플랫폼 역량을 기반으로 안정적인 성장세를 이어갔습니다. 그 결과 2025년 연결 기준 영업수익 12조원, 영업이익
      2.2조원을 기록하며 주요 사업 전반에서 견조한 실적을 기록하였습니다.


      특히 AI 기술을 기반으로 한 서비스 고도화를 통해 사용자 경험과 사업 성과 간의 연결을 강화하였습니다. 맞춤형 콘텐츠 및 광고를 제공하는 피드형 지면 확대와 함께 개인화 추천, 검색 고도화, 광고 타게팅 정교화,
