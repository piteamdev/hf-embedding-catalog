    Localizada em Cosmópolis, São Paulo, a instalação de titularidade da Usina Açucareira Ester S.A. seguiu os trâmites do
    Processo nº 48500.003200/2008-75. A unidade teve sua capacidade ampliada conforme as diretrizes da Portaria MME nº 168,
    de 6 de maio de 2008, consolidando o planejamento estabelecido originalmente na Resolução nº 117 de 20 de maio de 1999,
    visando assegurar que a energia produzida fosse devidamente integrada ao sistema elétrico nacional nos prazos regulamentares
    previstos pela agência sob a gestão de Alessandro D'Afonseca Cantarino.
- source_sentence: Quando devo instalar a manilha de transmissão na parte inferior do braço suporte tipo C?
  sentences:
  - A estrutura CE2.CE3 – Sem Chave Fusível integra os padrões de instalações para redes de distribuição compactas da ND-2.9.
    Na montagem desse conjunto, destaca-se o uso do braço suporte tipo "C" (item F-6), que pode ser acompanhado por manilhas
    de transmissão e manilhas sapatilha (F-22). De acordo com a lista de materiais para os modelos C e DT-M, a configuração
    prevê a instalação de isoladores de pino poliméricos classe 15kV (I-2) e conectores de derivação de cunha (0-9) com suas
    respectivas coberturas (A-7). No que diz respeito aos condutores, o uso de fio coberto para amarração (M-7) deve observar
    as orientações de dimensionamento contidas no capítulo 9, conforme detalhado na Nota 1 das especificações. Para a fixação
    dos componentes na parte inferior do braço suporte, conforme indicado no detalhe A, utilizam-se parafusos de cabeça abaulada
    M16 (F-31a) e arruelas quadradas (A-26), além de elementos como o grampo de ancoragem para cabo coberto (M-10a) e o isolador
    de ancoragem polimérico (I-4a). A estrutura exige ainda a aplicação de cintas de aço (F-10) e cantoneiras retas (F-4)
    para garantir a estabilidade do conjunto montado, respeitando as notas técnicas sobre as características de rede para
    a estrutura CE2.CE3.
