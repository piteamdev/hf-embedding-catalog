widgetData:
- source_sentence: Izibongo zenkosi uShaka
  sentences:
  - "IJile Timuga yi-woreda engaphansi kwesifundazwe se Amhara, e-Itiyopiya.\n\nImithombo \n\nAma-Woreda ase Itiyopiya"
  - "I-Uuyoka yisigodi esincane esikwisifundazwe se Oshikoto, eNamibhiya. Lesigodi singaphansi kwesifunda se-Onayena.\n\n\
    Imithombo \n\nAmadolobha aseNamibhiya\nIzigodi zase Namibhiya"
  - "I-Omatako yisifunda esikwisifundazwe se Otjozondjupa, eNamibhiya.\n\nImithombo \n\nIzifunda zase Namibhiya"
  - "IGoncha yi-woreda engaphansi kwesifundazwe se Amhara, e-Itiyopiya.\n\nImithombo \n\nAma-Woreda ase Itiyopiya"
  - '395 Waye wanqamula kuMadungela,

    Wadl’ ezazisengwa yindiki yakwaMavela,

    Kwath’ ezikaSihayo zamlandela;

    UQwabe wadla ngokumsibekela,

    Isibekelo sawoNyabase.'
- source_sentence: 'Atúmọ̀-Èdè (Yorùbá-Gẹ̀ẹ́sì): Ba'
  sentences:
  - 'Agbègbè ìjọba ìbílẹ̀ Atigbo jẹ́ agvègbè ìjọba ìbílẹ̀ ní ìpínlẹ̀ Ọ̀yọ́ tí ó fìdí kalẹ̀ sí Tedé.


    Nọ́mbà ìforúkọ sílẹ̀ rẹ̀ bẹ̀rẹ̀ pẹ̀lú: TDE


    Amioro ifiletaranse: 203


    Àwọn ìtọ́ka sí


    Atigbo'
  - "6.\tFun: v.(i) to blow: Ó fun fèrè; He blows the whistle (ii) to play: Wọ́n fun fèrè; They played a wood wind."
  - "(8)\tOrísìí Gbóóhùn Yorùbá:  Orísìí gbólóhùn méta ni ó wà ni èdè Yorùbá- (i) gbólóhùn abode, (ii) gbólóhùn oníbò àti\
    \ (iii) gbólóhùn alákànpò."
  - "Átẹ́ẹ̀nì tabi Átẹ̀nsì (, Athina, ) jẹ́ olúìlú Gríìsì.\n\nItokasi \n\nÀwọn ìlú àti abúlé ní Gríìsì\nÀwọn olúìlú ní Europe"
  - Ọ̀pọ̀lọpọ̀ ilé-iṣẹ́ ìròyìn ni ó gbé ìròyìn ikú bàbá rẹ̀ láti ọwọ́ àwọn darandaran ìlú rẹ̀, wọ́n sì ba kẹ́dùn.
- source_sentence: Barney Pityana
  sentences:
  - UNyameko Barney Pityana FKC GCOB (owazalwa ngo-7 Ncwaba 1945) ungummeli wamalungelo abantu nesazi semfundiso yenkolo eNingizimu
    Afrika. Ungumsekeli we-Black theology.
  - U-Alvin Clarence Thomas (Novemba 30, 1893 - Meyi 19, 1974) wayengumgembuli waseMelika, igalofu, kanye ne-hustler, owabulala
    amadoda amahlanu kodwa akazange abekwe icala lobugebengu, elaziwa kangcono nge-Titanic Thompson.
  - UBrandy Ryana Norwood (owazalwa ngoFebhuwari 11, 1979), owaziwa njengoBrandy, ungumculi nomlingisi waseMelika ohlukaniswa
    ngemibono yakhe yobuciko.
  - "Imiklomelo \nUmsebenzi wakhe ngamalungelo abantu uye waqashelwa kabanzi, kwathi ngoZibandlela 2002, wanikezwa uMhlonishwa\
    \ uMklomelo Ohlonishwa Wemiklomelo ye-UNESCO Yemfundo Yamalungelo Abantu ka-2002."
  - Herodas play 'iDemo yamahlaya, lwe-Mime VI, kulotshiwe 3rd Century BCE, imayelana owesifazane othile wasishayela ucingo
    Metro, ukukhathazeka ukuthola esivela kumngane muva lapho yena aluthola dildo.
- source_sentence: Mushonga wenhomba
  sentences:
  - Mishonga yenhomba mizhinji inogadzirwa neutachiwana hwakashaiswa simba kana kuti hwakapomhodzwa uturu. Mishonga yenhomba
    yakaita zvekugadzirwa inogadzirwa nezvidimbu zvezvigadziriso kana kuti zvizere.
  - Muhacha, muchakata, mubuni kana muisha (mobola plum, hissing tree. ) muti unowanikwa muZimbabwe unobereka vana vakada
    kuenzana nemazhanje. Muchero wacho unonzi hacha, chakata kana mbura.
  - Muromo (lips) inhengo iri pasi pemhuno yakapendera mukanwa munotambira chikafu pakudya. Nekumwe kutaura mukanwa mukati,
    muromo ndiko kunze asi mazwi aya anoshandiswa achichinjaniswa.
  - Mutunhu uyu unonaya mvura inosvika 450-650mm pagore. Mutunhu uyu unorimwa nzvimbo dzakatambarara zviri pakati uye kwakanakira
    kupfuya zvipfuwo nokudyara mbesa dzinotirira mhari. Kurima miti yesango, kuchengeta mhuka dzesango, nezvevashanyi mamwe
    emabasa anoitwa kumutunhu uyu.
  - "Hunhu neTsika dzake \nMambo Mutota waibva kurusinga kana dzinza reMakaranga rinokandwa pazasi pezwi rokuti Shona mutsika\
    \ dzanhasi."
- source_sentence: Nọ́mbà gidi
  sentences:
  - A n so pe nomba gidi se sesiro ti igbese isiro ti a mo si Algorithm ba wa ti yio mu eyonomba re wa. Nitoripe bo tile wu
    ki awon algorithm re o po to, won niye pato (countable), sugbon awon nomba gidi ko niye (uncountable), nitori eyi opo
    ninu awon nomba gidi ni won ko se sesiro.
  - 'Àwọn àpẹrẹ

    Àwọn nọ́mbà gidi, tí wọ́n jẹ́ gbígbékàlẹ̀ bíi ìpín nọ́mbà odidi méjì a àti b, tí b kò dọ́gba mọ́ òdo, nitelorun ìtumọ̀
    ọkè nítorí  ni wẹ́wẹ́ .'
  - Ọjọ́ mẹ́tàdínlógún, oṣù Ṣẹrẹ, ọdún 1966, Aguiyi-Ironsi dí olórí orílẹ̀-èdè. Ó sì di ipò yìí mú títí di ọjọ́ kankàndílọ́gbọ̀n,
    oṣù Ṣẹrẹ, ọdùn 1966, nígbà tí àwọn ológùn Àríwá gbógùn ti ìjọba rẹ̀ tí wọ́n sì pa Aguiyi-Ironsi.
  - Abí Fọlákẹ́ ní ìlú Èkó, Nàíjíríà ni ọdun 1974. Lẹ́hìn  ẹ̀kọ́ rẹ̀ ńi Switzerland àti ìlú United Kingdom, Ó gba oyè ilé-ìwé
    gíga nínú ìmọ̀-òfin eporọ̀bì. Fọlákẹ́ padá  sí orílẹ̀-èdè Nàíjíríà  láti tẹ̀síwájú nínú isẹ́ asasọlẹsọ
  - '10126 Lärbro jẹ́  plánẹ́tì kékeré ní ibi ìgbàjá ástẹ́rọ́ìdì.


    Àwọn ìtọ́kasí


    Àwọn ástẹ́rọ́ìdì

    Àyọkà kúkurú'
