widgetData:
- source_sentence: الخط الساخن 137 طوارئ ورعايات وحضانات وزارة الصحة بيشتغل إزاي؟ وجزاكم الله خيراً
  sentences:
  - healthcare_medical
  - في حالات الطوارئ الحرجة التي تتطلب سرير رعاية مركزة (ICU) أو حضانة أطفال مبتسرين، اتصل فوراً بالخط الساخن لوزارة الصحة
    137 (غرفة طوارئ الرعايات والحضانات المركزية). جهز التقرير الطبي المفصل للحالة والتشخيص والغازات بالدم وما إذا كان المريض
    يحتاج جهاز تنفس صناعي (Ventilator). تقوم الغرفة بالربط مع جميع المستشفيات الحكومية والجامعية والتابعة لأمانة المراكز المتخصصة
    لتسكين الحالة في أقرب سرير متاح مجاناً، ونقل المريض بواسطة سيارة إسعاف مجهزة بالاتصال برقم 123.
  - icu_neonatal_incubator_emergency_137
  - حجز موعد للكشف لدى الاستشاريين بالمراكز الطبية المتخصصة يتم هاتفياً أو عبر تطبيقات الحجز الإلكتروني لتفادي فترات الانتظار
    الطويلة بالعيادات الخارجية.
- source_sentence: لو سمحت حسبة غرامة الاسترداد المبكر لشهادات الادخار في البنك التجاري الدولي CIB ولكم جزيل الشكر
  sentences:
  - لربط شهادة ادخار جديدة بعائد شهري ثابت أو متغير، بتدخل على حسابك في تطبيق الموبايل البنكي وتختار 'إصدار شهادات وودائع'،
    وتحدد نوع الشهادة والمبلغ المطلوب خصمه من حسابك الجاري أو التوفير.
  - fintech_banking
  - طبقاً لتعليمات البنك المركزي المصري، لا يجوز استرداد أو كسر الشهادات البنكية الادخارية إلا بعد مرور 6 أشهر كاملة من تاريخ
    إصدارها. في حالة الكسر بعد مرور المدة القانونية، بيتم خصم نسبة من العوائد والأرباح اللي تم صرفها شهرياً طبقاً لجدول الاسترداد
    الخاص بالبنك (غرامة استرداد مبكر)، ويمكن معرفة القيمة الاستردادية الدقيقة عبر تطبيق الموبايل البنكي من خيار 'استرداد الشهادة'
    قبل التأكيد، أو بمراجعة خدمة العملاء بالفرع.
  - break_certificate_of_deposit
- source_sentence: يا جماعة هل ينفع افتح كرتونة الشحن واقيس اللبس قبل ما ادفع للمندوب في مايلرز؟ ضروري جداً
  sentences:
  - ecommerce_retail
  - خدمة الشحن المجاني تطبق تلقائياً على الطلبات المؤهلة التي تتجاوز قيمتها الحد الأدنى للشراء المحدد من المتجر دون الحاجة
    لإدخال كود خصم في صفحة الدفع.
  - لتتبع شحنتك مع شركات الشحن السريع المحلية (مثل بوسطة Bosta أو مايلرز Mylerz أو أرامكس)، ادخل على موقع الشركة الرسمي واكتب
    رقم البوليصة (Tracking Number) المكون من أرقام والموجود في رسالة ال SMS لتحديد مكان الطرد بدقة. في حالة تسجيل المندوب
    'تعذر الاتصال' أو محاولة توصيل غير صحيحة، اتصل فوراً بخدمة عملاء الشركة أو بلغ المتجر البائع لإعادة جدولة التوصيل وفتح
    تحقيق مع المندوب؛ والمندوب ملزم بعدم طلب أي مبالغ إضافية عن القيمة المسجلة بالبوليصة الرسمية.
  - bosta_mylerz_shipping_tracking
- source_sentence: إيه الأوراق المطلوبة ورسوم تجديد رخصة القيادة الخاصة في المرور؟ عشان الدنيا واقفة معايا
  sentences:
  - لاستخراج رخصة قيادة خاصة لأول مرة، يشترط ألا يقل السن عن 18 سنة، واجتياز الدورة التدريبية واختبارات الإشارات والقيادة
    العملية في مدرسة المرور المعتمدة وسداد رسوم التدريب.
  - 'لتجديد رخصة القيادة الخاصة، توجه لوحدة المرور التابع لها محل إقامتك المدون بالبطاقة ومعك: أصل بطاقة الرقم القومي والرخصة
    المنتهية وصورتين شخصيتين، شهادة براءة الذمة (شهادة المخالفات) من نيابة المرور أو البريد، والخضوع للكشف الطبي المميكن (باطنة
    ورمد وفصيلة دم) داخل المرور. اشترِ نموذج 256 مرور وسدد ضريبة الرخصة ورسم التأمين الإجباري والملصق لمدة 10 سنوات؛ وفترة
    السماح بعد الانتهاء هي شهر واحد فقط بدون غرامة قيادة برخصة منتهية.'
  - private_driver_license_renewal
  - government_services
- source_sentence: هو غرامة كسر الشهادة في البنك الأهلي أو بنك مصر بتتحسب إزاي؟ ولكم جزيل الشكر
  sentences:
  - break_certificate_of_deposit
  - طبقاً لتعليمات البنك المركزي المصري، لا يجوز استرداد أو كسر الشهادات البنكية الادخارية إلا بعد مرور 6 أشهر كاملة من تاريخ
    إصدارها. في حالة الكسر بعد مرور المدة القانونية، بيتم خصم نسبة من العوائد والأرباح اللي تم صرفها شهرياً طبقاً لجدول الاسترداد
    الخاص بالبنك (غرامة استرداد مبكر)، ويمكن معرفة القيمة الاستردادية الدقيقة عبر تطبيق الموبايل البنكي من خيار 'استرداد الشهادة'
    قبل التأكيد، أو بمراجعة خدمة العملاء بالفرع.
  - fintech_banking
  - الحد الأدنى لفتح حساب التوفير في البنوك المصرية الحكومية يبدأ من 300 جنيه مصري، ويتم احتساب العائد على أقل رصيد متبقي
    في الحساب خلال الشهر وصرفه شهرياً أو ربع سنوياً.
