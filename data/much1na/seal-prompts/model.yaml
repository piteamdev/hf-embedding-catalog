- source_sentence: "Tex Stackexchange\n\nQ: LYx 2.2. (Cannot view the file pdf) I get this error when trying to view the file:\n\
    The external program pdflatex finished with an error ... check the logs.\n\n(I am using LyX 2.2.0  Windows 7) \n"
  sentences:
  - 'Stackoverflow Stackexchange


    Q: Convert Bitmap to File I understand that using BitmapFactory can convert a File to a Bitmap, but is there any way to
    convert a Bitmap image to a File?


    A: Try this:

    bitmap.compress(Bitmap.CompressFormat.PNG, quality, outStream);


    See this

    '
  - "Apple Stackexchange\n\nQ: Turn Wifi Off via command line I'm sharing my internet in work and forgot to turn it off! Does\
    \ anyone know how I can do it via the command line? I have SSH access but thats it. D'oh. \n\nA: Try \nnetworksetup -setairportpower\
    \ en0 off\n\n"
  - 'Stackoverflow Stackexchange


    Q: How to run 16 bit code on 32 bit Linux? I have written a small 16-bit assembly program that writes some values in some
    memory locations.Is there a way I can test it in 32-bit protected mode on Linux?


    A: qemu, dosbox, bochs

    '
- source_sentence: 'Stackoverflow Stackexchange


    Q: What is a good gitignore to use with Codeblocks C++ Projects? This is what I have so far:

    obj/

    bin/


    Anything else?


    A: You can use this:

    *.layout

    *.depend

    bin/

    obj/


    See:

    https://www.gitignore.io/api/codeblocks

    '
  sentences:
  - 'Stackoverflow Stackexchange


    Q: Listen on a network port and save data to a text file Is there some easy way in linux to listen for data on network
    and save them to a text file?

    Thank you.


    A: Also available is TCPDump.

    sudo tcpdump -i eth0 -vvvvtttAXns 1500 ''port 10000''


    '
  - 'Stackoverflow Stackexchange


    Q: Can azure CLI get a list of all resources running in a tenant? Is there a single command way to get all the resources
    in a tenant dumped out in JSON format, either in az cli or powershell?


    A: Azure CLI

    az resource list


    Powershell

    Get-AzureRmResource


    '
  - 'Stackoverflow Stackexchange


    Q: Get the current date and time I want to get the current date and time.

    For example:

    2012/11/13 06:30:38


    What I have tried:

    Dim d As System.DateTime

    MsgBox(d.Year) ''Return 1



    A: use DateTime.Now

    try this:

    DateTime.Now.ToString("yyyy/MM/dd HH:mm:ss")


    '
