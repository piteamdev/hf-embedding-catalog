widgetData:
- source_sentence: Jaký druh pozorování se provádí v umělém prostředí?
  sentences:
  - Změny v celosvětovém protestantismu za poslední století byly významné. Od roku 1900 se protestantismus rychle rozšířil
    v Africe, Asii, Oceánii a Latinské Americe. To způsobilo, že protestantismus byl nazýván především nezápadním náboženstvím.
    K velkému růstu došlo po druhé světové válce, kdy došlo k dekolonizaci Afriky a zrušení různých omezení namířených proti
    protestantům v latinskoamerických zemích. Podle jednoho zdroje tvořili protestanti 2,5%, 2%, 0,5% Latinoameričanů, Afričanů
    a Asiatů. V roce 2000 bylo procento protestantů na zmíněných kontinentech 17%, více než 27% a 5,5%. Podle Marka A. Nolla
    žilo v roce 1910 ve Spojeném království 79% anglikánů, zatímco většina zbytku byla nalezena ve Spojených státech a v celém
    Britském společenství národů. Do roku 2010 bylo v Africe nalezeno 59% anglikánů. V roce 2010 žilo v Indii více protestantů
    než ve Velké Británii nebo Německu, zatímco protestantů v Brazílii bylo tolik, kolik protestantů ve Velké Británii a Německu
    dohromady. V Nigérii a Číně jich žilo téměř tolik jako v celé Evropě. Čína je domovem největší protestantské menšiny na
    světě.
  - Biologičtí antropologové se zajímají jak o lidské variace, tak o možnosti lidských univerzálů (chování, myšlenky nebo
    koncepty sdílené prakticky všemi lidskými kulturami). Používají mnoho různých metod studia, ale moderní populační genetika,
    pozorování účastníků a další techniky často berou antropology "do terénu", což znamená cestovat do komunity v jejím vlastním
    prostředí, dělat něco, čemu se říká "práce v terénu". Pokud jde o biologickou nebo fyzickou stránku, mohou být lidská
    měření, genetické vzorky, nutriční údaje shromažďovány a zveřejňovány jako články nebo monografie.
  - Během většiny neolitického věku Eurasie žili lidé v malých kmenech složených z více pásem nebo rodokmenů. Ve většině neolitických
    společností existuje jen málo vědeckých důkazů o rozvinuté sociální stratifikaci; sociální stratifikace je spojována spíše
    s pozdější dobou bronzovou. Přestože některé pozdní euroasijské neolitické společnosti tvořily složité rozvrstvené náčelníky
    nebo dokonce státy, státy se v Eurasii vyvíjely až s nástupem metalurgie a většina neolitických společností byla vcelku
    poměrně jednoduchá a rovnostářská. Za Eurasií se však během místní neolitiky formovaly státy ve třech oblastech, konkrétně
    v Předkeramických Andách s civilizací Norte Chico, Formative Mesoamerica a Ancient Hawaiʻi. Nicméně většina neolitických
    společností byla znatelně hierarchičtější než paleolitické kultury, které jim předcházely, a kultury lovců a sběračů obecně.
- source_sentence: Pro koho byl pojmenován vodní park Uptown District v Houstonu?
  sentences:
  - Z deseti nejlidnatějších měst USA má Houston největší plochu parků a zeleně, 56 405 akrů (228 km2). Město má také přes
    200 dalších zelených ploch - celkem přes 19 600 akrů (79 km2), které spravuje město - včetně houstonského arboreta a přírodního
    centra. Skatepark Lee a Joe Jamailových je veřejný skatepark, který vlastní a provozuje město Houston, a je jedním z největších
    skateparků v Texasu, který se skládá z 30 000 (2 800 m2) čtverečních stop pozemního zařízení. Waterwall Park Geralda D.
    Hinese, který se nachází v městské čtvrti Uptown, slouží jako oblíbená turistická atrakce, svatby a různé oslavy. Studie
    Walk Score z roku 2011 zařadila Houston na 23. místo z 50 největších měst ve Spojených státech. Wet'n'Wild SplashTown
    je vodní park, který se nachází severně od Houstonu.
  - Yazhou Zhoukan se sídlem v Malajsii vedl rozhovor s bývalým výzkumným pracovníkem Čínského seismologického úřadu Geng
    Qingguo (耿庆]] [[), v němž Geng tvrdil, že 30. dubna 2008 byla Státnímu seismologickému úřadu zaslána důvěrná písemná zpráva,
    v níž varuje před možným výskytem významného zemětřesení v prefektuře Ngawa v provincii S'-čchuan kolem 8. května v rozsahu
    10 dní před nebo po zemětřesení. Geng sice uznal, že předpověď zemětřesení byla obecně považována vědeckou komunitou za
    problematickou, ale věřil, že "čím větší zemětřesení, tím snadněji se předpovídá". Geng se dlouho pokoušel najít souvislost
    mezi výskytem sucha a zemětřesení; premiér Čou En-laj se údajně o Gengovu práci zajímal. Gengova teorie souvztažnosti
    mezi suchem a zemětřesením byla poprvé zveřejněna v roce 1972 a říká se, že úspěšně předpověděla zemětřesení v Haichengu
    a Tangshanu v letech 1975 a 1976. Tentýž článek o Ja-čou Ču-kuanovi poukázal na inherentní obtíže spojené s předpovídáním
    zemětřesení. V reakci na to úředník Seismologického úřadu prohlásil, že "předpověď zemětřesení je všeobecně uznávána po
    celém světě jako obtížná z vědeckého hlediska". Úředník rovněž popřel, že by seismologický úřad obdržel zprávy předpovídající
    zemětřesení.
  - 'Tradiční systematika založená na morfologii nebo vzhledu obvykle udělila Hexapoda hodnost supertřídy,:180 a určila v
    ní čtyři skupiny: hmyz (Ectognatha), springtails (Collembola), Protura a Diplura, přičemž poslední tři byly seskupeny
    jako Entognatha na základě internalizovaných částí úst. Nadřazené vztahy prošly četnými změnami s příchodem metod založených
    na evoluční historii a genetických údajích. Nedávnou teorií je, že hexapoda jsou polyfyletické (kde poslední společný
    předek nebyl členem skupiny), přičemž třídy entognatů mají oddělenou evoluční historii od hmyzu. Mnohé z tradičních taxonů
    založených na vzhledu se ukázaly jako parafyletické, takže spíše než používat hodnosti jako podtřída, superřád a infrařád
    se ukázalo jako lepší používat monofyletické skupiny (v nichž je členem skupiny i poslední společný předek). Následující
    představuje nejlépe podporovaná monofyletická seskupení pro hmyz.'
- source_sentence: NeoGeorgainský styl byl v Británii běžný až do konce kterého desetiletí?
  sentences:
  - 'The Washington Post, The New York Times a Boston Herald zveřejnily názorové články vyjadřující podporu státnosti Portorika.
    8. listopadu 2012, Washington, D.C. noviny The Hill uveřejnily článek, který říká, že Kongres bude pravděpodobně ignorovat
    výsledky referenda vzhledem k okolnostem hlasování. a americký kongresman Luis Gutiérrez Americká kongresmanka Nydia Velázquezová,
    oba původem z Portorika, souhlasila s prohlášeními The Hill. Krátce poté, co byly zveřejněny výsledky, poznamenal americký
    kongresman portorického původu José Enrique Serrano: "Byl jsem obzvláště ohromen výsledkem referenda o "statusu" v Portoriku.
    Většina hlasujících dala najevo přání změnit stávající územní status. Ve druhé otázce ještě větší většina dotázaných žádala
    stát. Tohle je zemětřesení v portorikánské politice. Vyžádá si pozornost Kongresu a definitivní odpověď na portorikánskou
    žádost o změnu. Toto je historický okamžik, kdy voliči žádali o posun vpřed."'
  - Oživený gruzínský styl, který se v Británii objevil na počátku 20. století, bývá obvykle označován jako neogruzínský;
    práce Edwina Lutyense obsahuje mnoho příkladů. Verze novogruzínského stylu se v Británii běžně používaly pro určité typy
    městské architektury až do konce 50. let, dobrým příkladem bylo policejní velitelství Bradshawa Gasse & Hopea v Salfordu
    v roce 1958. Ve Spojených státech i v Británii je gruzínský styl stále využíván architekty jako Quinlan Terry Julian Bicknell
    a Fairfax a Sammons pro soukromé rezidence.
  - '8. července 2007 The Washington Post uveřejnil úryvky z knihy profesorky Amy Zegartové Špionážní slepota: CIA, FBI a
    počátky 11. září. List ze Zegartovy knihy uvedl, že vládní dokumenty ukazují, že CIA a FBI propásly 23 potenciálních šancí
    na narušení teroristických útoků z 11. září 2001. Mezi hlavní důvody neúspěchů patřily: kultura agentur odolná vůči změnám
    a novým myšlenkám, nevhodné pobídky k propagaci a nedostatečná spolupráce mezi FBI, CIA a zbytkem zpravodajského společenství
    Spojených států. Kniha vinila decentralizovanou strukturu FBI, která bránila efektivní komunikaci a spolupráci mezi různými
    úřady FBI. Kniha naznačovala, že FBI se nevyvinula v efektivní protiteroristickou nebo kontrašpionážní agenturu, z velké
    části kvůli hluboce zakořeněnému kulturnímu odporu agentur ke změnám. Například personální praxe FBI nadále přistupuje
    ke všem zaměstnancům kromě speciálních agentů jako k pomocnému personálu, což klasifikuje zpravodajské analytiky vedle
    automobilových mechaniků a údržbářů FBI.'
- source_sentence: Která entita v roce 2014 označila Notre Dame za 10. nejlepší ze všech amerických univerzit?
  sentences:
  - Kromě výše uvedeného má Řecko rovněž zahájit průzkum ropy a zemního plynu v dalších lokalitách v Jónském moři, jakož i
    v Libyjském moři, v řecké výlučné ekonomické zóně jižně od Kréty. Ministerstvo životního prostředí, energetiky a změny
    klimatu oznámilo, že o průzkum byl zájem z různých zemí (včetně Norska a Spojených států) a první výsledky týkající se
    množství ropy a plynu v těchto lokalitách se očekávají v létě 2012. V listopadu 2012 Deutsche Bank ve své zprávě odhadla
    hodnotu zásob zemního plynu jižně od Kréty na 427 miliard EUR.
  - Čas je historicky úzce spjat s vesmírem, oba dva se spojují do časoprostoru v Einsteinově speciální relativitě a obecné
    relativitě. Podle těchto teorií závisí pojem času na prostorovém referenčním rámci pozorovatele a lidské vnímání i měření
    přístroji, jako jsou hodiny, se u pozorovatelů v relativním pohybu liší. Pokud například kosmická loď s hodinami letí
    prostorem rychlostí (téměř) světla, její posádka si nevšimne změny rychlosti času na palubě svého plavidla, protože vše,
    co letí stejnou rychlostí, se stejnou rychlostí zpomaluje (včetně hodin, myšlenkových pochodů posádky a funkcí jejich
    těl). Nicméně stojícímu pozorovateli, který pozoruje vesmírnou loď letící kolem, se zdá, že kosmická loď je zploštělá
    ve směru, kterým letí, a hodiny na palubě kosmické lodi se pohybují velmi pomalu.
  - V letech 2015-2016 se Notre Dame umístil na 18. místě mezi "národními univerzitami" ve Spojených státech v žebříčku U.S.
    News & World Report's Best Colleges 2016. V roce 2014 zařadil deník USA Today Notre Dame celkově na 10. místo pro americké
    univerzity na základě údajů z College Factual. Nejlepší americké vysoké školy podle časopisu Forbes.com zařadily Notre
    Dame v roce 2015 na 13. místo mezi vysokými školami ve Spojených státech, na 8. místo mezi výzkumnými univerzitami a na
    1. místo na středozápadě. U.S. News & World Report také uvádí právnickou školu Notre Dame jako celkově 22. BusinessWeek
    řadí Mendozovu vysokou školu podnikání na 1. místo. Program MBA hodnotí celkově jako dvacátý. Filosofická Gourmet Report
    řadí postgraduální filozofický program Notre Dame na 15. místo v celostátním měřítku, zatímco časopis ARCHITECT zařadil
    vysokoškolský program architektury na 12. místo v celostátním měřítku. Program studia v zahraničí se navíc umístil na
    šestém místě v nejvyšším procentu účasti v zemi, přičemž 57,6% studentů se rozhodlo studovat v zahraničí v 17 zemích.
    Podle serveru payscale.com mají vysokoškolští absolventi Univerzity Notre Dame střední plat 110 000 dolarů, což z něj
    činí 24. nejvyšší mezi vysokými školami a univerzitami ve Spojených státech. Medián nástupního platu 55 300 dolarů se
    umístil na 58. místě stejné skupiny vrstevníků.
- source_sentence: Kde byl Napoleon korunován na císaře?
  sentences:
  - Navzdory plánům na expanzi do dalších globálních regionů a segmentů výrobků byla společnost Dell silně závislá na americkém
    trhu firemních PC, protože stolní počítače prodávané komerčním i firemním zákazníkům představovaly 32 procent jejích příjmů,
    85 procent příjmů pochází od podniků a podle výsledků za třetí čtvrtletí 2006 pochází šedesát čtyři procent jejích příjmů
    ze Severní a Jižní Ameriky. Dodávky stolních osobních počítačů v USA se zmenšovaly a trh s firemními osobními počítači,
    který kupuje osobní počítače v modernizačních cyklech, se z velké části rozhodl od nákupu nových systémů upustit. Poslední
    cyklus začal kolem roku 2002, tedy zhruba tři roky poté, co společnosti začaly kupovat PC před domnělými problémy s Y2K,
    a od firemních klientů se neočekávalo, že budou inovovat znovu až do rozsáhlého testování Windows Vista od Microsoftu
    (očekává se počátkem roku 2007), další cyklus upgradu se uskutečnil kolem roku 2008. V silné závislosti na osobních počítačích
    musel Dell snížit ceny, aby zvýšil objem prodeje, a zároveň od dodavatelů požadoval výrazné škrty.
  - 'V roce 1607, anglický vrchní soudce sir Edward Coke řekl v Případu prohibice (podle jeho vlastní zprávy) "že zákon byl
    zlatou metlou a měřítkem, které soudilo příčiny poddaných; a které chránilo Jeho Veličenstvo v bezpečí a míru: s čímž
    byl král velmi uražen, a řekl, že pak by měl být pod zákonem, což byla zrada, jak řekl; na což jsem řekl, že Bracton saith,
    quod Rex non debesse sub homine, sed sub Deo et lege (Že král neměl "Buďte pod každým člověkem, jen ne pod Bohem a zákonem."'
  - 'Napoleon byl korunován císařem Napoleonem I. 2. prosince 1804 v Notre Dame de Paris papežem Piem VII. Dne 1. dubna 1810
    se Napoleon nábožensky oženil s rakouskou princeznou Marií Louisou. Za vlády svého bratra ve Španělsku zrušil v roce 1813
    španělskou inkvizici. V soukromé diskusi s generálem Gourgaudem během jeho exilu na Svaté Heleně vyjádřil Napoleon materialistické
    názory na původ člověka[pozn. 9] a pochyboval o božství Ježíše, když uvedl, že je absurdní věřit, že Sokrates, Platón,
    muslimové a anglikáni by měli být zatraceni za to, že nejsou římští katolíci.[pozn. 10] V roce 1817 také Gourgaudovi řekl:
    "Nejvíce se mi líbí mohamedánské náboženství. Je v něm méně neuvěřitelných věcí než u nás." a že "mohamedánské náboženství
    je ze všech nejlepší." Nicméně, Napoleon byl pomazán knězem před svou smrtí.'
