    la información; gestionar el inventario; procesar pedidos de clientes; respetar los principios de protección de datos;
    trabajo en equipo; utilizar sistemas administrativos'
  - 'COMMUNITY MANAGER CON 01 AÑO DE EXPERIENCIA. Sector: Hotelería / Turismo. Ocupacion: community manager. Competencias:
