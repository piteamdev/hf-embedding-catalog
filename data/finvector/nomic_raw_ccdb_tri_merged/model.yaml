  - "I received a text alert about a suspected fraud charge from Citi about my Best Buy Visa card, showing a purchase from\
    \ XXXX XXXX XXXX XXXX in XXXXXXXX XXXX  on XX/XX/XXXX in the amount of {$230.00}. I immediately called Citi to report\
    \ that as a fraud charge as I do not shop at XXXX 's, nor do I live in XXXX. I live in XXXXXXXX XXXX. There were also\
    \ other Fraud charges I received email alerts about, though these were blocked and never posted thankfully. Screenshots\
    \ attached. \n\nI was told that the charge would be credited, and received a letter in my documents on the online account\
    \ confirming this. A week or so later, around XX/XX/XXXX, I check my account and see a Sales Adjustment crediting me the\
    \ total amount charged, {$230.00}. I assumed the matter was resolved. \n\nOn XX/XX/XXXX, I saw the charge was reinstated,\
    \ dated for XX/XX/XXXX for XXXX XXXX XXXX XXXX in PA, for the same amount, {$230.00}. I called Citi the following Monday\
    \ and asked why the charge was reinstated, to which they said they sided with the merchant. They said the merchant had\
    \ provided evidence that I had purchased a \" XXXX XXXX XXXX '' for the amount charged. I said that's literally impossible\
    \ because I do not live in PA, I do not own any XXXX XXXX items, and I live in XXXX and thus do not have any use for a\
    \ jacket. \n\nThe Citi rep and I went back and forth, I asked for the evidence they provided, he would not provide it.\
    \ He said that I need to provide proof that I did not purchase the jacket. I am not sure how you prove that I did not\
    \ purchase something, but I pointed to the fact that my card was used in the days before and after that single XXXX 's\
    \ purchase at merchants local to my home address. He said I would need to fax a copy of my ID to the fraud department,\
    \ which I did on XX/XX/XXXX. I have not heard back from them since and all attempts to get through their phone system\
    \ are fruitless. \n\nI tried calling the merchant myself, but when I called the XXXX XXXX XXXX XXXX, I was told that the\
    \ XXXX XXXX XXXX XXXX XXXXXXXX XXXX is the name that would appear if it were an online purchase. This is the first I am\
    \ learning that the purchase was online, and not in person like I had originally thought. \n\nI am not sure where to go\
    \ from here. Citi is unwilling to return my money or work with me on this, and I am met with dead-ends or impossible hoops\
    \ to jump through. I have no earthly way to prove I did not purchase something. I would think the burden of proof would\
    \ be on XXXXXXXX XXXX I do not shop there, I have no XXXX XXXX jackets. If they could maybe get the shipping address for\
    \ the order, they would see it wasn't me who placed the order, as no such item was ever delivered to my house in XXXX.\
    \ Wherever it was delivered, is likely the individual responsible."
- source_sentence: On XX/XX/year>. My wallet was stolen from XXXX XXXX on XXXX XXXX, CA. They spent XXXX on my my debit card
    somehow without my pin. Now I filed a dispute 3 times and the bank ( chime ) and they are claiming there was no error
    with the transactions. I clearly got scammed and they are basically saying there is nothing they can do and kick rocks.
    Their specialist claimed they throughly investigated but clearly they didnt do anything because I sent my police report
    just how they asked, and it didnt help. I needed that money and now Im left stuck
  sentences:
  - "On XX/XX/2026 @ XXXX & XXXX two fraudulent charges were made to my Chime bank account. \n\nThe amounts of {$270.00} and\
    \ {$44.00} were made at a local XXXX store. \n\nMy debit card was stolen earlier that day from my driveway so I immediately\
    \ called chime and they cancelled my card and assured me a new one. \n\nCreating a dispute to get my money back has been\
    \ a hassle as I have been denied 3 times by Chime and keep saying no error has occurred. \n\nThey sent me their findings\
    \ as to how they came to this conclusion. Which was essentially just transcripts of the previous phone calls I made to\
    \ report it. No actual evidence was provided in the report. \n\nThere is also false information saying that I didnt make\
    \ a police report when in fact I did, the same day of XX/XX/year>. \n\nToday I just got denied for the third time via\
    \ email and am now seeking assistance from your organization. \nXX/XX/year> P.s I am willing to provide more evidence"
  - Take time to review the materials ; the questions were submitted abruptly and might not be approved.
  - "I am submitting this complaint regarding a medical collection account that is incorrectly appearing on my credit report,\
    \ despite the CFPBs recent rule banning the inclusion of medical debt on credit reports used by lenders. \n\nOn XX/XX/year>\
    \ I reviewed my credit reports and found that a medical collection account from XXXX XXXX XXXX is still being reported\
    \ to EXPERIAN, EQUIFAX AND TRANSUNION. According to the CFPBs final rule effective in XXXX, medical debts should no longer\
    \ appear on consumer credit reports. \n\nI've requested removal, but they have either refused or failed to take appropriate\
    \ action. This incorrect reporting is negatively impacting my credit and financial opportunities."
