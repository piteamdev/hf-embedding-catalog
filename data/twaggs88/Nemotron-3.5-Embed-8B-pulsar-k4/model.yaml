  chat_template_jinja: "{# nemo-mistral-retrieval-v1\n   Derived from the Mistral Ministral-3 instruct chat template render_content\n\
    \   macro and its image-before-text canonicalization. Retrieval adaptation:\n   system content is the retrieval prefix;\
    \ generation wrappers and BOS/EOS are\n   deliberately omitted so message inference matches training token for token.\n\
    #}\n{%- macro mark_user_text(text) -%}\n{{- text | replace(\"[\", \"[‌\") | replace(\"<\", \"<‌\") -}}\n{%- endmacro -%}\n\
    {%- macro render_text_content(content, context_name) -%}\n{%- if content is string -%}\n    {{- content -}}\n{%- elif\
    \ content is sequence -%}\n    {%- set ns = namespace(has_output=false) -%}\n    {%- for block in content -%}\n      \
    \  {%- if block[\"type\"] == \"text\" -%}\n            {%- if ns.has_output %}{{ \"\\n\\n\" }}{% endif -%}\n         \
    \   {{- block[\"text\"] -}}\n            {%- set ns.has_output = true -%}\n        {%- else -%}\n            {{- raise_exception(context_name\
    \ + \" may contain only text blocks\") -}}\n        {%- endif -%}\n    {%- endfor -%}\n{%- else -%}\n    {{- raise_exception(context_name\
    \ + \" must be a string or a list of text blocks\") -}}\n{%- endif -%}\n{%- endmacro -%}\n{%- macro render_user_content(content)\
    \ -%}\n{%- if content is string -%}\n    {{- mark_user_text(content) -}}\n{%- elif content is sequence -%}\n    {%- set\
    \ ns = namespace(has_output=false) -%}\n    {%- for block in content -%}\n        {%- if block[\"type\"] in [\"image\"\
    , \"image_url\"] -%}\n            {%- if ns.has_output %}{{ \" \" }}{% endif -%}\n            {{- \"[IMG]\" -}}\n    \
    \        {%- set ns.has_output = true -%}\n        {%- endif -%}\n    {%- endfor -%}\n    {%- for block in content -%}\n\
    \        {%- if block[\"type\"] == \"text\" -%}\n            {%- if ns.has_output %}{{ \" \" }}{% endif -%}\n        \
    \    {{- mark_user_text(block[\"text\"]) -}}\n            {%- set ns.has_output = true -%}\n        {%- elif block[\"\
    type\"] not in [\"image\", \"image_url\"] -%}\n            {{- raise_exception(\"User content supports only text and image\
    \ blocks\") -}}\n        {%- endif -%}\n    {%- endfor -%}\n{%- else -%}\n    {{- raise_exception(\"User content must\
    \ be a string or a list of text and image blocks\") -}}\n{%- endif -%}\n{%- endmacro -%}\n{%- if not ((messages | length\
    \ == 1 and messages[0][\"role\"] == \"user\")\n    or (messages | length == 2\n        and messages[0][\"role\"] == \"\
    system\"\n        and messages[1][\"role\"] == \"user\")) -%}\n    {{- raise_exception(\"Retrieval inputs require one\
    \ user message with an optional leading system prefix\") -}}\n{%- endif -%}\n{# Iterate messages so vLLM can trace message.content\
    \ into the rendering macros. #}\n{%- for message in messages -%}\n    {%- if message[\"role\"] == \"system\" -%}\n   \
    \     {%- set prefix = render_text_content(message[\"content\"], \"System content\") -%}\n        {{- prefix.rstrip(\"\
    \ \") ~ \" \" -}}\n    {%- else -%}\n        {{- render_user_content(message[\"content\"]) -}}\n    {%- endif -%}\n{%-\
    \ endfor -%}"
