  widget:
  - source_sentence: Liên đoàn Bóng chuyền Việt Nam có những nhiệm vụ nào?
    sentences:
    - 'Điều 18. Tổ chức bộ máy kế toán

      1. Đơn vị kế toán phải bố trí người làm kế toán đảm bảo các quy định của Luật kế toán, số lượng người làm kế toán tùy
      theo quy mô hoạt động, yêu cầu quản lý, chức năng nhiệm vụ hoặc biên chế của đơn vị. Đơn vị kế toán có thể bố trí người
      làm kế toán kiêm nhiệm các công việc khác mà pháp luật về kế toán không nghiêm cấm.

      2. Việc tổ chức bộ máy kế toán tại các đơn vị kế toán do cơ quan có thẩm quyền thành lập đơn vị quyết định. Trường hợp
      tổ chức, đơn vị không có cơ quan có thẩm quyền thành lập thì do người đại diện theo pháp luật của đơn vị quyết định.

      Việc tổ chức bộ máy và công tác kế toán của các đơn vị cấp dưới không phải là đơn vị kế toán hoặc đơn vị trực thuộc
      không phải là đơn vị kế toán do người đại diện theo pháp luật của đơn vị kế toán quyết định. Các đơn vị trong lĩnh vực
      kế toán nhà nước không được bố trí kế toán trưởng, phụ trách kế toán ở các đơn vị không phải là đơn vị kế toán.

      Báo cáo tài chính của đơn vị kế toán phải bao gồm thông tin tài chính của các đơn vị cấp dưới và đơn vị trực thuộc.

      3. Cơ quan có nhiệm vụ thu, chi ngân sách nhà nước các cấp tổ chức bộ máy kế toán để kế toán thu, chi ngân sách nhà
      nước phù hợp với tổ chức bộ máy và chức năng nhiệm vụ được giao.

      4. Cơ quan nhà nước, tổ chức, đơn vị sự nghiệp sử dụng ngân sách nhà nước tổ chức công tác kế toán theo đơn vị dự toán
      ngân sách. Trường hợp đơn vị kế toán ở cấp tỉnh không có đơn vị dự toán trực thuộc vừa là đơn vị dự toán cấp trên vừa
      là đơn vị sử dụng ngân sách và đơn vị kế toán ở cấp huyện vừa là đơn vị dự toán cấp trên vừa là đơn vị sử dụng ngân
      sách thì được bố trí chung một bộ máy kế toán để thực hiện toàn bộ công tác kế toán của đơn vị.

      5. Người có trình độ chuyên môn nghiệp vụ về kế toán là người đã tốt nghiệp trung cấp chuyên nghiệp, cao đẳng, đại học,
      sau đại học chuyên ngành tài chính, kế toán, kiểm toán tại các trường trung cấp, cao đẳng, đại học hoặc các học viện
      ở trong và ngoài nước; người có chứng chỉ kiểm toán viên theo quy định của Luật kiểm toán độc lập; người có chứng chỉ
      kế toán viên theo quy định của Luật kế toán; người có chứng chỉ chuyên gia kế toán hoặc chứng chỉ kế toán do tổ chức
      nước ngoài hoặc tổ chức nghề nghiệp nước ngoài được Bộ Tài chính Việt Nam thừa nhận.

      6. Đối với người đã được cấp có thẩm quyền bổ nhiệm là kế toán trưởng của đơn vị kế toán trong lĩnh vực kế toán nhà
      nước và đã có thời gian thực tế làm kế toán trưởng trong các đơn vị này từ 10 năm trở lên tính đến ngày Nghị định này
      có hiệu lực thi hành thì vẫn được xem xét, bổ nhiệm làm kế toán trưởng của đơn vị kế toán trong lĩnh vực kế toán nhà
      nước nếu đủ các điều kiện khác theo quy định đối với kế toán trưởng mà không bắt buộc phải có bằng tốt nghiệp chuyên
      ngành tài chính, kế toán, kiểm toán như quy định tại khoản 5 Điều này.

      7. Đối với người không có bằng tốt nghiệp chuyên ngành tài chính, kế toán, kiểm toán nhưng đã được cấp có thẩm quyền
      bổ nhiệm vào ngạch kế toán viên, kế toán viên chính tại các đơn vị kế toán trong lĩnh vực kế toán nhà nước trước ngày
      01 tháng 01 năm 2014 thì vẫn tiếp tục được làm kế toán nhưng không được bổ nhiệm làm kế toán trưởng cho đến khi đảm
      bảo đủ các tiêu chuẩn, điều kiện của kế toán trưởng theo quy định đối với kế toán trưởng, trừ những người vẫn được làm
      kế toán trưởng quy định tại khoản 6 Điều này.'
    - 'Liên đoàn Bóng chuyền Việt Nam có những nhiệm vụ chủ yếu sau:

      1. Phối hợp với các cơ quan Nhà nước, các tổ chức kinh tế-xã hội để:

      a) Phát triển phong trào tập luyện bóng chuyền cho mọi đối tượng quần chúng, đặc biệt là thanh thiếu niên học sinh,
      sinh viên, lực lượng vũ trang, góp phần nâng cao sức khoẻ, rèn luyện phẩm chất ý chí, đáp ứng yêu cầu xây dựng xã hội
      ngày càng phát triển; tạo môi trường phát hiện và bồi dưỡng ban đầu tài năng bóng chuyền.

      b) Xây dựng và từng bước hoàn thiện hệ thống đào tạo tài năng bóng chuyền các lứa tuổi từ thiếu niên nhi đồng đến đội
      tuyển quốc gia.

      c) Xây dựng và tổ chức thực hiện chương trình đào tạo, bồi dưỡng cán bộ quản lý, huấn luyện viên, hướng dẫn viên, trọng
      tài và có kế hoạch sử dụng có hiệu quả đội ngũ cán bộ này.

      2. Xây dựng và triển khai kế hoạch hợp tác quốc tế về bóng chuyền sau khi được cơ quan quản lý nhà nước có thẩm quyền
      phê duyệt.

      3. Huy động các nguồn lực của xã hội để xây dựng cơ sở vật chất cho hoạt động bóng chuyền. Thu hút các nguồn tài trợ
      trong nước và ngoài nước theo đúng quy định của pháp luật để tạo nguồn kinh phí cho bóng chuyền và hoạt động của Liên
      đoàn.

      4. Bảo vệ quyền lợi chính đáng của các tổ chức thành viên và hội viên trong Liên đoàn.

      5. Kiến nghị và đề xuất cơ quan thể dục thể thao quốc gia và các cơ quan Nhà nước có liên quan về các vấn đề:

      a) Chủ trương, chính sách, kế hoạch, biện pháp nhằm phát triển nâng cao trình độ môn bóng chuyền nước ta.

      b) Tuyển chọn huấn luyện viên, vận động viên để thành lập đội dự tuyển và đội tuyển quốc gia; xây dựng kế hoạch tập
      huấn thi đấu cho đội. Tham gia chỉ đạo thực hiện và kiểm tra thực hiện kế hoạch.

      c) Xét và đề nghị các cơ quan nhà nước phong cấp, giáng cấp, khen thưởng và kỷ luật đối với huấn luyện viên, trọng tài,
      vận động viên bóng chuyền, các đội và cán bộ quản lý môn bóng chuyền.

      d) Xây dựng cơ sở vật chất tập luyện và thi đấu cũng như đầu tư trang thiết bị hiện đại đáp ứng nhu cầu tập luyện nâng
      cao thành tích và tổ chức thi đấu quốc gia, quốc tế.

      6. Tuyên truyền phổ biến và thực hiện các nguyên tắc cơ bản của Liên đoàn bóng chuyền thế giới, Châu Á và Đông Nam Á;
      chấp hành điều lệ và luật của FIVB đã ban hành. Nộp niên liễm cho FIVB và AVC.

      7. Tham gia tích cực các hoạt động do FIVB, ACV và SEAVF tổ chức như: Thi đấu, tập huấn, hội nghị, hội thảo...; mở rộng
      quan hệ với các nước trong khu vực Châu Á và thế giới theo đúng quy định của luật pháp.

      8. Tích cực mở rộng xã hội hóa môn bóng chuyền; huy động tốt các nguồn lực của xã hội để mở rộng và phát triển nâng
      cao môn bóng chuyền.'
    - 'Điều 4. Nguyên tắc áp dụng định mức kinh tế - kỹ thuật

      1. Căn cứ vào điều kiện cụ thể từng điều kiện lập địa, biện pháp kỹ thuật, cự ly di chuyển và loại rừng áp dụng hệ số
      điều chỉnh (K) để tính toán mức hao phí lao động cần thiết cho từng hạng mục công việc khi lập thiết kế, dự toán hoặc
      xây dựng kế hoạch, tổ chức thực hiện.

      2. Việc áp dụng định mức kinh tế - kỹ thuật tuân thủ yêu cầu được quy định trong các tiêu chuẩn, quy chuẩn, hướng dẫn
      kỹ thuật, quy trình thực hiện đã được cơ quan nhà nước có thẩm quyền ban hành.

      3. Các chương trình, dự án hỗ trợ phát triển chính thức (ODA), nghiên cứu khoa học, phát triển giống áp dụng theo dự
      toán được cấp có thẩm quyền phê duyệt.

      4. Các quy định về hệ số lương của từng vị trí các bước công việc trong Thông tư này là hệ số lương bình quân; hệ số
      lương cụ thể cho nhân công thực hiện các bước công việc được bố trí tùy thuộc vào tính chất của từng nhiệm vụ hoặc dự
      án và được hưởng theo hệ số lương bình quân của các bước công việc đó.


      Điều 5. Trình tự thực hiện một số biện pháp lâm sinh

      1. Trồng rừng: Xử lý thực bì; làm đất, cuốc hố; lấp hố, bón lót; trồng rừng; chăm sóc rừng, bón thúc; bảo vệ rừng; làm
      đường băng cản lửa theo quy mô rừng trồng tập trung, thảm thực bì và loại thực bì.

      2. Khoanh nuôi xúc tiến tái sinh tự nhiên có trồng bổ sung: Phát toàn diện cây dây leo và chặt dọn cây sâu bệnh; tỉa
      chồi; cuốc hố, lấp hố, bón lót; trồng bổ sung; chăm sóc rừng; bảo vệ rừng.

      3. Khoanh nuôi xúc tiến tái sinh tự nhiên:

      a) Bảo vệ, chống chặt phá cây tái sinh mục đích hiện có; phòng cháy, chữa cháy rừng;

      b) Phát dọn dây leo, cây bụi; chặt bỏ cây cong queo, sâu bệnh; cây phi mục đích; sửa chồi gốc và tỉa bớt chồi xấu.

      4. Nuôi dưỡng rừng tự nhiên: Phát dọn dây leo, cây bụi, cỏ dại xâm lấn; tỉa thưa cây cong queo, sâu bệnh, bị chèn ép,
      cụt ngọn; vệ sinh, chăm sóc rừng sau tỉa thưa; bảo vệ rừng.

      5. Nuôi dưỡng rừng trồng: Phát dọn dây leo, cây bụi, cỏ dại xâm lấn; tỉa thưa cây cong queo, sâu bệnh, bị chèn ép, cụt
      ngọn; vệ sinh, chăm sóc rừng sau tỉa thưa; tỉa cành; bón phân sau khi chặt tỉa thưa; bảo vệ rừng.

      6. Làm giàu rừng: Tạo băng trồng cây (băng chặt) đối với làm giàu rừng theo băng hoặc xử lý thực bì đối với làm giàu
      rừng theo đám; luỗng phát dây leo, cây bụi; chặt bỏ cây cong queo sâu bệnh, không làm vỡ tầng tán của băng chừa đối
      với làm giàu rừng theo băng; trồng bổ sung; chăm sóc rừng; bảo vệ rừng.

      7. Đối tượng và nội dung biện pháp kỹ thuật cụ thể thực hiện theo Thông tư số 29/2018/TT-BNNPTNT ngày 16/11/2018 của
      Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn quy định các biện pháp lâm sinh và Thông tư số 17/2022/TT-BNNPTNT ngày
      27 tháng 10 năm 2022 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn sửa đổi, bổ sung một số điều của Thông tư
      số 29/2018/TT-BNNPTNT ngày 16 tháng 11 năm 2018 của Bộ trưởng Bộ Nông nghiệp và Phát triển nông thôn quy định về các
      biện pháp lâm sinh.'
  - source_sentence: Điều kiện để thành lập một đơn vị sự nghiệp công lập trong lĩnh vực kế hoạch, đầu tư và thống kê là gì?
    sentences:
    - 'Điều 17. Thông báo hoạt động khuyến mại

      1. Thương nhân thực hiện thủ tục hành chính thông báo hoạt động khuyến mại đến tất cả các Sở Công Thương nơi tổ chức
      khuyến mại (tại địa bàn thực hiện khuyến mại) trước khi thực hiện chương trình khuyến mại theo hình thức quy định tại
      Điều 12 trừ các trường hợp quy định tại điểm b và điểm c khoản 2 Điều này. Hồ sơ thông báo phải được gửi đến Sở Công
      Thương tối thiểu trước 03 ngày làm việc trước khi thực hiện khuyến mại (căn cứ theo ngày nhận ghi trên vận đơn hoặc
      các hình thức có giá trị tương đương trong trường hợp gửi qua dịch vụ bưu chính hoặc căn cứ theo ngày ghi nhận trên
      hệ thống trong trường hợp nộp trực tuyến tại Cổng dịch vụ công quốc gia)..

      2. Các trường hợp không phải thực hiện thủ tục hành chính thông báo thực hiện khuyến mại:

      a) Thực hiện khuyến mại theo các hình thức quy định tại khoản 8 Điều 92 Luật Thương mại và các Điều 8, Điều 9, Điều
      10, Điều 11, Điều 14 Nghị định này;

      b) Thực hiện khuyến mại theo các hình thức quy định tại Điều 12 Nghị định này có tổng giá trị giải thưởng, quà tặng
      dưới 100 triệu đồng;

      c) Chỉ thực hiện chương trình khuyến mại theo hình thức khuyến mại quy định tại Điều 12 Nghị định này cho hàng hóa,
      dịch vụ được bán, cung ứng thông qua sàn giao dịch thương mại điện tử, ứng dụng sàn giao dịch thương mại điện tử, website
      khuyến mại trực tuyến và ứng dụng khuyến mại trực tuyến.

      3. Thương nhân được lựa chọn một trong các cách thức thông báo sau:

      a) Thông qua dịch vụ bưu chính công ích, qua thuê dịch vụ của doanh nghiệp, cá nhân hoặc qua ủy quyền theo quy định
      của pháp luật;

      b) Trực tuyến tại Cổng Dịch vụ công quốc gia.

      4. Hồ sơ thông báo bao gồm 01 Thông báo thực hiện khuyến mại theo Mẫu số 01 Phụ lục ban hành kèm theo Nghị định này.

      5. Nội dung thông báo thực hiện khuyến mại bao gồm:

      a) Tên thương nhân thực hiện khuyến mại;

      b) Tên chương trình khuyến mại;

      c) Địa bàn thực hiện khuyến mại (các tỉnh, thành phố nơi thương nhân thực hiện khuyến mại);

      d) Hình thức khuyến mại;

      đ) Hàng hóa, dịch vụ được khuyến mại;

      e) Hàng hóa, dịch vụ dùng để khuyến mại (giải thưởng, quà tặng);

      g) Thời gian thực hiện khuyến mại;

      h) Khách hàng của chương trình khuyến mại (đối tượng hưởng khuyến mại);

      i) Cơ cấu giải thưởng và tổng giá trị giải thưởng của chương trình khuyến mại;

      k) Nội dung chi tiết chương trình khuyến mại.

      l) Trường hợp nhiều thương nhân cùng phối hợp thực hiện chương trình khuyến mại thì phải nêu rõ tên của các thương nhân
      cùng thực hiện, nội dung tham gia cụ thể và trách nhiệm cụ thể của từng thương nhân tham gia thực hiện trong chương
      trình.

      6. Thông tin về chương trình khuyến mại mà thương nhân đã thông báo phải được cơ quan quản lý nhà nước công khai bằng
      các hình thức phù hợp (văn bản, trang tin điện tử hoặc các hình thức khác có tác dụng tương đương) và không sớm hơn
      thời gian bắt đầu của chương trình khuyến mại. Nội dung thông tin phải công khai bao gồm:

      a) Tên thương nhân thực hiện;

      b) Nội dung chi tiết chương trình;

      c) Thời gian thực hiện khuyến mại;

      d) Địa bàn thực hiện khuyến mại.'
    - 'Điều 17. Cấp Chứng chỉ hành nghề luật sư

      1. Người đạt yêu cầu kiểm tra kết quả tập sự hành nghề luật sư có hồ sơ đề nghị cấp Chứng chỉ hành nghề luật sư gửi
      Ban chủ nhiệm Đoàn luật sư.

      Hồ sơ gồm có:

      a) Đơn đề nghị cấp Chứng chỉ hành nghề luật sư theo mẫu do Bộ Tư pháp ban hành;

      b) Phiếu lý lịch tư pháp;

      c) Giấy chứng nhận sức khỏe;

      d) Bản sao Bằng cử nhân luật hoặc bản sao Bằng thạc sỹ luật;

      đ) Bản sao Giấy chứng nhận kiểm tra kết quả tập sự hành nghề luật sư.

      Trong thời hạn bảy ngày làm việc, kể từ ngày nhận đủ hồ sơ hợp lệ, Ban chủ nhiệm Đoàn luật sư chuyển hồ sơ cho Sở Tư
      pháp kèm theo bản xác nhận người đề nghị cấp Chứng chỉ hành nghề luật sư có đủ tiêu chuẩn luật sư theo quy định của
      Luật này.

      2. Người được miễn tập sự hành nghề luật sư có hồ sơ đề nghị cấp Chứng chỉ hành nghề luật sư gửi Sở Tư pháp nơi người
      đó thường trú.

      Hồ sơ gồm có:

      a) Các giấy tờ quy định tại các điểm a, b và c khoản 1 Điều này;

      b) Giấy tờ quy định tại điểm d khoản 1 Điều này, trừ những người là giáo sư, phó giáo sư chuyên ngành luật, tiến sỹ
      luật;

      c) Bản sao giấy tờ chứng minh là người được miễn tập sự hành nghề luật sư quy định tại khoản 1 Điều 16 của Luật này.

      3. Trong thời hạn bảy ngày làm việc, kể từ ngày nhận đủ hồ sơ hợp lệ, Sở Tư pháp có trách nhiệm kiểm tra hồ sơ, trong
      trường hợp cần thiết thì tiến hành xác minh tính hợp pháp của hồ sơ và có văn bản đề nghị kèm theo hồ sơ cấp Chứng chỉ
      hành nghề luật sư gửi Bộ Tư pháp.

      Trong thời hạn hai mươi ngày, kể từ ngày nhận đủ hồ sơ hợp lệ, Bộ trưởng Bộ Tư pháp quyết định cấp Chứng chỉ hành nghề
      luật sư; trong trường hợp từ chối phải thông báo bằng văn bản và nêu rõ lý do cho người đề nghị cấp Chứng chỉ hành nghề
      luật sư và Sở Tư pháp nơi gửi hồ sơ đề nghị cấp Chứng chỉ hành nghề luật sư.

      Người bị từ chối cấp Chứng chỉ hành nghề luật sư có quyền khiếu nại, khiếu kiện theo quy định của pháp luật.

      4. Người thuộc một trong những trường hợp sau đây thì không được cấp Chứng chỉ hành nghề luật sư:

      a) Không đủ tiêu chuẩn luật sư quy định tại Điều 10 của Luật này;

      b) Đang là cán bộ, công chức, viên chức; sĩ quan, quân nhân chuyên nghiệp, công nhân quốc phòng trong cơ quan, đơn vị
      thuộc Quân đội nhân dân; sĩ quan, hạ sĩ quan, công nhân trong cơ quan, đơn vị thuộc Công an nhân dân;

      c) Không thường trú tại Việt Nam;

      d) Đang bị truy cứu trách nhiệm hình sự; đã bị kết án mà chưa được xóa án tích về tội phạm do vô ý hoặc tội phạm ít
      nghiêm trọng do cố ý; đã bị kết án về tội phạm nghiêm trọng do cố ý, tội phạm rất nghiêm trọng do cố ý, tội phạm đặc
      biệt nghiêm trọng do cố ý kể cả trường hợp đã được xóa án tích;

      đ) Đang bị áp dụng biện pháp xử lý hành chính đưa vào cơ sở cai nghiện bắt buộc, cơ sở giáo dục bắt buộc;

      e) Mất năng lực hành vi dân sự hoặc bị hạn chế năng lực hành vi dân sự;

      g) Những người quy định tại điểm b khoản này bị buộc thôi việc mà chưa hết thời hạn ba năm, kể từ ngày quyết định buộc
      thôi việc có hiệu lực.'
    - 'Điều 3. Tiêu chí phân loại đơn vị sự nghiệp công lập theo chức năng, nhiệm vụ

      1. Đơn vị sự nghiệp công lập có chức năng phục vụ quản lý nhà nước:

      a) Đơn vị sự nghiệp công lập thực hiện chức năng nghiên cứu phục vụ xây dựng văn bản quy phạm pháp luật, hoàn thiện
      thể chế, quy hoạch, kế hoạch, chiến lược, chế độ, chính sách, tiêu chuẩn, quy chuẩn, định mức kinh tế-kỹ thuật thuộc
      ngành, lĩnh vực kế hoạch, đầu tư và thống kê;

      b) Đơn vị sự nghiệp công lập thực hiện nhiệm vụ xây dựng, quản lý, vận hành, khai thác, phát triển hệ thống thông tin
      phục vụ quản lý nhà nước về ngành, lĩnh vực kế hoạch, đầu tư và thống kê;

      c) Đơn vị sự nghiệp công lập thực hiện chức năng hỗ trợ, phục vụ thanh tra, kiểm tra, giám sát chất lượng dịch vụ chuyên
      ngành thuộc ngành, lĩnh vực kế hoạch, đầu tư và thống kê;

      d) Đơn vị sự nghiệp công lập thực hiện chức năng, nhiệm vụ khác phục vụ quản lý nhà nước về ngành, lĩnh vực kế hoạch,
      đầu tư và thống kê.

      2. Đơn vị sự nghiệp công lập cung cấp dịch vụ sự nghiệp công thuộc ngành, lĩnh vực kế hoạch, đầu tư và thống kê theo
      danh mục được cấp có thẩm quyền phê duyệt.

      3. Đơn vị sự nghiệp công lập vừa phục vụ quản lý nhà nước vừa cung cấp dịch vụ sự nghiệp công thuộc ngành, lĩnh vực
      kế hoạch, đầu tư và thống kê là đơn vị sự nghiệp công lập thực hiện một hoặc nhiều chức năng, nhiệm vụ quy định tại
      khoản 1 và một hoặc nhiều chức năng, nhiệm vụ quy định tại khoản 2 Điều này. Việc xác định loại hình đơn vị sự nghiệp
      công lập quy định tại Điều này do cấp có thẩm quyền thành lập quyết định.


      Điều 4. Tiêu chí phân loại đơn vị sự nghiệp công lập theo mức tự chủ về tài chính

      1. Đơn vị sự nghiệp công lập tự bảo đảm chi thường xuyên và chi đầu tư;

      2. Đơn vị sự nghiệp công lập tự bảo đảm chi thường xuyên;

      3. Đơn vị sự nghiệp công lập tự bảo đảm một phần chi thường xuyên, gồm:

      a) Đơn vị sự nghiệp công lập tự bảo đảm từ 70% đến dưới 100% chi thường xuyên;

      b) Đơn vị sự nghiệp công lập tự bảo đảm từ 30% đến dưới 70% chi thường xuyên;

      c) Đơn vị sự nghiệp công lập tự bảo đảm từ 10% đến dưới 30% chi thường xuyên.

      4. Đơn vị sự nghiệp công lập do Ngân sách Nhà nước bảo đảm chi thường xuyên. Việc xác định mức tự chủ về tài chính của
      đơn vị sự nghiệp công lập quy định tại Điều này thực hiện theo quy định của Chính phủ về cơ chế tự chủ tài chính của
      các đơn vị sự nghiệp công lập.


      Điều 5. Điều kiện thành lập đơn vị sự nghiệp công lập

      1. Việc thành lập đơn vị sự nghiệp công lập thuộc ngành, lĩnh vực kế hoạch, đầu tư và thống kê phải đáp ứng điều kiện
      theo quy định tại điểm a, c, d, đ khoản 1 Điều 5 Nghị định số 120/2020/NĐ-CP ngày 07 tháng 10 năm 2020 của Chính phủ
      quy định về thành lập, tổ chức lại, giải thể đơn vị sự nghiệp công lập (sau đây viết tắt là Nghị định số 120/2020/NĐ-CP).

      2. Ngoài các điều kiện chung quy định tại khoản 1 Điều này, việc thành lập các đơn vị sự nghiệp thuộc ngành, lĩnh vực
      kế hoạch, đầu tư và thống kê còn phải đáp ứng các điều kiện khác theo quy định của pháp luật có liên quan.


      Điều 6. Điều kiện sáp nhập, hợp nhất đơn vị sự nghiệp công lập

      1. Việc sáp nhập hoặc hợp nhất đơn vị sự nghiệp công lập thuộc ngành, lĩnh vực kế hoạch, đầu tư và thống kê được thực
      hiện khi đáp ứng điều kiện quy định tại điểm a, b, c khoản 2 Điều 5 Nghị định số 120/2020/NĐ-CP.

      2. Đơn vị sự nghiệp công lập hình thành sau khi sáp nhập, hợp nhất phải đáp ứng đủ các điều kiện thành lập quy định
      tại Điều 5 Thông tư này và quy định của pháp luật có liên quan.


      Điều 7. Điều kiện giải thể đơn vị sự nghiệp công lập

      1. Việc giải thể đơn vị sự nghiệp công lập thuộc ngành, lĩnh vực kế hoạch, đầu tư và thống kê được thực hiện khi có
      một trong các điều kiện quy định tại điểm a, b, c, d khoản 3 Điều 5 Nghị định số 120/2020/NĐ-CP.

      2. Đơn vị sự nghiệp công lập chỉ thực hiện giải thể sau khi hoàn thành nghĩa vụ về tài chính, tài sản, đất đai, các
      khoản vay, nợ phải trả, các nghĩa vụ khác theo quy định của pháp luật và được cơ quan, tổ chức có thẩm quyền xác nhận
      bằng văn bản.'
  - source_sentence: Ngoài những người được nêu trong Quyết định, có ai khác phải chịu trách nhiệm thực hiện Quyết định về
      điều chỉnh kế hoạch sử dụng đất huyện Võ Nhai không?
    sentences:
    - Điều 4. Chánh Văn phòng Ủy ban nhân dân tỉnh; Giám đốc Sở Tài nguyên và Môi trường; Chủ tịch Ủy ban nhân dân các huyện
      Mộc Châu, Vân Hồ; Thủ trưởng các đơn vị, tổ chức có liên quan chịu trách nhiệm thi hành Quyết định này
    - 'Điều 1. Phê duyệt quy hoạch sử dụng đất huyện Võ Nhai thời kỳ 2021- 2030 với các nội dung chủ yếu như sau:

      1. Nội dung phương án quy hoạch sử dụng đất thời kỳ 2021-2030

      a) Diện tích, cơ cấu các loại đất (Chi tiết tại biểu số 01 kèm theo).

      b) Diện tích chuyển mục đích sử dụng đất (Chi tiết tại biểu số 02 kèm theo).

      c) Diện tích đất chưa sử dụng đưa vào sử dụng cho các mục đích (Chi tiết tại biểu số 03 kèm theo).

      2. Vị trí, diện tích các khu vực chuyển mục đích sử dụng đất được xác định theo bản đồ quy hoạch sử dụng đất thời kỳ
      2021-2030 tỷ lệ 1/25.000, Báo cáo thuyết minh tổng hợp quy hoạch sử dụng đất huyện Võ Nhai thời kỳ 2021-2030.'
    - Điều 4. Chánh Văn phòng UBND tỉnh, Giám đốc các sở; Thủ trưởng các ban, ngành của tỉnh; Chủ tịch UBND các huyện, thành
      phố và người sử dụng đất chịu trách nhiệm thi hành Quyết định này
    - Điều 3. Chánh Văn phòng Ủy ban nhân dân tỉnh, Giám đốc Sở Tài nguyên và Môi trường, Chủ tịch Ủy ban nhân dân huyện Võ
      Nhai và các tổ chức, cá nhân liên quan chịu trách nhiệm thi hành Quyết định này
  - source_sentence: Quan trắc tài nguyên môi trường được chia làm bao nhiêu phân hạng chức danh nghề nghiệp hiện nay?
    sentences:
    - '1. Nhiệm vụ:

      a) Thực hiện quan trắc, tính toán, chỉnh biên số liệu, lập báo biểu và phát báo theo quy định;

      b) Lấy mẫu quan trắc, bảo quản mẫu theo đúng quy chuẩn kỹ thuật;

      c) Lập các báo cáo quan trắc, bàn giao mẫu và ghi các biên bản bàn giao mẫu, theo đúng hướng dẫn, quy chuẩn kỹ thuật
      trong quan trắc;

      d) Sử dụng, bảo quản trang thiết bị theo đúng hướng dẫn sử dụng;

      đ) Thực hiện an toàn lao động theo quy định.

      2. Tiêu chuẩn về trình độ đào tạo, bồi dưỡng:

      a) Tốt nghiệp trung cấp trở lên thuộc các chuyên ngành khí tượng, thủy văn, hải văn, hải dương, môi trường, tài nguyên
      nước, biến đổi khí hậu hoặc chuyên ngành khác có liên quan; nếu tốt nghiệp chuyên ngành khác phải hoàn thành chương
      trình bồi dưỡng kiến thức, kỹ năng nghề nghiệp chuyên ngành do cơ quan quản lý viên chức chuyên ngành quan trắc tài
      nguyên môi trường quy định;

      b) Có trình độ ngoại ngữ bậc 1 theo quy định tại Thông tư số 01/2014/TT-BGDĐT;

      c) Có trình độ tin học đạt chuẩn kỹ năng sử dụng công nghệ thông tin cơ bản theo quy định tại Thông tư số 03/2014/TT-BTTTT.

      3. Tiêu chuẩn về năng lực chuyên môn, nghiệp vụ:

      a) Có kiến thức đại cương về chuyên môn được phân công quan trắc;

      b) Có kỹ năng thành thạo của ít nhất một công tác quan trắc trong các công tác quan trắc: khí tượng, thủy văn, hải văn,
      tài nguyên nước, môi trường;

      c) Nắm vững quy chuẩn kỹ thuật quan trắc tài nguyên môi trường;

      d) Sử dụng thành thạo máy móc, thiết bị, phương tiện trong công tác chuyên môn.'
    - 'Mã số và phân hạng chức danh nghề nghiệp viên chức chuyên ngành quan trắc tài nguyên môi trường

      1. Quan trắc viên tài nguyên môi trường hạng II Mã số: V.06.05.13

      2. Quan trắc viên tài nguyên môi trường hạng III Mã số: V.06.05.14

      3. Quan trắc viên tài nguyên môi trường hạng IV Mã số: V.06.05.15'
    - 'Bổ nhiệm vào chức danh nghề nghiệp

      Trường hợp viên chức đã được chuyển xếp ngạch và xếp lương hoặc bổ nhiệm vào các ngạch quan trắc tài nguyên môi trường
      theo quy định tại Quyết định số 07/2008/QĐ-BTNMT ngày 06 tháng 10 năm 2008 của Bộ trưởng Bộ Tài nguyên và Môi trường
      ban hành tiêu chuẩn nghiệp vụ các ngạch viên chức ngành tài nguyên và môi trường (sau đây viết tắt là Quyết định số
      07/2008/QĐ-BTNMT) và Thông tư liên tịch số 30/2010/TTLT-BTNMT-BNV ngày 25 tháng 11 năm 2010 của Bộ Tài nguyên và Môi
      trường - Bộ Nội vụ hướng dẫn chuyển xếp ngạch và xếp lương viên chức ngành tài nguyên và môi trường (sau đây viết tắt
      là Thông tư liên tịch số 30/2010/TTLT-BTNMT-BNV) được bổ nhiệm vào chức danh nghề nghiệp, như sau:

      1. Bổ nhiệm chức danh nghề nghiệp quan trắc viên tài nguyên môi trường hạng II (mã số V.06.05.13) đối với viên chức
      đang giữ ngạch quan trắc viên chính tài nguyên môi trường (mã số ngạch 14.256).

      2. Bổ nhiệm chức danh nghề nghiệp quan trắc viên tài nguyên môi trường hạng III (mã số V.06.05.14) đối với viên chức
      đang giữ ngạch quan trắc viên tài nguyên môi trường (mã số ngạch 14.257).

      3. Bổ nhiệm chức danh nghề nghiệp quan trắc viên tài nguyên môi trường hạng IV (mã số V.06.05.15) đối với viên chức
      đang giữ các ngạch quan trắc viên cao đẳng tài nguyên môi trường (mã số ngạch 14.258) và quan trắc viên trung cấp tài
      nguyên môi trường (mã số ngạch 14.259).'
    - 'Nguyên tắc bổ nhiệm và xếp lương theo chức danh nghề nghiệp

      1. Việc bổ nhiệm vào chức danh nghề nghiệp và xếp lương đối với viên chức chuyên ngành quan trắc tài nguyên môi trường
      phải căn cứ vào vị trí việc làm; tiêu chuẩn về trình độ đào tạo, bồi dưỡng; năng lực chuyên môn, nghiệp vụ và nhiệm
      vụ viên chức đang đảm nhận.

      2. Viên chức được bổ nhiệm vào chức danh nghề nghiệp và xếp lương phải bảo đảm đủ tiêu chuẩn chức danh nghề nghiệp viên
      chức chuyên ngành quan trắc tài nguyên môi trường theo quy định tại Chương I và Chương II của Thông tư liên tịch này.

      3. Khi bổ nhiệm từ ngạch viên chức hiện giữ vào chức danh nghề nghiệp viên chức chuyên ngành quan trắc tài nguyên môi
      trường tương ứng không được kết hợp nâng bậc lương và thăng hạng chức danh nghề nghiệp viên chức.'
  - source_sentence: Chồng tôi đã làm việc tại một công ty trong nhiều năm, nhưng gần đây vì lý do kinh tế, công ty có thể
      phải cho nhiều nhân viên thôi việc. Trong trường hợp này, họ có nghĩa vụ phải trả trợ cấp mất việc làm cho chồng tôi
      không?
    sentences:
    - 'Điều 35. Các hành vi nghiêm cấm trong quản lý, sử dụng nhà chung cư

      1. Sử dụng kinh phí quản lý vận hành, kinh phí bảo trì phần sở hữu chung không đúng quy định của Luật Nhà ở, Nghị định
      này và Quy chế quản lý, sử dụng nhà chung cư do Bộ Xây dựng ban hành.

      2. Gây thấm, dột; gây tiếng ồn quá mức quy định của pháp luật hoặc xả rác thải, nước thải, khí thải, chất độc hại không
      đúng quy định của pháp luật về bảo vệ môi trường hoặc không đúng nội quy quản lý, sử dụng nhà chung cư.

      3. Chăn, thả gia súc, gia cầm trong khu vực nhà chung cư.

      4. Sơn, trang trí mặt ngoài căn hộ, nhà chung cư không đúng quy định về thiết kế, kiến trúc.

      5. Tự ý chuyển đổi công năng, mục đích sử dụng phần sở hữu chung, sử dụng chung của nhà chung cư; tự ý chuyển đổi công
      năng, mục đích sử dụng phần diện tích không phải để ở trong nhà chung cư có mục đích hỗn hợp so với thiết kế đã được
      phê duyệt hoặc đã được cơ quan có thẩm quyền chấp thuận.

      6. Cấm kinh doanh các ngành nghề, hàng hóa sau đây trong phần diện tích dùng để kinh doanh của nhà chung cư:

      a) Vật liệu gây cháy nổ và các ngành nghề gây nguy hiểm đến tính mạng, tài sản của người sử dụng nhà chung cư theo quy
      định của pháp luật phòng cháy, chữa cháy;

      b) Kinh doanh vũ trường; sửa chữa xe có động cơ; giết mổ gia súc; các hoạt động kinh doanh dịch vụ gây ô nhiễm khác
      theo quy định của pháp luật về bảo vệ môi trường.

      Trường hợp kinh doanh dịch vụ nhà hàng, karaoke, quán bar thì phải bảo đảm cách âm, tuân thủ yêu cầu về phòng, chống
      cháy nổ, có nơi thoát hiểm và chấp hành các điều kiện kinh doanh khác theo quy định của pháp luật.

      7. Thực hiện các hành vi nghiêm cấm khác liên quan đến quản lý, sử dụng nhà chung cư quy định tại Điều 6 của Luật Nhà
      ở.'
    - '...

      5. Thu nhập từ hoạt động dạy nghề dành riêng cho người dân tộc thiểu số, người khuyết tật, trẻ em có hoàn cảnh đặc biệt
      khó khăn, đối tượng tệ nạn xã hội, người đang cai nghiện, người sau cai nghiện, người nhiễm HIV/AIDS. Trường hợp cơ
      sở dạy nghề có cả đối tượng khác thì phần thu nhập được miễn thuế được xác định tương ứng với tỷ lệ học viên là người
      dân tộc thiểu số, người khuyết tật, trẻ em có hoàn cảnh đặc biệt khó khăn, đối tượng tệ nạn xã hội, người đang cai nghiện,
      người sau cai nghiện, người nhiễm HIV/AIDS trong tổng số học viên.

      Thu nhập từ hoạt động dạy nghề được miễn thuế tại Khoản này phải đáp ứng đủ các điều kiện sau:

      - Cơ sở dạy nghề được thành lập và hoạt động theo quy định của các văn bản hướng dẫn về dạy nghề.

      - Có danh sách các học viên là người dân tộc thiểu số, người khuyết tật, trẻ em có hoàn cảnh đặc biệt khó khăn, đối
      tượng tệ nạn xã hội, người đang cai nghiện, người sau cai nghiện, người nhiễm HIV/AIDS.

      6. Thu nhập được chia từ hoạt động góp vốn, mua cổ phần, liên doanh, liên kết kinh tế với doanh nghiệp trong nước, sau
      khi bên nhận góp vốn, phát hành cổ phiếu, liên doanh, liên kết đã nộp thuế thu nhập doanh nghiệp theo quy định của Luật
      Thuế thu nhập doanh nghiệp, kể cả trường hợp bên nhận góp vốn, phát hành cổ phiếu, bên liên doanh, liên kết được hưởng
      ưu đãi thuế thu nhập doanh nghiệp.

      7. Khoản tài trợ nhận được để sử dụng cho hoạt động giáo dục, nghiên cứu khoa học, văn hóa, nghệ thuật, từ thiện, nhân
      đạo và hoạt động xã hội khác tại Việt Nam.

      Trường hợp tổ chức nhận tài trợ sử dụng không đúng mục đích các khoản tài trợ trên thì tổ chức nhận tài trợ phải tính
      nộp thuế thu nhập doanh nghiệp tính trên phần sử dụng sai mục đích trong kỳ tính thuế phát sinh việc sử dụng sai mục
      đích.

      Tổ chức nhận tài trợ quy định tại Khoản này phải được thành lập và hoạt động theo quy định của pháp luật, thực hiện
      đúng quy định của pháp luật về kế toán thống kê.

      ...'
    - 'Điều 42. Nghĩa vụ của người sử dụng lao động trong trường hợp thay đổi cơ cấu, công nghệ hoặc vì lý do kinh tế 1. Những
      trường hợp sau đây được coi là thay đổi cơ cấu, công nghệ: a) Thay đổi cơ cấu tổ chức, tổ chức lại lao động; b) Thay
      đổi quy trình, công nghệ, máy móc, thiết bị sản xuất, kinh doanh gắn với ngành, nghề sản xuất, kinh doanh của người
      sử dụng lao động; c) Thay đổi sản phẩm hoặc cơ cấu sản phẩm. 2. Những trường hợp sau đây được coi là vì lý do kinh tế:
      a) Khủng hoảng hoặc suy thoái kinh tế; b) Thực hiện chính sách, pháp luật của Nhà nước khi cơ cấu lại nền kinh tế hoặc
      thực hiện cam kết quốc tế. 3. Trường hợp thay đổi cơ cấu, công nghệ mà ảnh hưởng đến việc làm của nhiều người lao động
      thì người sử dụng lao động phải xây dựng và thực hiện phương án sử dụng lao động theo quy định tại Điều 44 của Bộ luật
      này; trường hợp có chỗ làm việc mới thì ưu tiên đào tạo lại người lao động để tiếp tục sử dụng. 4. Trong trường hợp
      vì lý do kinh tế mà nhiều người lao động có nguy cơ mất việc làm, phải thôi việc thì người sử dụng lao động phải xây
      dựng và thực hiện phương án sử dụng lao động theo quy định tại Điều 44 của Bộ luật này. 5. Trong trường hợp người sử
      dụng lao động không thể giải quyết được việc làm mà phải cho người lao động thôi việc thì phải trả trợ cấp mất việc
      làm theo quy định tại Điều 47 của Bộ luật này. 6. Việc cho thôi việc đối với người lao động theo quy định tại Điều này
      chỉ được tiến hành sau khi đã trao đổi ý kiến với tổ chức đại diện người lao động tại cơ sở đối với nơi có tổ chức đại
      diện người lao động tại cơ sở mà người lao động là thành viên và thông báo trước 30 ngày cho Ủy ban nhân dân cấp tỉnh
      và cho người lao động.'
