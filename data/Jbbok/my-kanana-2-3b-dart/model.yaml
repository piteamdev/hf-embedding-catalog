    sentences:
    - 'CJ제일제당(주) | 사업보고서 | 2025-12-31


      <미시적/거시적 요인에 따른 분석>


      식품 사업 부문은 주요 곡물 가격이 전년에 이어 하향 안정화되었으나, 국내외 대외 정세 불확실성으로 인해 변동성이 확대되었습니다. 또한, 인플레이션과 경기 불안으로 소비 심리가 위축되며 국내 식품 매출이 전년
      대비 부진했고, 이에 따라 국내 식품 이익이 감소했습니다.

      해외식품 매출의 80% 이상을 차지하는 미국의 경우 피자 등 일부 카테고리에서 가격 경쟁 강도는 심화되었으나, 당사의 브랜드 파워와 뛰어난 제품 경쟁력을 기반으로 지속적으로 시장점유율 1위를 기록하고 있습니다.
      미국의 메인스트림 그로서리 채널에서 비비고 만두와 Red Baron 피자는 1위 지위를 공고히 하며 그 위치를 수성하고 있습니다. 유럽에서는 메인스트림 채널 신규 입점 및 제품 확대, 신규 국가 진출에 힘입어
      전년 대비 매출의 20% 이상 성장하는 등 글로벌 영토 확장세가 지속되고 있습니다.'
    - '네이버(주) | 사업보고서 | 2025-12-31


