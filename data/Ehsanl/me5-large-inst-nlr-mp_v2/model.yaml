widgetData:
- source_sentence: 'Instruct: Given a Dutch legal query, retrieve relevant articles that help answer the query.

    Query: Biedt de Reparatiewet een rechtsgeldige basis voor heffingen die hebben plaatsgevonden in de periode tussen de
    datum van terugwerkende kracht en de datum van inwerkingtreding van de wet?'
  sentences:
  - Bij of krachtens algemene maatregel van bestuur kunnen inzake de belastingen, bedoeld in detweedeenderde paragraaf van
    dit hoofdstuk, nadere regels worden gegeven.
  - Voor het verrichten van handelingen ten behoeve van de aanvraag van een Nederlandse identiteitskaart als bedoeld in artikel
    2, tweede lid, van de Paspoortwet door de burgemeester van een gemeente, kunnen rechten worden geheven. Deze rechten worden
    aangemerkt als gemeentelijke belastingen. Hoofdstuk XV, paragraaf 1 en 4, van de Gemeentewet, is van toepassing. De artikelen
    229b en 229c van de Gemeentewet zijn van overeenkomstige toepassing.
  - '1. In verordeningen op grond waarvan rechten als bedoeld inartikel 229, eerste lid, onder a en b, worden geheven, worden
    de tarieven zodanig vastgesteld dat de geraamde baten van de rechten niet uitgaan boven de geraamde lasten ter zake.

    2. Onder de in het eerste lid bedoelde lasten worden mede verstaan: a. bijdragen aan bestemmingsreserves en voorzieningen
    voor noodzakelijke vervanging van de betrokken activa; b. de omzetbelasting die ingevolge de Wet op het BTW-compensatiefonds
    recht geeft op een bijdrage uit het fonds.'
  - De raad besluit tot het invoeren, wijzigen of afschaffen van een gemeentelijke belasting door het vaststellen van een
    belastingverordening.
  - Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling behoeven, kan
    deze geschieden bij algemene maatregel van bestuur.
  - Deartikelen 11 tot en met 14zijn van overeenkomstige toepassing op prijsvragen als bedoeld inartikel 68, eerste lid, onderdeel
    b.
  - Indien uit de ter beschikking gekomen gegevens blijkt dat de verstrekking van de gegevens of een raming, niet in overeenstemming
    is met de werkelijkheid, kan een opgelegde heffing aan de hand van deze gegevens worden herzien en opnieuw worden opgelegd.
  - Indien uit de ter beschikking gekomen gegevens blijkt dat de verstrekking van de gegevens of een raming, niet in overeenstemming
    met de werkelijkheid, kan een opgelegde heffing aan de hand van deze gegevens worden herzien en opnieuw worden opgelegd.
  - 'In deze paragraaf wordt verstaan onder heffing op andere wijze: heffing op andere wijze dan bij wege van aanslag of bij
    wege van voldoening op aangifte.'
- source_sentence: 'Instruct: Given a Dutch legal query, retrieve relevant articles that help answer the query.

    Query: Is pensioenverevening in strijd met het recht op eigendom onder het EVRM?'
  sentences:
  - Iedere natuurlijke of rechtspersoon heeft recht op het ongestoord genot van zijn eigendom. Aan niemand zal zijn eigendom
    worden ontnomen behalve in het algemeen belang en onder de voorwaarden voorzien in de wet en in de algemene beginselen
    van internationaal recht. De voorgaande bepalingen tasten echter op geen enkele wijze het recht aan, dat een Staat heeft
    om die wetten toe te passen, die hij noodzakelijk oordeelt om het gebruik van eigendom te reguleren in overeenstemming
    met het algemeen belang of om de betaling van belastingen of andere heffingen of boeten te verzekeren.
  - De bepalingen van artikel 12 van deze Overeenkomst zijn niet van toepassing op produkten waarvoor een minimumprijs van
    kracht is.
  - '1. Hij aan wie een zelfstandig en overdraagbaar recht toekomt, kan binnen de grenzen van dat recht de in de wet genoemde
    beperkte rechten vestigen. Hij kan ook zijn recht onder voorbehoud van een zodanig beperkt recht overdragen, mits hij
    de voorschriften zowel voor overdracht van een zodanig goed, als voor vestiging van een zodanig beperkt recht in acht
    neemt.

    2. Beperkte rechten gaan teniet door: a. het tenietgaan van het recht waaruit het beperkte recht is afgeleid; b. verloop
    van de tijd waarvoor, of de vervulling van de ontbindende voorwaarde waaronder het beperkte recht is gevestigd; c. afstand;
    d. opzegging, indien de bevoegdheid daartoe bij de wet of bij de vestiging van het recht aan de hoofdgerechtigde, aan
    de beperkt gerechtigde of aan beiden is toegekend; e. vermenging; en voorts op de overige in de wet voor iedere soort
    aangegeven wijzen van tenietgaan.

    3. Afstand en vermenging werken niet ten nadele van hen die op het tenietgaande beperkte recht op hun beurt een beperkt
    recht hebben. Vermenging werkt evenmin ten voordele van hen die op het bezwaarde goed een beperkt recht hebben en het
    tenietgaande recht moesten eerbiedigen.'
  - Ouderdomspensioen wordt gefinancierd op basis van kapitaaldekking.
  - Hij die een aan niemand toebehorende roerende zaak in bezit neemt, verkrijgt daarvan de eigendom.
  - Hij die een aan niemand toebehorende roerende zaak in bezit neemt, verkrijgt daarvan de eigendom.
  - De bepalingen van artikel 12 van deze Overeenkomst zijn niet van toepassing op produkten waarvoor een minimumprijs van
    kracht is.
  - In bijzondere gevallen kunnen Wij, de Raad van State gehoord, een door of als gevolg van de toepassing vanartikel 29vervallen
    uitzicht of recht op pensioen geheel of gedeeltelijk herstellen.
  - '[Wijzigt de Wet verevening pensioenrechten bij scheiding.]'
- source_sentence: 'Instruct: Given a Dutch legal query, retrieve relevant articles that help answer the query.

    Query: vrijspraak hennepteelt gebrek aan bewijs betrokkenheid'
  sentences:
  - '1. Ten aanzien van de ambtenaar, bedoeld inartikel 10, eerste lid, die op het tijdstip van ingang van zijn ontslag de
    leeftijd van 55 jaar heeft bereikt, wordt in artikel 5, vierde lid, en artikel 9, vijfde lid, van het Rijkswachtgeldbesluit
    in plaats van "60 jaar" gelezen: 55 jaar.

    2. Ten aanzien van de ambtenaar, bedoeld inartikel 10, tweede lid, die op het tijdstip van ingang van beëindiging van
    zijn arbeidsovereenkomst de leeftijd van 55 jaar heeft bereikt, wordt in artikel 6, eerste lid, en artikel 17, vijfde
    lid, van de Uitkeringsregeling in plaats van "60 jaar" gelezen: 55 jaar.'
  - Iedere opsporingsambtenaar is bevoegd de identiteit van de verdachte vast te stellen op de wijze, bedoeld inartikel 27a,
    eerste lid, eerste volzin, en hem daartoe staande te houden.
  - Een aangewezen teler treft alle maatregelen die redelijkerwijs noodzakelijk zijn voor een adequate opslag en voor de beveiliging
    van de hennep of hasjiesj en van het afval daarvan.
  - Niet strafbaar is hij die een feit begaat, dat hem wegens de psychische stoornis, psychogeriatrische aandoening of verstandelijke
    handicap niet kan worden toegerekend.
  - 'Onze Minister draagt ervoor zorg dat: a. in Nederland voldoende hennep wordt geteeld voor wetenschappelijk onderzoek
    naar de geneeskundige toepassing van hennep, hasjiesj en hennepolie of voor de productie van geneesmiddelen; b. de geteelde
    hennep, bedoeld onder a, wordt gebruikt voor een onder a genoemd doel.'
  - '1. Acht de rechtbank niet bewezen dat de verdachte het hem telastegelegde feit heeft begaan, dan spreekt zij hem vrij.

    2. Acht de rechtbank het feit bewezen, doch dit niet te zijn een strafbaar feit of den verdachte deswege niet strafbaar,
    dan ontslaat zij hem van alle rechtsvervolging te dier zake. In het geval, bedoeld in artikel 39 van het Wetboek van Strafrecht,
    kan zij tevens een maatregel opleggen als voorzien in artikel 37, 37a, 37b of 77s van het Wetboek van Strafrecht, indien
    de wettelijke voorwaarden daarvoor zijn vervuld.'
  - Niet strafbaar is hij die een feit begaat, dat hem wegens de psychische stoornis, psychogeriatrische aandoening of verstandelijke
    handicap niet kan worden toegerekend.
  - De tijd die door de tot gevangenisstraf of hechtenis veroordeelde in het buitenland in detentie is doorgebracht ingevolge
    een Nederlands verzoek om uitlevering ten behoeve van de tenuitvoerlegging of verdere tenuitvoerlegging van deze straf,
    komt daarop in mindering.
  - 'Onze Minister draagt ervoor zorg dat: a. in Nederland voldoende hennep wordt geteeld voor wetenschappelijk onderzoek
    naar de geneeskundige toepassing van hennep, hasjiesj en hennepolie of voor de productie van geneesmiddelen; b. de geteelde
    hennep, bedoeld onder a, wordt gebruikt voor een onder a genoemd doel.'
- source_sentence: 'Instruct: Given a Dutch legal query, retrieve relevant articles that help answer the query.

    Query: Is er in dit scenario voldaan aan de wettelijke vereisten voor bekendmaking van een besluit conform de Algemene
    wet bestuursrecht?'
  sentences:
  - '1. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot een subsidie van het
    Rijk aan de gemeenten in verband met de inkoop door de gemeenten van diensten in het kader van arbeidsbemiddeling ten
    behoeve van de werknemers.

    2. Bij ministeriële regeling kunnen, met het oog op een goede verdeling van de beschikbare dienstbetrekkingen of arbeidsovereenkomsten,
    bedoeld inhoofdstuk 3, over de ingezetenen die tot de doelgroep behoren, nadere regels worden gesteld met betrekking tot
    de volgorde van aanbieding van een dienstbetrekking of een arbeidsovereenkomst.'
  - Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt geplaatst.
  - Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt geplaatst.
  - '1. Een wijziging van een of meer onderdelen van de richtlijnen, genoemd inartikel 2, onderdeel a, en een wijziging van
    een of meer onderdelen van de richtlijnen, bedoeld inartikel 2, onderdeel b, treedt voor de toepassing van dat artikelonderdeel,
    waarin wordt verwezen naar de richtlijn die is of de richtlijnen die zijn gewijzigd, in werking met ingang van de dag
    waarop aan de betrokken wijzigingsrichtlijn uiterlijk uitvoering moet zijn gegeven.

    2. Onze Minister doet mededeling in de Staatscourant van een wijziging als bedoeld in het eerste lid.'
  - Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt geplaatst.
  - Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt geplaatst.
  - 'Dehoofdstukken 2 tot en met 8en10van deze wet zijn niet van toepassing op: a. de opsporing en vervolging van strafbare
    feiten, alsmede de tenuitvoerlegging van strafrechtelijke beslissingen; b. de tenuitvoerlegging van vrijheidsbenemende
    maatregelen op grond van de Vreemdelingenwet 2000; c. de tenuitvoerlegging van andere vrijheidsbenemende maatregelen in
    een inrichting die in hoofdzaak bestemd is voor de tenuitvoerlegging van strafrechtelijke beslissingen; d. besluiten en
    handelingen ter uitvoering van de Wet militair tuchtrecht; e. besluiten en handelingen ter uitvoering van de Wet toetsing
    levensbeëindiging op verzoek en hulp bij zelfdoding.'
  - Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt geplaatst.
  - '1. De bekendmaking van besluiten die tot een of meer belanghebbenden zijn gericht, geschiedt door toezending of uitreiking
    aan hen, onder wie begrepen de aanvrager.

    2. Indien de bekendmaking van het besluit niet kan geschieden op de wijze als voorzien in het eerste lid, geschiedt zij
    op een andere geschikte wijze.'
- source_sentence: 'Instruct: Given a Dutch legal query, retrieve relevant articles that help answer the query.

    Query: Deze uitspraak is gerectificeerd door de rectificatieuitspraak De tekst van deze uitspraak is niet meer geldig.
    Zie voor de gerectificeerde uitspraak.'
  sentences:
  - Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt geplaatst.
  - '1. Het bezwaar of beroep heeft van rechtswege mede betrekking op een besluit tot intrekking, wijziging of vervanging
    van het bestreden besluit, tenzij partijen daarbij onvoldoende belang hebben.

    2. Het eerste lid geldt ook indien het bezwaar is gemaakt of het beroep is ingesteld nadat het bestuursorgaan het bestreden
    besluit heeft ingetrokken, gewijzigd of vervangen.

    3. Het bestuursorgaan doet onverwijld mededeling van het nieuwe besluit aan het orgaan waarbij het beroep aanhangig is.

    4. Indien een ander orgaan een bezwaar- of beroepschrift tegen het nieuwe besluit ontvangt, zendt het dit met toepassing
    vanartikel 6:15, eerste en tweede lid, door.

    5. De bestuursrechter kan het beroep tegen het nieuwe besluit echter verwijzen naar een ander orgaan, indien behandeling
    door dit orgaan gewenst is.

    6. Intrekking of vervanging van het bestreden besluit staat niet in de weg aan vernietiging van dat besluit indien de
    indiener van het bezwaar- of beroepschrift daarbij belang heeft.'
  - 'Een rechtspersoon met een overheidstaak kan het Bureau om een advies vragen over een natuurlijke persoon of rechtspersoon
    met wie een vastgoedtransactie wordt of is aangegaan: a. alvorens een beslissing wordt genomen over het aangaan van een
    vastgoedtransactie; b. in het geval dat bij een vastgoedtransactie is bedongen dat de overeenkomst kan worden opgeschort
    of ontbonden dan wel de rechtshandeling kan worden beëindigd indien zich één van de situaties, bedoeld inartikel 9, derde
    lid, voordoet, alvorens zich op die opschortende of ontbindende voorwaarde te beroepen.'
  - '[Wijzigt Boek 3 van het Burgerlijk Wetboek.]'
  - Onverminderd artikel 6:13 juncto artikel 6:24 van de Algemene wet bestuursrecht kan beroep in cassatie worden ingesteld
    door de belanghebbende die overeenkomstigartikel 26bbevoegd was bij het gerechtshof beroep in te stellen en door Onze
    Minister.
  - Deze afdeling is met uitzondering vanartikel 6:12van overeenkomstige toepassing indien hoger beroep, incidenteel hoger
    beroep, beroep in cassatie of incidenteel beroep in cassatie kan worden ingesteld.
  - Het in deartikelen 5en6met betrekking tot het gebruiken van bestrijdingsmiddelen bepaalde is van overeenkomstige toepassing
    met betrekking tot het verwijderen en vernietigen van gebruikte verpakkingen en resten van bestrijdingsmiddelen.
  - Onverminderd artikel 6:13 juncto artikel 6:24 van de Algemene wet bestuursrecht kan beroep in cassatie worden ingesteld
    door de belanghebbende die overeenkomstigartikel 26bbevoegd was bij het gerechtshof beroep in te stellen en door Onze
    Minister.
  - Dit besluit treedt in werking met ingang van de dag na die waarop het in de Nederlandse Staatscourant wordt geplaatst.
