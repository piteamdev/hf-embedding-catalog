  - 'passage: በቤንሻንጉል ጉሙዝ ክልል መተከል ዞን ዛሬ ታኅሳስ 14/2013 በንጹሐን ዜጎች ላይ ጥቃት መፈጸሙን አዲስ ማለዳ ከወረዳው ኗሪዎች ከደረሳት መረጃ ለማወቅ ተችሏል። በቡለን
    ወረዳ በኩጅ ቀበሌ የሚገኙ ኗሪዎች ላይ የታጠቁ ኃይሎች ከማለዳው 11 ስዓት ጀምሮ በአራት ማዕዘን ከበው ጥቃቱን እንደፈጸሙት ገልጸዋል፡፡ በጥቃቱ ሕይወታቸውን ያጡ ሰዎች ቁጥር ለጊዜው አልታወቀም፡፡
    ጥቃት ደርሶባቸው እስካሁን በቡለን ወረዳ የመጀመሪያ ደረጃ ሆስፒታል ህክምና ለማግኘት ከ20 በላይ ዜጎች መግባታቸውን አዲስ ማለዳ ከስፍራው ካሉ ምንጮቿ አረጋግጣለች፡፡በመተከል ዞን የኢፌዲሪ
    ጠቅላይ ሚንስትር አቢይ አሕመድ (ዶ/ር) በትናንትናው ዕለት ታኅሳስ 13/2013 ከአካባቢው ነዋሪዎች እና የተለያዩ የሕብረተሰብ ክፍሎች ጋር በአካባቢው ዘላቂ ሰላም ለማምጣት ሲመክሩ እንደነበር
    የሚታወስ ነው። በውይይቱም ጠቅላይ ሚንስትሩ በተፈጠሩት ችግሮች ተሳተፉ ከክልል እስከ ፌደራል የሚገኙ አመራሮች ለሕግ እንደሚቀርቡም መናገራቸው አይዘነጋም።'
  - 'passage: ጠቅላይ ሚኒስትር ዐቢይ አህመድ በመተከል ዞን ነዋሪዎችን ባወያዩበት ማግስት ጭፍጨፋ መፈጸሙ ለሰጡት የሥራ መመሪያ የቤኒሻንጉል ጉሙዝ ክልል አመራሮች ተገዢ አለመሆናቸውን እንደሚያሳይ
    ተገለጸ፡፡በመተከል ዞን ቡለን ወረዳ ዛሬም ዘርን መሰረት ያደረገ ጭፍጨፋ እንደተፈጸመ ነዋሪዎች ለአብመድ ገልጸዋል፡፡ድርጊቱ ካሁን ቀደም በተደጋጋሚ የተፈጸመ ቢሆንም አሁንም እየተባበሰ መምጣቱን
    ነዋሪዎች ተናግረዋል፡፡ጭፍጨፋው ዘር ተኮር በመሆኑ ሁሉም የኢትዮጵያ ህዝቦች ድርጊቱን በማውገዝ የጋራ ድምጽ ማሰማት እንዳለባቸው የሕግ አማካሪዉ አስረስ ማረ ገልጸዋል፡፡'
  - 'passage: በጉባ ወረዳ አቡጃር ቀበሌ በሚኖሩ የአማራ ክልል ተወላጆች ላይ የታጠቁ ኃይሎች ትናንት ሌሊት በድንገት ጥቃት መፈጸማቸውን የአካባቢው ነዋሪዎች ለአብመድ አረጋግጠዋል፡፡ በዚህም
    የንጹኃን ሕይወት ጠፍቷል፤ ለአካል ጉዳትም ተዳርገዋል፡፡ ተጎጂዎች የሕክምና ዕርዳታ እየተደረገላቸው እንደሆነም ምንጮቻችን ነግረውናል፡፡'
  - 'passage:  በተለይም በቤንሻንጉል ጉዝም ክልል መተከል ዞን ዳንጉር ወረዳ ሕዝብ ላይ ጥቃት መድረሱ ተቀባይነት የሌለውና አሳዛኝ መሆኑን ገልፀው የመንግሥት የፀጥታ ኃይሎች፣ የሕግ የባላይነትና
    ሰላም የማስከበሩብ ኃላፊነት እንደሚወጡ ተናግረዋል፡፡ጉዳዩ የሚያስቆጭና የሚያስቆጣ ቢሆንም ግን ሕዝብ ለሕዝብ የራሱ ያፀፋ ዕርምጃ እንዳይወስድ መክረዋል፡፡  '
  - 'passage: ባሕር ዳር፡ ኅዳር 03/2013 ዓ.ም (አብመድ) የጠቅላይ ሚኒስትር ጽሕፈት ቤት በይፋዊ ገጹ መልዕክት አስተላላፏል፡፡“እውቅና ያላቸውን ዓለም አቀፍ ድርጅቶች ጨምሮ ሁሉም
    ግለሰብ በወቅታዊ ሁኔታዎች ላይ በመሬት ላይ ያለውን እውነታ የማያንፀባርቅና ያልተረጋገጠ መረጃ ከማሰራጨት እንዲቆጠቡ እናሳስባለን” ብሏል፡፡'
- source_sentence: 'query: ኣብ ዓመጺ - ንኡስ ዞባ በሪኽ ኣብ መንጎ ደቂ ዓዲ ዝጸንሐ ዘይምርድዳእ፡ ብመዓስ ኣብ ዝተኻየደ ስነ-ስርዓት ብዕርቂ ተፈቲሑ?'
  sentences:
  - 'passage: ንጸጸር ኩሊት ዘቃልዑ ዋሕዲ ፈሰስቲ፡- እዚ ሓደ ካብቶም ቀንዲ ጠንቅታትን ተኽእሎታት ጸጸር ኩሊት ዘጋድዱን እዩ። ሓደ ሰብ ኣብ መዓልቲ ክሳብ ሰለስተ ሊትሮ ማይ የድልዮ።
    እዚ ማይ’ዚ ብመልክዕ ጽሩይ ማይ፡ ፈሰስቲ፡ ወይ ምስ መግቢ ናብ ኣካላት ይኣቱ። ኣብ ዝተፈላለዩ ጥቕምታት ምስ ወዓለ ኣብ ኩሊት ይጻረ’ሞ ብመልክዕ ሽንቲ ንደገ ይወጽእ። እዚ መጠን ማይ ኣብ
    ኣካላትና ብዝተፈላለዩ ምኽንያታት ምስዘይህሉ፡ ጸጸር ኣብ ኩሊት ወይ ስርዓተ ሽንቲ ክኽሰት ዘለዎ ተኽእሎ ኣዝዩ ይዓቢ።'
  - 'passage: ዓመጺ፡ ኣብ መንጎ ደቂ ዓዲ ዝጸንሐ ዘይምርድዳእ ብዕርቂ ተፈቲሑ

    ኣብ ዓመጺ - ንኡስ ዞባ በሪኽ ኣብ መንጎ ደቂ ዓዲ ዝጸንሐ ዘይምርድዳእ፡ ብ22 ለካቲት ኣብ ዝተኻየደ ስነ-ስርዓት ብዕርቂ ተፈቲሑ።


    ወኪል ሚኒስትሪ ዞባዊ ምምሕዳር፡ መራሕቲ ሃይማኖት፡ ኣባላት ባይቶን ተወለድቲ ዓድን ኣብ ዝተረኽቡሉ ስነ- ስርዓት፡ ኣመሓዳሪ ዞባ ማእከል ሜጀር ጀነራል ሮሞዳን ዑስማን ኣውልያይ ኣብ ዘስመዖ
    ቃል፡ ናጽነት ፍረ ሓያል ሓድነትን ክቡር መስዋእትነትን ምዃኑ ድሕሪ ምጥቃስ፡ እዚ ክብርታት’ዚ’ውን ኣብ ህንጸት ሃገር መሰረታዊ ብምዃኑ፡ ዜጋታት ዕጥቆም ክገብርዎ ኣዘኻኺሩ።'
  - 'passage: ቁንጣሮ ብዛዕባ ሓርማዝ

    ኣብቲ ኣብ ኬንያ ዝርከብ ሰፊሕ ሃገራዊ መናፈሻ እምቦሶሊ ድሕሪ ቐትሪ ኣብ ግዜ ሃሩር: ብዙሓት መጓሰ ሓራምዝ ኣብ ሰፈሮም ዝህውኾም ነገራት ዘይብሎም ቀሲኖም ዝነብሩ ኢዮም ዝመስሉ። ይኹን
    እምበር: ካብቲ ትሑት ዕርምርም ዝብል ድምጺ ጀሚርካ ኽሳዕ እቲ ብርቱዕ ገዓር: እርታ: ነብሒ: ኩርፍታ እተፈላለየ “ዘረባ ሓርማዝ” ይስማዕ ኢዩ። ገለ መጠን ናይቲ ድምጺ ትሑት ፍሪኰንሲ ስለ
    ዘለዎ ወድሰብ ክሰምዖ ዘይክእል እኳ እንተዀነ ኣዝዩ ብርቱዕ ካብ ምዃኑ እተላዕለ ሓያሎ ኪሎ ሜተራት ርሒቑ ዘሎ ሓርማዝ ግን ክሰምዖ ይኽእል ኢዩ።'
  - 'passage: ኣብ እርጋኑ ከይተረፈ ኣቦይ ንዘልዎ ‘እታ ቅድሚ ዳኘው ደላ ግደፋ’ ይብሉ ነይሮም ይብልዎም። መውረርያኹም እንዶ ግዳ ሰሓቡ፡ ነገር ፈረሰኛ መርዓት ከይስሕቶ።

    መርዓዊን መርዓትን ‘ኣሽነን በለ’ ብዝብሃል ወግዒ ካብ ቤት ሒማ ንእንዳ መርዓዊ ይኣትው። ካብኡ ተረፈ ሓደ ምርጫ ይተርፍ። መርዓዊ ወደይ ዝብሎ ስድራ እንተዘይ ሃለወ መርዓዊ መርዓቶም ሒዞም
    ናብ ሓደ ዓበይቲ ዓዲ ዘዳለውዎ ቤት ይኣትው። ‘ቤት ጸኒሕ’ ከኣ ይብልዎ። እዚ ቤት ንኸምዚ ጥራሕ ዘይኮነ ካበየ ቦታታት ንዝተፈላለየ ምኽንያት ዝመጹ ገያሾ‘ውን ክኣትውዎ ይኽእሉ። ጥሪ ኣትዩ
