  model_type: hv_chemical_bubble
  version: 3
  dependencies:
  - numpy
  physics:
    equation: Keller-Miksis radial bubble dynamics
    reference: Keller & Miksis 1980, J. Acoust. Soc. Am. 68, 628
    integrator: RK4 with clamping
    stability_clamps:
      R_min_factor: 0.05
      R_max_factor: 20.0
      Rdot_max_factor: 0.9
  default_parameters:
    R0: 1.0e-06
    rho: 1000.0
    c: 1500.0
    sigma: 0.072
    mu: 0.001
    p_inf: 101325.0
    kappa: 1.4
  derived:
    minnaert_freq_at_R0_1um: 3283000.0
    minnaert_freq_scaling: 1/R0
  parity_certificate:
    n_inputs: 2
    n_functions: 16
    fitness_threshold: 0.8
    classification_thresholds:
      linear_max: 8
      single_threshold_layer:
      - 12
      - 14
      multi_layer_min: 16
    interpretation:
      8/16: linear (linear separability bound)
      12-14/16: single threshold layer
      16/16: multi-layer nonlinear
  reservoir_defaults:
    n_bubbles: 5
    detune_spread: 0.15
    drive_amp_atm: 1.0
    n_steps_per_bit: 500
    dt: 1.0e-09
    feature_window: 50
