    - "La consulta preconcepcional es imprescindible en toda pareja en la cual por lo menos uno de los componentes presenta\
      \ FQ. Si es la mujer la que padece la enfermedad, es necesario valorar de forma individualizada el riesgo de llevar\
      \ adelante un embarazo. Cuando una mujer con FQ está dispuesta a comenzar un embarazo es necesario conocer: 37\n\nEl\
      \ embarazo por sí solo de forma fisiológica supone una importante sobrecarga para el organismo tanto en la función pulmonar\
      \ como en su aparato circulatorio y en sus necesidades nutricionales. Esta sobrecarga fisiológica puede tener consecuencias\
      \ muy negativas en una paciente con FQ cuyo estado de salud no sea razonablemente apropiado para afrontar una gestación.7\n\
      \nC. El embarazo\n\nCuando sea posible, las mujeres deben ser alentadas a discutir sobre el embarazo con su equipo de\
      \ FQ antes de quedar embarazadas. Por tanto, la asistencia prenatal del embarazo de toda mujer con una fibrosis quística\
      \ debe comenzar en la etapa preconcepcional, puesto que la salud durante el embarazo, tanto de la madre cuanto del feto,\
      \ depende en gran medida del estado de salud o de enfermedad de la mujer antes de la concepción.\n\nEs fundamental valorar\
      \ el grado de nutrición y la situación cardiopulmonar en esta etapa, pues sabemos que la gestación produce una serie\
      \ de repercusiones más o menos graves sobre la mujer con fibrosis quística, que, de forma esquemática, son las siguientes:\n\
      \n1.\t Desnutrición importante\n\n2.\t Desencadenamiento de diabetes gestacional\n\n3.\t Empeoramiento de la situación\
      \ cardiopulmonar\n\n4.\t Deterioro transitorio o permanente de la función pulmonar posparto\n\nDebe informarse además,\
      \ de forma clara y comprensible para la paciente, los posibles riesgos descritos en lo que respecta a los resultados\
      \ perinatales, es decir, los riesgos para sus hijos como consecuencia del embarazo, de la tasa de aborto aumentado,\
      \ así como la morbimortalidad perinatal como consecuencia  fundamentalmente de dos causas:\n\n1.\t Prematuridad\n\n\
      2.\t Crecimiento intrauterino restringido (peso y tamaño por debajo de lo habitual para\n\nesa edad)"
