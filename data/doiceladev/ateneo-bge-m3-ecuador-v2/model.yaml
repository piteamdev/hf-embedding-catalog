- source_sentence: '¿Cuáles son los criterios clínicos, diagnóstico y conducta médica recomendada para Evidencias y recomendaciones
    - Esquema y Criterios Normados según la GPC de Guia de Practica Clinica: Diagnostico y Tratamiento de la Anemia en el
    Embarazo del MSP Ecuador?'
  sentences:
  - "Clasificación CIE-10\n\nE75.2\t Enfermedad de Gaucher\n\nCódigo internacional OMIM\n\nOMIM #: 230800 Gaucher tipo I,\
    \ Gene map locus 1q21\n\nJustificación\n\nLa intervención temprana, así como el manejo integral e interdisciplinario sistematizado\
    \ de esta patología, permitirá su diagnóstico precoz, tratamiento oportuno y seguimiento adecuado, mejorando la calidad\
    \ de vida de los pacientes. Esta GPC conforma un conjunto de recomendaciones desarrolladas de manera sistemática y con\
    \ sustento en el mayor nivel de evidencia científica disponible, cuyo propósito es optimizar y estandarizar el manejo,\
    \ mejorar el uso de recursos, y los mecanismos de referencia y contrarreferencia de los pacientes con Enfermedad de Gaucher\
    \ tipo 1.\n\nPropósito de esta GPC\n\nEsta GPC forma parte de las guías que desarrolla la Dirección Nacional de Normatización\
    \ del MSP, y la Subsecretaría de Gobernanza de la Salud Pública.\n\nLa finalidad de esta GPC es establecer un referente\
    \ nacional para orientar la toma de decisiones clínicas basadas en recomendaciones sustentadas en la mejor evidencia disponible."
