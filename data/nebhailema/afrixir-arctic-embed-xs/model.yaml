widgetData:
- source_sentence: Koma A Adamawa
  sentences:
  - Ta fuskar yanayin ƙasa, Adamawa ƙasa ce ta manyan tsaunuka zagaye da koramu a gefensu - kaman rafin  Benue, Gongola da
    Yedsarem. Koramun tsaunin Kamaru, Tsaunin Mandara da Tsaunin Adamawa ne suka haɗu suka samar da yanayin ƙasar Jihar Adamawa.
  - "Masarautar Adamawa, wacce aka kafa ta kuma aka sanya mata sunan Modibo Adama\n Tsohuwar Limamin Katolika na Adamawa"
  - Babu wanda zaa kara azabtarwa ko wani horo mai tsanani a matsayinsa na dan Adam ba tare da wani daliliba.
  - 'Song Karamar Hukuma ce dake a Jihar Adamawa, arewa maso gabashin Nijeriya.


    Kananan hukumomin jihar Adamawa'
  - 'Koma ƙabila ce mai ƙarancin tarihi a arewacin Adamawa, a tsaunukan Atlantika, wanda ke iyaka da kudancin Kamaru . Mazauna
    tsaunuka suna bazuwa ta kudu da kudu maso yamma na waɗannan duwatsu, gami da kuma yawa a gefen Kamaru. Akwai ƙauyukan
    Koma 21 a bangaren Kamaru na tsaunukan Alantika da kauyuka 17 a bangaren Najeriya.

    Garuruwa mafi girma a yankin Koma sune: Tantille, Chonha, Mani, Nassarawa Koma da Ba-Usmanu.'
- source_sentence: Janet Kirina
  sentences:
  - Patricia Wangechi Kihoro (an haife ta 4 Janairu 1986)   mawakiya ce 'yar ƙasar Kenya, marubuciya,' yar fim, rediyo da
    halin talabijin na gaskiya. Ta yi fice ne bayan da ta halarci karo na uku na Tasker Project Fame, inda ta zama ɗaya daga
    cikin masu ƙarshe. A wasan kwaikwayo, ta fito a cikin wasu shirye-shirye na cikin gida kamar fim na 2011, Miss Nobody,
    wanda ya ga an tsayar da ita a cikin lambar yabo ta Kalasha ta 2012 don mafi kyawun jagorar ’yar fim. A cikin samar da
    talabijin, an jefa ta a matsayin jagora a Ka'idar Groove, wasan kwaikwayo na kida da kuma na yau da kullun a cikin Demigods,
    Canje-canje, Rush da Makutano Junction .  A matsayinta na mai gabatar da rediyo, ta yi aiki tare da One FM da Homeboyz
    FM.   Patricia samar da rubutu ce, mai tasiri da youtuber.
  - "Waƙa \nKirina ta shiga harkar waka tun daga ranar 22 ga Fabrairu 2013 inda ta fitar da wakarta ta farko, \"Night Out\"\
    .  A watan Agusta 2013, ta fitar da wakarta ta biyu, da \"Kata Kata\",  \"Akwatin Niingize\".  Zuwa 2015, ba ta bayyana\
    \ cikakken shiri ba tukuna don kundi na farko."
  - "Tessa Gray, babban mai ba da labari na Labarin Na'urorin Labarai na Cassandra Clare\n Tessa Noël, a cikin jerin TV Highlander:\
    \ Jerin\n Teresa \"Tessa\" Testarossa, a cikin multimedia ikon amfani da sunan kamfani Full Metal Panic!\n Tessa, hali\
    \ a cikin jerin talabijin na <i id=\"mwbQ\">allahntaka</i>\n Sage, superhero na Marvel Comics wanda kuma aka sani da Tessa\n\
    \ Tessa (Capcom), a cikin jerin wasannin bidiyo na Red Earth\n Tessa, a cikin wasan kwaikwayo na Gilbert da Sullivan The\
    \ Gondoliers\n halin taken <i id=\"mweA\">Tessa</i> (labari), na Margit Sandemo\n halin taken <i id=\"mwew\">Tessa</i>\
    \ (wasa), na Jean Giraudoux"
  - "Kirkira \nWanda aka kirkira a shekarar 1997, aikin Ronald Reagan Legacy Project na ATR, yayi aiki don ganin kowace karamar\
    \ hukuma a Amurka ta tuna tsohon shugaban ta hanyar \"muhimmiyar\" kuma \"ta gari\", kamar sanya sunan gidan jama'a. Har\
    \ ila yau aikin ya tallafawa ƙoƙari don sanya Reagan a kan dala goma .  Har ila yau, aikin ya karfafa gwiwar gwamnonin\
    \ jihohi da su ayyana ranar 6 ga Fabrairu ta zama “Ranar Ronald Reagan”; har zuwa shekarata 2006, gwamnoni 40 sun yi hakan."
  - "Rayuwar farko \nA ranar 25 ga Afrilu 1986 ne aka haifi Kirina a matsayin Janet Kirina Nariki a Kajiado, Kenya."
- source_sentence: Rashidi Yekini
  sentences:
  - Rashidi Yekini An haifi marigayi Rashidi Yekini ne a garin Kaduna dake arewacin Najeriya, a ranar 23 ga watan Oktoba shekararekarar
    ta 1963.
  - "Rayuwar shi \nSheikh Muhammad Nura Khalid mutum ne mai iyali, Ya auri mata hudu da ‘ya’ya ashirin da takwas da kuma jikoki\
    \ biyar."
  - "Dan takarar jam’iyya: Umar Iliya Damagum\n Abokiyar takara: Baba Abba Aji\n Umar Elgash Maina- ya janye"
  - An haifi Izz al-Dawla a matsayin Bakhtiyar, kuma shi ɗan Mu'izz al-Dawla ne . Yana kuma da 'yan'uwa maza uku 3 masu suna
    Sanad al-Dawla, Marzuban da Abu Ishaq Ibrahim . Bakhtiyar, a lokacin yarintarsa, ya auri ɗiyar jami'in Dailamite Lashkarwarz.
  - Rashidi Yekini ya rasu a ranar Juma'a hudu ga wannan watan a garin Ibadan na jiyar Oyo dake kudancin Najeriya yana da
    shekaru 48 , kuma kafin rasuwarsa yayi fama da rashin lafiya.
- source_sentence: Haƙƙin Hijira Kyauta
  sentences:
  - Hijira kyauta ko buɗaɗɗen shige da fice shine matsayin da ya kamata mutane su iya ƙaura zuwa kowace ƙasar da suka zaɓa
    ba tare da ƴan takurawa ba.
  - Tun bayan Yaƙin Duniya na II, jerin shirye -shiryen haɓaka babban birni sun zo tare da canje -canje a cikin gwamnati -
    wasu suna ganin haɓakawa a cikin Jamestown a matsayin wani ɓangare na shirin gabaɗaya, wasu kuma suna kula da irin wannan
    haɓaka kamar gasa tare da ƙoƙarin haɓaka kasuwancin tsakiyar. gundumar Accra gaba da arewa. A halin yanzu, shirye-shirye
    sun yi nisa don sake haɓaka gundumomin Jamestown da Usshertown, waɗanda ake kira "Ga-Mashie" tare da ƙaddamar da Dabarun
    Tsohon Accra na 2015. Mashahurin rawa Azonto ya samo asali ne daga garin James. Harshen gida "Ga" galibi 'yan ƙasar ke
    magana.
  - Duk da bambance-bambancen ban mamaki a tsakanin waɗannan akidun siyasa, yawancin masu sassaucin ra'ayi,  masu sassaucin
    ra'ayi, masu ra'ayin gurguzu, da 'yan gurguzu suna ba da shawarar shige da fice,  kamar yadda Objectivists suka yi.
  - Jirgin kasan da ya yi hatsari a Masar Jirgin dai ya kwaso jami'an sojoji sababbin dauka ne wadanda za su je kudu maso
    yammacin birnin Alkahira. Wannan dai shi ne na baya-bayan nan daga jerin haduran jiragen kasa da ke faruwa a kasar ta
    Masar. A watan Nuwamba kusan yara hamsin ne 'yan makaranta suka rasa rayukansu a lokacin da wani jirgin kasa ya yi karo
    da motar da take dauke da su.
  - "Hijira ta Neman Ilimi \nYawancin baki masu neman ilimi suna kaura zuwa kasashe na uku bayan sun kammala karatunsu a Jamus."
- source_sentence: Majdouline Cherni
  sentences:
  - "Sakatare \nA 23 Janairu 1, 2015, Cherni an nada shi Sakataren Gwamnati mai kula da Dossier na Shahidai da Raunin juyin\
    \ juya hali a majalisar ministocin Habib Essid .   Matsayinta ya haɗa da samar da \"taimako na ɗabi'a da na abin duniya\"\
    \ ga iyalai.  A ranar 20 ga Agusta 2016, an nada ta Ministan Matasa da Wasanni a majalisar zartarwar Youssef Chahed .\
    \   Tana da alhakin shirya taron matasa don neman dawo da amincewar matasa a cikin cibiyoyin gwamnatin Tunisia.   A ƙarshen\
    \ 2016, hotuna da yawa da aka sanya a shafin Facebook na ministar an sauya su ta hanyar dijital don rufe gwiwoyinta."
  - Cherifa Kersit (    ; an haife ta ne a ranar 1 ga watan Janairun shekaran 1967) mawaƙiya ce yar kasar Maroko a cikin nau'in
    Tamawayt. Cherifa tana waka ne a Central Atlas dakeTamazight.
  - An haifi shahararren soprano 'yar Rasha Anna Netrebko, soprano Evgenia Kononova, cosmonaut Gennady Padalka, Andrei Shkuro
    mai sabawa ra'ayin juzu'i da motsa jiki mai motsa jiki Inna Zhukova an haife su a Krasnodar. Wani sananne 'yan qasar na
    Krasnodar ne Girka kwando na duniya Lazaros Papadopoulos, suka yi hijira zuwa ƙasar Girka tare da Pontic Greek iyaye lokacin
    da yake da shekaru 10 da haihuwa.
  - Majdouline Cherni (an haife shi a 21 ga Fabrairun shekarar 1981) ɗan asalin Tunusiya ne kuma ɗan siyasa wanda ya kasance
    Ministan Matasa da Wasanni daga shekarar 2016 zuwa shekarar 2018.
  - "Ayyuka \nGordian ta kasance tauraruwa a cikin Rordan Riber na 2012 rabin awa Swahili TV Series mai taken, Siri ya Mtungi,\
    \ wanda a ciki ta taka rawar \"Cheusi\". Fim ɗin ya kuma fito da irin su Beatrice Taisamo, Yvonne Cherrie da sauransu."
