  sentences:
  - 'Derma E Firming Moisturizer, DMAE, Alpha Lipoic, C-Ester, 2 Ounce

    Category: Beauty Description: Help visibly firm, tighten and tone skin with this retexturizing formula. Rich in moisture
    and nutrients, this nourishing crme helps support healthy collagen and elastin to reduce the look of facial sag, diminish
    the visible signs of aging and protect skin from future damage. DMAE, also referred to as nature''s firming agent, has
    been shown to firm skin, improve skin tone and reduce fine lines and wrinkles. Alpha Lipoic Acid, also referred to as
    the universal antioxidant, is capable of protecting all portions of the skin''s cellular structure and boost the activity
    of all other antioxidants. C-Ester protects the skin cells from free radical damage, helps reduce the appearance of lines
    and wrinkles, and helps firm the skin through its ability to support healthy collagen and elastin. Enriched with moisturizing
    Jojoba Oil and nourishing Vitamins A and E, this formula leaves skin thoroughly hydrated, nourished and firmer-looking.
    Ideal for those who are looking to visibly firm, lift and tone the face or neck. Please Note: DMAE and Alpha Lipoic Acid
    are highly effective ingredients that will improve your skin''s appearance. As with any new skin care product, before
    starting regular use, we recommend that you "patch test" for sensitivity on a small area under the ear below the jaw line
    to make sure you have no adverse reaction. If you have a reaction discontinue use immediately.'
  - 'Allstar BIO21712 Bumpits Hair Volumizing Inserts- Dark Brown/Black

    Category: Beauty Description: The Bumpits Hair Volumizing Leave-In Inserts give you instant volume and let you enjoy feeling
    confident and beautiful, like you stepped out of a professional salon. Not only does this Set of 3 Bumpits give you additional
    volume in your hair, it will give you an entirely new look whether you are out dancing, working out, going to work, shopping,
    or at a formal event. The raised patented edging firmly grips any hair type. For those ladies with finer, thinner hair,
    you can do some light teasing at the base to ensure a firm hold. Included are three dark brown/black Bumpits in small,
    medium and large along with a teasing comb and styling guide.'
  - 'Toni&Guy Glamour Volume Plumping Whip, 2.82 Fluid Ounce

    Category: Beauty'
