      (M-10a) e o isolador de ancoragem polimérico (I-4a). A estrutura exige ainda a aplicação de cintas de aço (F-10) e cantoneiras
      retas (F-4) para garantir a estabilidade do conjunto montado, respeitando as notas técnicas sobre as características
      de rede para a estrutura CE2.CE3.
