    - '8. Apoyo psicosocial a la familia


      Las preguntas que se van a responder son:


      • ¿Cómo se identifican las necesidades de apoyo psicosocial a la familia? • ¿Cuál es la mejor forma de atender las necesidades
      psicosociales y de apoyo a la familia? • ¿Cuáles son los factores de riesgo de la claudicación familiar?


      8.1. Necesidades de apoyo psicosocial de la familia


      Las necesidades psicosociales de la familia son: económicas, emocionales, de comunicacion, de asesoramiento (con respecto
      a recursos con los que cuentan públicos y privados, redes de apoyo, bonos, ayudas técnicas), de soporte, de reorganización
      familiar.383


      Según la RS de Harding,316 existe mucha información acerca de las necesidades de los cuidadores de pacientes que reciben
      atención domiciliaria de cáncer y de CP, pero poca sobre la efectividad de las intervenciones. Según los estudios, las
      necesidades son: ayuda domiciliaria, apoyo informal, información, ayuda económica y ayudas para el cansancio, la ansiedad
      y el aislamiento. Los temas prioritarios para los cuidadores son la información y el apoyo psicológico.


      RS de distintos tipos de estudios 1+/2+/3/Q


      Otra revisión proporciona información sobre este tema,315 aunque no está referida a pacientes en CP, sino a cuidadores
      de adultos mayores. Los estudios que incluye son, en su mayoría, en pacientes con demencia, donde la distinción entre
      crónico y terminal no resulta tan clara.


      RS de distintos tipos de estudios


      2+/Q


      Las necesidades y deseos que expresan los cuidadores de pacientes adultos mayores son:


      • Desean satisfacer sus necesidades de formación en grupos de cuidadores. • Desean centros de CP especializados. • Experimentan
      emociones negativas como carga, estrés y preocupación cuando cuidan a un adulto mayor en casa. • Desean que exista una
      red de grupos de apoyo. • Temen el aislamiento social. • Temen la pérdida de control, los cambios de rol en las relaciones
      y la pérdida de reciprocidad.


      Estudio cualitativo


      orgullo, apoyo y refuerzo que les ayuda en el proceso de duelo. Por tanto, es importante encontrar un equilibrio entre
      la ayuda que a veces puedan necesitar y lo que no están dispuestas a delegar en otros; lo que puede llevarles a renunciar
      a ciertas medidas de apoyo como centros de CP, ingresos, etc.'
