  chat_template_jinja: "{% set vars = namespace(prefix='', images=[], texts=[], payload_count=0) %}\n{%- for message in messages\
    \ -%}\n    {%- if message['role'] == 'system' -%}\n        {%- if message['content'] is string -%}\n            {%- set\
    \ vars.prefix = message['content'] %}\n        {%- else -%}\n            {%- for content in message['content'] -%}\n \
    \               {%- if content['type'] == 'text' -%}\n                    {%- set vars.prefix = content['text'] %}\n \
    \               {%- endif -%}\n            {%- endfor -%}\n        {%- endif -%}\n    {%- else -%}\n        {%- set vars.payload_count\
    \ = vars.payload_count + 1 %}\n        {%- if message['role'] == 'query' -%}\n        {%- set vars.prefix = 'query: '\
    \ %}\n        {%- elif message['role'] == 'document' -%}\n            {%- set vars.prefix = 'passage: ' %}\n        {%-\
    \ endif -%}\n        {%- for content in message['content'] -%}\n            {%- if content['type'] == 'text' -%}\n   \
    \             {%- set vars.texts = vars.texts + [content['text']] %}\n            {%- elif content['type'] == 'image'\
    \ -%}\n                {%- set vars.images = vars.images + ['<image> '] %}\n            {%- endif -%}\n        {%- endfor\
    \ -%}\n    {%- endif -%}\n{%- endfor -%}\n{%- if vars.payload_count != 1 -%}\n    {{ raise_exception('Llama Nemotron VL\
