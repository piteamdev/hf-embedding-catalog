  - source_sentence: 'Instruct: Given a Dutch legal query, retrieve relevant articles that help answer the query

      Query:Dient een belastingaanslag voor de toepassing van van de Invorderingswet 1990 nog steeds te worden aangemerkt
      als een aanslag die in meer dan één termijn invorderbaar is, indien de belastingplichtige deze aanslag feitelijk in
      één keer heeft betaald om een betalingskorting te verkrijgen?'
    sentences:
    - Met betrekking tot een belastingaanslag inkomstenbelasting over het kalenderjaar 2014 waarvan het aanslagbiljet een
      dagtekening heeft die ligt in de periode die aanvangt op 1 mei 2015 en eindigt op 30 juni 2016 wordt geen invorderingsrente
      in rekening gebracht voor zover de betaling plaatsvindt uiterlijk 4 maanden na het verstrijken van de voor deze belastingaanslag
      geldende betalingstermijn.
    - '1. Bij ministeriële regeling kunnen regels worden gesteld omtrent het indienen van aanvragen voor vergunningen, ontheffingen
      en erkenningen, die krachtens deze wet kunnen worden verleend, en het indienen van kennisgevingen, die ingevolge bij
      of krachtens deze wet gestelde regels moeten worden geregistreerd.

      2. Bij de regeling kan worden bepaald: a. dat een aanvraag eerst in behandeling wordt genomen of dat een kennisgeving
      eerst wordt geregistreerd nadat een daarvoor vastgesteld bedrag is voldaan; b. de kosten van het onderzoek voortvloeiende
      uit de aanvraag geheel of gedeeltelijk ten laste van de aanvrager wordt gebracht.'
    - '1. De burgemeester heeft het opperbevel bij brand alsmede bij ongevallen anders dan bij brand voor zover de brandweer
      daarbij een taak heeft.

      2. De burgemeester is bevoegd bij brand en ongevallen bedoeld in het eerste lid, de bevelen te geven die met het oog
      op het voorkomen, beperken en bestrijden van gevaar nodig zijn.'
    - Indien een voorlopige aanslag inkomstenbelasting is of zal worden vastgesteld en een relevante wijziging optreedt in
      de omstandigheden die van belang zijn voor de opgelegde of op te leggen voorlopige aanslag, doet de belastingplichtige
      daarvan zo spoedig mogelijk op de door de inspecteur aangewezen wijze mededeling aan de inspecteur. Deze mededeling
      wordt geacht een verzoek om herziening als bedoeld in artikel 9.5, eerste lid, van de Wet inkomstenbelasting 2001 te
      zijn.
    - De belasting voor een motorrijtuig waarvoor een kenteken is opgegeven kan in één keer worden betaald over vier aaneensluitende
      tijdvakken.
    - De verzending en de betekening van de stukken betreffende de invordering van de schenk- en erfbelasting kan plaatsvinden
      aan de ingevolge artikel 43 van de Successiewet 1956 gekozen woonplaats dan wel aan de werkelijke woonplaats of plaats
      van vestiging.
    - Uiterlijk de veertiende dag na de laatste dag, waarop de inartikel 213bedoelde lijst der geldelijke regelingen ter inzage
      heeft gelegen, kan iedere belanghebbende schriftelijk zijn bezwaren tegen de lijst der geldelijke regelingen bij de
      landinrichtingscommissie indienen.
    - 'Onder last onder dwangsom wordt verstaan: de herstelsanctie, inhoudende: a. een last tot geheel of gedeeltelijk herstel
      van de overtreding, en b. de verplichting tot betaling van een geldsom indien de last niet of niet tijdig wordt uitgevoerd.'
    - 'Artikel 27a. Betalingskorting In aansluiting op artikel 27a van de wet beschrijft dit artikel het beleid over de verlening
      van betalingskorting bij vermindering van de belastingaanslag. 27a.1. Verlenen betalingskorting en vermindering van
      de belastingaanslag Bij een vermindering van de belastingaanslag kan uitsluitend betalingskorting worden verleend als:
      – de vermindering plaats vindt vóór de eerste vervaldag; en – tenminste het nieuwe bedrag van de (inmiddels verminderde)
      belastingaanslag minus het bedrag van de oorspronkelijk berekende betalingskorting vóór of op de eerste vervaldag is
      betaald. In dit geval herberekent de ontvanger de betalingskorting op basis van het nieuwe bedrag van de belastingaanslag
      en stelt hij dit vast bij voor bezwaar vatbare beschikking.'
