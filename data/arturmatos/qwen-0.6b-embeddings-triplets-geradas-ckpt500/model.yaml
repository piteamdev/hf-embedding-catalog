- source_sentence: Quando a unidade G4 da Usina Açucareira Ester foi liberada para início da operação comercial?
  sentences:
  - 'O SUPERINTENDENTE DE FISCALIZAÇÃO DOS SERVIÇOS DE GERAÇÃO DA AGÊNCIA NACIONAL DE ENERGIA ELÉTRICA - ANEEL, em exercício,
    no uso das atribuições conferidas pela Portaria nº 1.046, de 09 de setembro de 2008, e Resolução ANEEL nº 433, de 26 de
    agosto de 2003, em conformidade com o que estabelece a supracitada resolução, e considerando o que consta do Processo
    nº 48500.003200/2008-75, resolve: I - Liberar a unidade geradora G4, de 30.000 kW, da UTE Açucareira Ester, localizada
    no Município de Cosmópolis, Estado de São Paulo, de titularidade da empresa Usina Açucareira Ester S.A., autorizada nos
    termos da Resolução ANEEL nº 117, de 20 de maio de 1999, e autorizada a ampliar sua capacidade instalada por meio da Portaria
    MME nº 168, de 6 de maio de 2008, para início da operação comercial a partir do dia 3 de junho de 2010, quando a energia
    produzida pela unidade geradora deverá estar disponível ao sistema.


