widgetData:
- source_sentence: metalloendopeptidase activity
  sentences:
  - Cysteine protease. May have an important role in corneal physiology. .
  - Metalloprotease (PubMed:16585064, PubMed:39672391). Was previously shown to degrade COMP (PubMed:16585064). However, a
    later study found no activity against COMP (PubMed:39672391). .
  - Degrades casein, gelatins of types I, III, IV, and V, and fibronectin. Activates procollagenase. .
- source_sentence: epidermis development
  sentences:
  - Plays a role in the formation of clathrin-coated invaginations and endocytosis. .
  - Collagen VI acts as a cell-binding protein.
  - Plays a role in melanin biosynthesis (PubMed:33100333). Catalyzes the conversion of L-dopachrome into 5,6-dihydroxyindole-2-carboxylic
    acid (DHICA). .
- source_sentence: malate-aspartate shuttle
  sentences:
  - Involved in the catabolism of quinolinic acid (QA). .
  - Hydrolyzes fatty acids from S-acylated cysteine residues in proteins (PubMed:26701913). Has depalmitoylating activity
    towards NRAS (PubMed:26701913). Has depalmitoylating activity towards DLG4/PSD95 (PubMed:26701913). May have depalmitoylating
    activity towards MAP6 (By similarity). .
  - Responsible for the transport of glutamate from the cytosol into the mitochondrial matrix with the concomitant import
    of a proton (symport system). .
- source_sentence: regulation of transforming growth factor beta receptor signaling pathway
  sentences:
  - Involved in signal transduction through the Wnt pathway. Promotes beta-catenin's transcriptional activity (By similarity).
    .
  - Non-specific receptor for endothelin 1, 2, and 3. Mediates its action by association with G proteins that activate a phosphatidylinositol-calcium
    second messenger system. .
  - Negatively regulates TGF-beta signaling.
- source_sentence: collagen biosynthetic process
  sentences:
  - Participates in the reverse transport of cholesterol from tissues to the liver for excretion by promoting cholesterol
    efflux from tissues and by acting as a cofactor for the lecithin cholesterol acyltransferase (LCAT). As part of the SPAP
    complex, activates spermatozoa motility. .
  - Cleaves the propeptides of type II collagen prior to fibril assembly. Does not act on types I and III collagens.
  - Catalyzes the decarboxylation of L-3,4-dihydroxyphenylalanine (DOPA) to dopamine and L-5-hydroxytryptophan to serotonin.
    .
