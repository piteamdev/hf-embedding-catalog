widgetData:
- source_sentence: 'Title: TISSUE RETRACTOR APPARATUS AND METHODS

    Abstract: A delicate tissue retraction system having a hollow tubular retractor, a hollow tubular introducer that is removably
    installed within the retractor, and a navigation module that is removably installed within the introducer. The introducer
    has an inner passage defined by a passage wall having a width dimension that increases in size from a distal introducer
    end to a proximal introducer end. The navigation module has a shaft with a proximal shaft end, a middle shaft portion,
    and a distal shaft end, and a navigation unit mounted to the proximal shaft end. When assembled, the distal shaft end
    is contained generally within the introducer and the navigation module outside the introducer, and the middle shaft portion
    is spaced from the passage wall. The navigation module indicates the location of one or more points on at least one of
    the retractor and the introducer to a navigation system.'
  sentences:
  - 'Title: OPTOELECTRICAL CONNECTOR AND PORTABLE ELECTRONIC DEVICE

    Abstract: In an optoelectrical connector including two connectors to be interconnected, each having at least one optical
    connection part and at least two electrical connection parts, the electrical connection parts of one of the connectors
    are pins and the electrical connection parts of the other connector are spring contacts. The connector having the spring
    contacts includes, before the spring contacts, positioning holes in which the pins are to be inserted. The tips of the
    pins come into contact with the spring contacts to make electrical connection. The bases of the pins fit in the positioning
    holes to perform positioning for optical connection. The optoelectrical connector can be smaller, lighter, and thinner.'
  - 'Title: Navigation System And Method For Tracking Objects Using Optical And Non-Optical Sensors

    Abstract: Systems and methods that utilize optical sensors and non-optical sensors to determine the position and/or orientation
    of objects. A navigation system includes an optical sensor for receiving optical signals from markers and a non-optical
    sensor, such as a gyroscope, for generating non-optical data. A navigation computer determines positions and/or orientations
    of objects based on optical and non-optical data.'
  - 'Title: SYSTEM AND METHOD FOR SELECTIVE ADVERTISEMENT OF AVAILABILITY TO COMMUNICATE BASED ON LIGHT SOURCE AND ASSOCIATED
    LIGHTING PROPERTY

    Abstract: Computer-readable media, methods and systems are provided herein for facilitating selective advertisement of
    a user''s availability to communicate based on one or more lighting properties of one or more light sources (112-116,
    742, 746). In various embodiments, an identifier and one or more lighting properties of a light source may be obtained
    by a computing device (100, 150, 700), directly (e.g., using an optical sensor) or through one or more computer networks
    (122). Based on this obtained data, the computing device may determine an activity of the user, and based on the determined
    activity, may facilitate selective advertisement of the user''s availability to communicate over one or more social networks.'
- source_sentence: 'Title: System and Method for Electroporating a Sample

    Abstract: A system and method are described for electroporating a sample that utilizes one or more sets of electrodes
    that are spaced apart in order to hold a surface tension constrained sample between the electrodes. The first electrode
    is connected to the lower body of the system while the second electrode is connected to the upper body. Both electrodes
    are connected to a pulse generator. Each electrode has a sample contact surface such that the first electrode and the
    second electrode may be positioned to hold a surface tension constrained sample between the two sample contact surfaces
    and the sample may receive a selected electric pulse.'
  sentences:
  - 'Title: REMOTE CONTROLLER HAVING DUAL TOUCH PADS AND METHOD OF CONTROL USING THE SAME

    Abstract: Disclosed is a remote controller having a dual touch pad and a method of control using the same, the remote
    controller including a communication unit, a first touch pad, a second touch pad, an elastic layer, a position sensing
    unit, and a control unit. The first and second touch pads are installed adjacent to each other, and each have the elastic
    layer formed thereon, to output first and second selection signals, respectively, to control the control target device.
    The position sensing unit senses whether the first touch pad and the second touch pad are positioned in a longitudinal
    direction or in a traverse direction and outputs a third selection signal. The control unit receives at least one of the
    first to third selection signals from the first touch pad, the second touch pad, or the position sensing unit, and transmits
    a control signal to the control target device.'
  - 'Title: METHODS FOR IMPROVING SECUREMENT OF LABELS TO CONTAINERS

    Abstract: A method of forming a label for a container is provided. The method comprises extruding at least one layer to
    form the label, increasing the surface energy of the label, and securing the label to a container with an adhesive. The
    texture can be formed onto the label by embossing, chemically etching or exposing the label material to UV radiation.
    The texture helps improve the adhesion of the label to the container. In another example, the label can be provided with
    a primer or an EVA heat seal coating to improve the adhesion of the label to a container.'
  - 'Title: DISPOSABLE BIO-REACTOR SYSTEM

    Abstract: A disposable bioreactor system with a focus on improving cell culture technology by introducing a disposable
    bioreactor bag which operates or functions in conjunction with it unique mechanism of external non-rotating gyrating motion
    that uses gravity in a natural way to make the fluid flow circumferentially in it. The bioreactor is eminently suitable
    to won a variety of living cells and has the advantage of tangential flow to avoid clogging of filters.'
- source_sentence: 'Title: MOBILE THERMAL TREATMENT METHOD FOR PROCESSING ORGANIC MATERIAL

    Abstract: An integrated mobile thermal treatment system and method is disclosed for processing organic material. In a
    first mode of operation, the system includes all process components necessary to thermally treat organic material to achieve
    cell lysing and cell formation integrated in a common skid-assembled unit. In a second mode of operation, the system additionally
    includes pre-slurrying, pressurization, selective solids separation, and/or post-dewatering process components to minimize
    feed volume by pre-slurrying, deliver feed at the necessary treatment pressure, thermally treat organic material to achieve
    cell lysing and cell formation integrated in a separate or common skid-assembled unit, and produce a dewatered sludge
    cake suitable for disposal or use as a fertilizer of fuel.'
  sentences:
  - 'Title: FLASH COPY FOR DISASTER RECOVERY (DR) TESTING

    Abstract: In one embodiment, a system includes a processor and logic configured to create a backup copy of data stored
    to one or more production clusters and store the backup copy to one or more disaster recovery (DR) clusters. Moreover,
    the logic is configured to establish a time-zero in the DR family and create a snapshot of each backup copy stored to
    the one or more DR clusters. Each snapshot represents data stored to the one or more DR clusters at the time-zero, and
    each snapshot is a point-in-time flash copy of at least a user data portion of all virtual tapes of the one or more DR
    clusters with the proviso that the snapshot does not include a metadata portion of the virtual tapes. The logic is further
    configured to share a point-in-time data consistency at the time-zero among all clusters within the DR family.'
  - 'Title: APPARATUS AND METHOD FOR TREATING SLURRIES

    Abstract: An apparatus for treating slurries, in particular biogenic or industrial slurries, can include at least one
    treatment rotor which is arranged or can be arranged in the slurry and which rotates or is rotatable about an axis of
    rotation (R), with treatment elements which project outward, as seen from the axis of rotation (R), and between which
    interspaces are formed, at least some of the treatment elements having, at—at least one, preferably each—adjacent interspace,
    in each case at least one treatment edge, preferably at least two treatment edges spaced apart from one another, each
    of these treatment edges running from the inside outward, as seen from the axis of rotation. Methods for treating slurries
    are also disclosed, including methods using the apparatus for treating slurries.'
  - 'Title: MEDICAL SYSTEM AND CONTROL METHOD THEREFOR

    Abstract: Provided is a medical system including a first slave arm; a master arm having a joint configuration with a structure
    similar to that of a joint configuration of the first slave arm; a second slave arm; a manipulation-target switching unit
    that switches a manipulation target to be manipulated with the master arm between the slave arms; and a controller that
    is capable of switching between a first control mode and a second control mode in accordance with the joint configuration
    of the slave arm to be controlled. The first control mode is a mode for controlling rotation of joints of the first slave
    arm on the basis of rotation amounts of joints of the master arm. The second control mode is a mode for controlling rotation
    of joints of the second slave arm on the basis of a movement of a predetermined section of the master arm.'
- source_sentence: 'Title: SEMICONDUCTOR DEVICE WITH AT LEAST ONE TRUNCATED CORNER AND/OR SIDE CUT-OUT

    Abstract: A method of producing a substantially rectangular semiconductor device having at least one corner truncation
    or corner cut-out or side cut-out, comprises: a) providing a semiconductor substrate; b) making at least one opening through
    the substrate by means of etching; and c) cutting the substrate along a first pair of parallel lines, and along a second
    pair of parallel lines perpendicular to the first pair. At least one line of the first/second pair passes through said
    opening. Two lines may pass through said opening. More than one opening may be provided for said device. The opening may
    be located at a corner or on a side of the otherwise rectangular device. The etching may be any combination of existing
    isotropic/anisotropic front/back etching techniques.'
  sentences:
  - 'Title: PORTABLE ELECTRONIC DEVICE

    Abstract: A portable electronic device including a shell, a cover plate, a battery module, a heat generating element and
    a heat pipe. The shell includes an arc-shaped surface. The cover plate and the shell jointly define an accommodating space.
    The battery module is disposed in the accommodating space, and the battery module and the arc-shaped surface have a gap
    therebetween. The heat generating element is disposed in the accommodating space. The heat pipe is disposed in the gap
    and thermally coupled to the heat generating element. Moreover, the battery module also includes a stepped groove, and
    the heat pipe is disposed in the stepped groove.'
  - 'Title: SEMICONDUCTOR DEVICE MOUNTING METHOD

    Abstract: A first insulating film is applied onto a joining face of a semiconductor device including a connection terminal
    on a joining face, and the connection terminal is embedded inside the first insulating film. The second insulating film
    is formed on a joining target face of a joining target, which includes a connection target terminal on the joining target
    face, and the connection target terminal is embedded inside the second insulating film. The semiconductor device and the
    joining target are joined together by applying pressure and causing the semiconductor device and the joining target to
    make contact with each other.'
  - 'Title: Network Assisted Rate Adaptation

    Abstract: A network assisted rate adaptor (18) includes a rate controller (14) configured to determine a target rate based
    on at least one load measure of a radio cell obtained from a scheduler (12), and a rate enforcer (16) configured to enforce
    the target rate between a data source and a data destination over a shared radio link (10) in the radio cell.'
- source_sentence: 'Title: SYSTEMS, METHODS, AND MEDIA FOR MANAGING AN ENTERTAINMENT SYSTEM

    Abstract: Systems, methods, and media for managing an entertainment system are provided. In some implementations, systems
    for managing an entertainment system are provided, the systems comprising: at least one hardware processor configured
    to: detect a first instruction; select a component of the entertainment system; determine a first state of the component;
    store an indication of the first state; detect a second instruction; retrieve the indication of the first state; generate
    a third instruction based on the indication of the first state; and transmit the third instruction to the component of
    the entertainment system.'
  sentences:
  - 'Title: Remote Embedded Device Update Platform Apparatuses, Methods and Systems

    Abstract: The Remote Embedded Device Update Platform Apparatuses, Methods and Systems (“REDUP”) transforms telemetry inputs
    via REDUP components into remote embedded updates outputs. The REDUP may include a memory and processor with instructions
    to: obtain a remote embedded device connection request message from a remote embedded device and analyze the message to
    determine a version of embedded instructions on the remote embedded device. With that, the REDUP may determine if other
    remote embedded a devices similar to the remote embedded device have provided request messages by searching a remote embedded
    device connection request message database. This allows the REDUP to determine if a potential issue requiring updates
    on the remote embedded device exists. With that, the REDUP may determine and provide an update for the remote embedded
    device.'
  - 'Title: SEMICONDUCTOR DEVICE, METHOD FOR MANUFACTURING THE SAME, AND ELECTRONIC DEVICE

    Abstract: Disclosed herein is a semiconductor device including: a first semiconductor chip having an electronic circuit
    section and a first connecting section formed on one surface thereof; a second semiconductor chip having a second connecting
    section formed on one surface thereof, the second semiconductor chip being mounted on the first semiconductor chip with
    the first and the second connecting sections connected to each other by a bump; a dam formed to fill a gap between the
    first and the second semiconductor chips on a part of an outer edge of the second semiconductor chip, the part of the
    outer edge being on a side of a region of formation of the electronic circuit section; and an underfill resin layer filled
    into the gap, protrusion of the resin layer from the outer edge of the second semiconductor chip to a side of the electronic
    circuit section being prevented by the dam.'
  - 'Title: SIMULTANEOUS VIDEO STREAMING ACROSS MULTIPLE CHANNELS

    Abstract: Methods and systems for a media controller subsystem that can provide video streaming using a distributed network
    control server, media server, and virtual network console on a common processing or circuit board and filter and apply
    restrictions to media content based on one or more of the identity of the vehicle occupant requesting media content, the
    identity of a portable computational device associated with the vehicle occupant, and the spatial location of the vehicle
    occupant and/or remote computational device.'
