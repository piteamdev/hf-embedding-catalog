    \ credit report. \n\nXXXX. Charged Off Disputed The following accounts are incorrectly reported and I request verification\
    \ or removal : XXXX  XXXX, Acct # : XXXX, Date Open : XX/XX/XXXX, Balance : {$570.00} XXXX  XXXX, Acct # : XXXX, Date\
    \ Open : XX/XX/XXXX, Balance : {$2500.00} XXXX, Acct # : XXXX, Date Open : XX/XX/XXXX, Balance : {$2600.00} XXXX XXXX\
    \  XXXX, Acct # : XXXX, Date Open : XX/XX/XXXX, Balance : {$0.00} XXXX. Inquiries Disputed There are no disputed inquiries\
    \ on my TransUnion report at this time. \n\nXXXX. Positive Accounts There are no issues with positive accounts at this\
    \ time. \n\nXXXX. Late Payment Disputed The following late payments need to be verified or removed : XXXX  XXXX, Acct\
    \ # : XXXX XXXX  XXXX XXXX, Acct # : XXXX XXXX  XXXX, Acct # : XXXX XXXX XXXX XXXX, Acct # : XXXX"
  sentences:
  - It was not disclosed that I would not receive a refund if or when the money transfer went to the wrong person.
  - "I am submitting this complaint to dispute inaccurate and incomplete information on my TransUnion credit report. \n\n\
    Charged-Off Accounts I dispute the following accounts : XXXX XXXX Acct XXXX ( XX/XX/XXXX, balance {$0.00} ) XXXX  XXXX\
    \ Acct XXXX ( XX/XX/XXXX, balance {$1200.00} ) XXXX XXXX Acct XXXX ( XX/XX/XXXX, balance {$1000.00} ) These accounts may\
    \ be inaccurately reported or negatively affecting my credit. I request TransUnion verify balances, reporting dates, and\
    \ account status, and remove or correct any information that can not be substantiated. \n\nLate Payments XXXX  XXXX XXXX\
    \ Acct XXXX I dispute this late payment and request correction or removal."
  - "Subject : DEMAND FOR IMMEDIATE REMOVAL OF INACCURATE BANKRUPTCY FCRA VIOLATIONS To Whom It May Concern, I am writing\
    \ to formally dispute the bankruptcy reporting on my TransUnion credit report. I have never filed for bankruptcy, and\
    \ the U.S. Bankruptcy Court in Los Angeles has confirmed this. This inaccurate reporting is a clear violation of the Fair\
    \ Credit Reporting Act ( FCRA ) and must be removed immediately.\n\nDetails of the Disputed Bankruptcy Bankruptcy Court\
    \ : U.S. Bankruptcy Court, Los Angeles County Filed Under : XXXX XXXX ( Incorrectly Assigned ) Case Number : XXXX Supporting\
    \ Evidence Included A written confirmation from the U.S. Bankruptcy Court Clerk, Aarron, confirming that I have never\
    \ filed for bankruptcy. \n\nCopies of my XXXX and XXXX credit reports, which do NOT show any bankruptcy. \n\nFCRA VIOLATIONS\
    \ BY TRANSUNION 1. FCRA 1681e ( b ) Failure to Maintain Maximum Possible Accuracy TransUnion has a legal duty to ensure\
    \ all reported information is accurate. Reporting a bankruptcy that does not belong to me is a direct violation.\n\n2.\
    \ FCRA 1681i ( a ) ( 1 ) ( A ) Inclusion of False Information The U.S. Bankruptcy Court does not report to credit bureaus.\
    \ TransUnion is reporting incorrect information obtained from a third-party source, violating federal law. \n\n3. FCRA\
    \ 1681i ( a ) ( 5 ) Failure to Properly Reinvestigate If TransUnion previously \" verified '' this bankruptcy, it failed\
    \ to conduct a proper reinvestigation, making the reporting unlawful.\n\n4. FCRA 1681g ( a ) ( 2 ) Failure to Disclose\
    \ Source of Information I am demanding that TransUnion provide the exact source of this bankruptcy record. If it can not\
    \ be verified with official court documentation, it must be deleted immediately.\n\n5. FCRA 1681c ( a ) ( 1 ) Mixed File\
    \ Error The U.S. Bankruptcy Court confirmed that multiple individuals with the name \" XXXX XXXX '' have filed for bankruptcy.\
    \ This is a clear mixed file violation, and the inaccurate bankruptcy must be deleted immediately. \n\nDEMAND FOR IMMEDIATE\
    \ ACTION XXXX. I am formally demanding that TransUnion : XXXX. Immediately delete the inaccurate bankruptcy from my credit\
    \ report. \n\nXXXX. Provide written confirmation that this bankruptcy has been permanently removed. \n\nDisclose the exact\
    \ source of this incorrect information. \n\nFailure to comply within 30 days will result in formal complaints to the CFPB,\
    \ FTC, and California Attorney General for willful FCRA violations. Additionally, I reserve the right to pursue legal\
    \ action for damages under FCRA 1681n, which allows for statutory damages of up to {$1000.00} per violation, plus attorney\
    \ fees. \n\nThis is my final notice. If TransUnion can not provide court-verified proof of this bankruptcy, it must be\
    \ removed immediately. \n\nSincerely, XXXX XXXX XXXX"
- source_sentence: Hello, I have been trying to contact Rubin and Rothman LLC regarding a debt that I would like to resolve,
    I called them and they hung up on me three times, I have also been emailing asking if they could help me and have noted
    that when I asked to speak to someone about settling/resolving my debt I was hung up on. I have not been able to get through
    to anyone which is alarming because they are trying to sue me, I'd expect them to want to work with me to give them my
    money.
