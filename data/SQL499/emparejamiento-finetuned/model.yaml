  - 'Asesor de Cobranzas. Sector: Banca/Finanzas/Seguros. Ocupacion: asesor de contact center/ asesora de contact center.
    Competencias: asistir a clientes; comunicarse por teléfono; contactar a los clientes por teléfono; servicio al cliente'
- source_sentence: 'Formacion: Contabilidad Computarizada (1 Ciclo). Experiencia: Elaboración de reportes de los ingresos
    y egresos diarios.. Elaboración, Presentación del PDT 621 y PDT 601 mensual.. Ingreso de Compras, Ventas en el Sistema
    Contable Siscont, validando la documentación que sustenta al costo y gasto.. Llenado de los libros contables de las empresas
    comerciales y servicios.. Realizar carta de control durante el examen de auditoria financiera y tributaria en la etapa
    preliminar.. Registrar asientos contables, provisiones, ajustes, reclasificaciones y cierres.. Registrar y analizar las
    provisiones, pl'
  sentences:
  - 'CONTADORA. Sector: Seguridad. Ocupacion: contable/contador/contadora. Competencias: Normas Internacionales de Información
    Financiera; amortización; analizar el rendimiento financiero de una empresa; asesorar sobre asuntos financieros; asesorar
    sobre la gestión del riesgo; asientos contables; ayudar al desarrollo del presupuesto anual; calcular costes de producción;
    calcular impuestos; colaborar con los auditores; comprobar el calendario de producción; consultar con el director de producción;
    consultar con el productor; cumplir las obligaciones estatutarias; detección del fraude; detectar errores contables; difundir
