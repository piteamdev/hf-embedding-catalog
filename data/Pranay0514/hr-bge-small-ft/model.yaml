      disobedience of company policy are not eligible. In the event of death or permanent disablement, the employee’s nominee
      is entitled to receive the gratuity as per the Act. The company reserves the right to amend or suspend this policy in
      line with statutory changes.
    - 'Employees are eligible for Privilege (Earned) Leave after completing a continuous minimum of 12 months of service.
      Accrual is calculated on a pro‑rated basis at 1.25 days per month, equivalent to 15 days per calendar year. Accrued
      leave may be taken after the 12th month and can be applied for in 5‑day increments. The maximum leave that can be accrued
      and carried forward into the next calendar year is capped at 5 days. Unused leave beyond this limit will be forfeited
      at year‑end. Leave can be utilized for personal, family, or health reasons, subject to prior approval from the employee’s
      immediate supervisor and HR. Exceptions to accrual rules include: (i) Medical emergency leave as per the company’s Medical
      Leave Policy; (ii) Maternity leave of 12 weeks and paternity leave of 5 days; (iii) Bereavement leave of up to 3 days;
      and (iv) Unpaid leave in cases of disciplinary action or resignation. Employees on contractual or probationary status
      are not eligible for earned leave until the completion of the probation period.'
