- source_sentence: who regulates the stock exchange in this fictional country
  sentences:
  - 'syn-country-korvatia

    SYNTHETIC — Korvatia, a fictional European-style country, regions and a contested overseas territory

    Korvatia has 14 mainland regions and one contested overseas territory, Maren Island, currently in a decades-long independence-referendum
    process. Korvatia''s regions each elect their own assembly, with the national government retaining control over defense
    and foreign affairs.


    **Why this matters**: fictional analog to a real European-style country-mapping note, including a contested-territory
    subplot.'
  - 'syn-velmoria-securities-commission

    SYNTHETIC — Velmoria Securities Commission, the fictional regulator overseeing the national stock exchange

    The Velmoria Securities Commission licenses brokers, enforces disclosure rules for listed companies, and oversees the
    Velmoria Exchange. It gained expanded enforcement powers after a 2016 market-manipulation scandal involving a mid-cap
    logistics firm.


    **Why this matters**: fictional analog to a real securities regulator note.'
  - 'syn-velmoria-national-trust

    SYNTHETIC — the Velmoria National Trust, a fictional sovereign investment fund seeded by resource royalties

    The Velmoria National Trust was seeded in 1985 from offshore gas royalties and now manages a diversified portfolio across
    infrastructure, equities, and provincial development projects. It is legally separate from the annual government budget,
    a deliberate design choice to prevent short-term raiding of long-term savings.


    **Why this matters**: fictional analog to a real sovereign-wealth-style fund note.'
- source_sentence: when is the annual report due and who audits it
  sentences:
  - 'syn-annual-report-deadline

    SYNTHETIC EXAMPLE — the fictional company''s annual report deadline and which external auditor signs off

    The annual report is due to the fictional regulator by March 31st each year; the external auditor (a fictional firm, Kestrel
    & Boyd) needs the draft financials four weeks earlier to complete sign-off in time.


    **Why this matters**: a recurring compliance deadline with a real external dependency (the auditor''s own lead time),
    the kind of fact that''s costly to forget.'
  - 'syn-velmoria-securities-commission

    SYNTHETIC — Velmoria Securities Commission, the fictional regulator overseeing the national stock exchange

    The Velmoria Securities Commission licenses brokers, enforces disclosure rules for listed companies, and oversees the
    Velmoria Exchange. It gained expanded enforcement powers after a 2016 market-manipulation scandal involving a mid-cap
    logistics firm.


    **Why this matters**: fictional analog to a real securities regulator note.'
  - 'example-quarterly-board-deck-deadline

    SYNTHETIC EXAMPLE — a recurring quarterly board-deck deadline and who owns which section

    The quarterly board deck is due the first Monday of the new quarter. Finance owns the numbers section, product owns the
    roadmap slide, and the fictional CEO persona in this example always wants the risks slide reviewed by legal before it
    goes to the board, not after.


    **Why this matters**: recurring institutional deadlines with named owners are exactly what should live in permanent memory
    rather than being re-explained every quarter.'
