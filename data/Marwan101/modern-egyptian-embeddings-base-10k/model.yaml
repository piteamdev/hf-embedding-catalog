widgetData:
- source_sentence: مبادرة إحلال السيارات القديمة وتخريد التاكسي والملاكي بسيارات جديدة زيرو
  sentences:
  - صيانة فتيس السيارة الأوتوماتيك CVT وال Dual-Clutch تتطلب استخدام الزيت الموصى به بدليل المصنع وتغييره كل 40 إلى 60 ألف
    كيلومتر لتفادي النتشة وارتفاع الحرارة.
  - cng_gas_conversion_initiative
  - لتحويل سيارتك الملاكي للعمل بالغاز الطبيعي (نظام وقود مزدوج غاز/بنزين)، توجه لأحد مراكز شركتي غازتك (Gastec) أو كارجاس
    (Cargas) ومعه بطاقة الرقم القومي ورخصة السيارة سارية. يتم فحص المحرك والتأكد من كفاءته بنسبة لا تقل عن 70%، ويتم التركيب
    خلال 4 ساعات بتكلفة تتراوح بين 11 ألف إلى 14 ألف جنيه (حسب سعة الأسطوانة ونوع الدائرة) بنظم تقسيط ميسرة على فاتورة الغاز
    أو الكارت دون فوائد. يوفر الغاز الطبيعي أكثر من 55% من تكلفة استهلاك البنزين وتمنح شهادة مطابقة للمرور لإثباتها بالرخصة.
  - automotive_maintenance
- source_sentence: عايز أسأل شروط نقل الرقم بين شركات المحمول في مصر والمدة بتاخد كام يوم بالظبط؟
  sentences:
  - تفعيل خدمات الجيل الخامس 5G لا يتطلب تغيير شريحة الموبايل إذا كانت تدعم 4G بالفعل، ولكن يتطلب وجود هاتف ذكي يدعم ترددات
    5G وتواجد العميل في نطاق التغطية الجغرافية للشبكة.
  - mobile_number_portability_mnp
  - لنقل رقم موبايلك من شبكة لأخرى محتفظاً بنفس الرقم (MNP)، يشترط أن يكون الخط مسجلاً ببطاقتك الشخصية ومضى على تفعيله في
    شبكتك الحالية 4 أشهر على الأقل، وسداد آخر فاتورة صادرة (إذا كنت نظام فاتورة) وتصفية محفظة الكاش وإلغاؤها قبل النقل. توجه
    لفرع الشركة الجديدة ببطاقتك وقدم طلب النقل؛ تستلم الشريحة الجديدة وتتفعل قانوناً خلال 24 ساعة عمل بحد أقصى طبقاً لتعليمات
    الجهاز القومي لتنظيم الاتصالات (NTRA)، والرصيد القديم لا ينتقل للشريحة الجديدة.
  - telecom_internet
- source_sentence: معلش سؤال رسوم استخراج شريحة موبايل بدل فاقد في فودافون وأورانج واتصالات
  sentences:
  - لاستخراج شريحة بدل فاقد، يلزم توجه صاحب الخط بنفسه لأي فرع رسمي للشركة ومعه أصل بطاقة الرقم القومي السارية، ورسوم استخراج
    الشريحة حوالي 5 إلى 10 جنيهات وتعمل خلال 30 دقيقة بنفس رصيدك ورقمك القديم. أما إذا كان الخط غير مسجل باسمك، فيلزم إثبات
    ملكيتك الحيازية عبر تقديم الشريحة القديمة أو البلاستيكة الحاملة لكود PUK، وتقديم آخر 3 كروت شحن تم استخدامها، وأرقام تواصل
    متبادلة حديثاً لإمضاء عقد ملكية رسمي.
  - sim_replacement_unregistered_line
  - طبقاً لتعليمات الجهاز القومي لتنظيم الاتصالات، يحق للمواطن امتلاك 5 خطوط صوتية كحد أقصى مسجلة باسمه بالرقم القومي على
    شبكة المحمول الواحدة للحد من الخطوط العشوائية.
  - telecom_internet
- source_sentence: بطاقة التموين موقوفة وكاتبة بطاقة غير صالحة في ماكينة الصرف بالله عليكم
  sentences:
  - digital_egypt_tamween_card_replace
  - لاستخراج بدل تالف أو فاقد لبطاقة التموين عبر بوابة 'مصر الرقمية' (digital.gov.eg)، سجل حسابك بالرقم القومي ورقم موبايل
    مسجل باسمك في شركة الاتصالات، ثم اختر 'خدمات التموين' ثم 'إصدار بدل تالف أو فاقد لبطاقة تموين'. راجع بياناتك واختر طريقة
    الاستلام سواء عبر مكتب التموين أو التوصيل بالبريد لمنزلك مقابل 23.5 جنيهاً؛ وفور استلام البطاقة، أرسل رسالة نصية بالرقم
    1 إلى الرقم 91237 من هاتفك المسجل لتفعيل البطاقة واستلام الرقم السري.
  - لتحديث رقم الموبايل المسجل على بطاقة التموين، بتدخل على موقع 'دعم مصر' وتكتب رقم البطاقة التموينية ورقم تليفون محمول مسجل
    في شركة الاتصالات باسم رب الأسرة صاحب البطاقة لتجنب وقف صرف السلع.
  - government_services
- source_sentence: إلغاء اشتراك ألعاب ومواقع مسابقات بتسحب من فاتورة التليفون
  sentences:
  - cancel_entertainment_subscriptions_155
  - شحن كروت المحمول يخضع لضريبة القيمة المضافة ورسم التنمية، حيث يعطي كارت فئة 10 جنيهات رصيداً صافياً بقيمة 7 جنيهات للمكالمات
    والإنترنت.
  - telecom_internet
  - لو رصيدك بيتخصم تلقائياً بدون مكالمات، اطلب الكود المجاني الموحد الصادر من الجهاز القومي لتنظيم الاتصالات *155# (نجمة
    155 شباك)؛ واختر اللغة العربية، وستظهر لك قائمة بجميع الخدمات الترفيهية والإخبارية والكول تون والمسابقات المشترك فيها
    خطك مع إمكانية إلغائها جميعاً مجاناً بضغطة واحدة فوراً لضمان عدم سحب أي رصيد مستقبلاً.
