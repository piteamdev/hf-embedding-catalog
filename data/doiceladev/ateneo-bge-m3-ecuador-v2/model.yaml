    3. Preguntas que responde esta guía de práctica clínica


    Prevención primaria


    1. ¿Cuáles son los factores de riesgo (iniciadores, de progresión, modificables y no modificables) de enfermedad renal
    crónica?


    Sospecha y diagnóstico


