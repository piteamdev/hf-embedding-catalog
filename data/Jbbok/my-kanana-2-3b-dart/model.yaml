- source_sentence: 네이버는 상각후원가로 측정하는 기타금융자산의 신용위험을 어떻게 판단하고 손실충당금을 어떻게 인식하나요?
  sentences:
  - '네이버(주) | 사업보고서 | 2025-12-31


    (*) 연결범위 변동으로 인한 증감 등을 포함하고 있습니다


    상각후원가로 측정하는 기타금융자산은 모두 신용위험이 낮은 것으로 판단되며, 따라서 손실충당금은 12개월 기대신용손실로 인식하였습니다. 연결회사는 채무불이행위험이 낮고 단기간 내에 계약상 현금흐름을 지급할 수 있는
    발행자의 충분한 능력이있는 경우 신용위험이 낮은 것으로 간주합니다.


    (다) 기타포괄손익-공정가치로 측정하는 채무상품


    기타포괄손익-공정가치로 측정하는 채무상품은 회사채이며, 기타포괄손익-공정가치로 측정하는 채무상품의 손실충당금은 당기손익에 인식되고 공정가치평가손실로 기타포괄손익에 인식되었을 금액을 감소시킵니다.


    당기 및 전기 중 기타포괄손익-공정가치로 측정하는 채무상품에 대한 손실충당금의 변동은 없습니다.'
  - '네이버(주) | 사업보고서 | 2025-12-31


    - 기업회계기준서 제1021호 ''환율변동효과'' 개정


    이 개정사항은 외환시장이 정상적으로 작동하지 않을 때 기능통화에 의한 외화거래 보고와 해외사업장의 기능통화를 지배기업의 표시통화로 환산하는 규정을 명확히 하기 위해, 두 통화간 교환가능성을 평가하는 규정을 추가합니다.
    또한, 두 통화간 교환이 가능한지를 평가하여 교환가능성이 결여되었다고 판단한 경우, 적용할 현물환율을 추정하는 규정을 추가하였습니다. 해당 기준서의 개정으로 인하여 재무제표에 미치는 유의적인 영향은 없습니다.


    (2) 회사가 적용하지 않은 제ㆍ개정 기준서


    제정 또는 공표됐으나 2025년 1월 1일 이후 시작하는 회계연도에 시행일이 도래하지않았고, 회사가 조기 적용하지 않은 주요 제ㆍ개정 기준서는 다음과 같습니다.


    - 기업회계기준서 제1109호 ''금융상품'', 제1107호 ''금융상품: 공시'' 개정'
