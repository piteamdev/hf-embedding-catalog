- source_sentence: what does the fictional central bank actually do
  sentences:
  - 'syn-velmoria-energy-commission

    SYNTHETIC — Velmoria Energy Regulatory Commission, the fictional body that licenses electricity and gas providers

    The Velmoria Energy Regulatory Commission licenses electricity and gas providers, sets transmission tariffs, and oversees
    the Grid Authority''s compliance with the 2045 net-zero commitment. It is independent of the Ministry of Energy by statute,
    though its commissioners are ministry-appointed.


    **Why this matters**: fictional analog to a real energy regulator note.'
  - 'syn-country-astrelle

    SYNTHETIC — Astrelle, a fictional G7-style country, provinces and federal structure mapped

    Astrelle is a fictional federal country with nine provinces and two autonomous territories. Its federal parliament sits
    in the capital, Norvann, and each province retains control over education and healthcare policy, mirroring a real-world
    federal/provincial split.


    **Why this matters**: fictional analog to a real G7-style country-mapping note.'
  - 'syn-velmoria-central-reserve

    SYNTHETIC — the Velmoria Central Reserve, the fictional nation''s central bank

    The Velmoria Central Reserve sets the benchmark interest rate, supervises retail banks, and manages the provincial currency
    peg. Its governor is appointed for a seven-year term, deliberately longer than the Prime Minister''s electoral cycle to
    insulate monetary policy from short-term politics.


    **Why this matters**: fictional analog to a real central-bank note.'
