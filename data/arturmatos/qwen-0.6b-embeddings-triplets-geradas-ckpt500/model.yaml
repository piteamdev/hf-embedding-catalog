- source_sentence: Por que a corrente de inrush de um transformador é menor quando ele já está em carga?
  sentences:
  - A análise da proteção diferencial para transformadores de dois enrolamentos é essencial para entender o comportamento
    das correntes no sistema. Conforme as equações que definem Isec1 e Isec2, a corrente secundária de cada TC é obtida subtraindo-se
    a corrente de excitação da corrente primária refletida. Em cenários onde ocorre uma falta externa próxima ao transformador,
    a eliminação dessa falta faz com que a tensão nos terminais varie de um patamar baixo para um valor pós-falta próximo
    ao nominal. Esse fenômeno gera correntes de inrush, assim como ocorre na energização de transformadores em paralelo. Nessas
    condições, o transformador de corrente (TC) pode apresentar erros, representados pela diferença entre Isec1 e Isec2, resultando
    em uma corrente de erro que percorre o circuito do relé diferencial. O equilíbrio dessas correntes é fundamental para
    o funcionamento dos principais tipos de relés de proteção de equipamentos de geração e transmissão, focando no casamento
    das relações de transformação RTC1 e RTC2.
  - 'Quando o GCOI surgiu, os sistemas do Sul e do Sudeste eram interligados por uma linha muito fraca de 230 kV que saía
    de Assis (SP) para o Sul, região cujo sistema também era fraco em termos de interligações. Hoje, com a instalação de Itaipu,
    Sudeste e Sul praticamente constitu-em um único sistema pela força da sua interligação. Embora já se tenha demonstrado
    a impor-tância do GCOI para o setor elétrico nacional, citarei mais duas justificativas. Em primeiro lugar, a operação
    de enchimento do reservatório de Itaipu, quando seria preciso fechar totalmente o rio Paraná, com possibilidade de graves
    reflexos nos lados argentino e uruguaio. Coordenada pelo GCOI, esta operação utilizou os reservatórios da região Sudeste
    para acelerar o enchi-mento do reservatório de Itaipu, e o Paraná acabou ficando fechado por poucos dias apenas. '
  - '| 3º            | 9,4             | 9,6                | 18,2                                  | 31                                    |

    | 4º            | 5,4             | 1,6                | 6,5                                   | 18                                    |

    | 5º            | -               | 0,7                | 7,2                                   | 11,4                                  |


    Na ocorrência de uma falta externa próxima ao transformador, quando da sua elimina-

    ção, a tensão nos terminais do mesmo varia de um valor de falta (valor baixo) para um valor

    pós-falta (próximo ao nominal), produzindo um efeito similar àquele que ocorre durante a

    energização do transformador. Porém, de menor amplitude, visto que, sob essa condição, o

    transformador permanece em carga, o que amortece o efeito do *inrush*.


    A energização de um transformador em paralelo a um transformador em operação pro-

    voca, neste último, uma corrente de *inrush*, cuja amplitude, como no caso anterior, não é tão

    elevada, em função do transformador já se encontrar em carga.


    ### 3.4.2.3 – Erros dos transformadores de corrente


    A figura 3.28 apresenta uma ligação típica de uma proteção diferencial para transformado-

    res de dois enrolamentos, utilizada para caracterizar o problema dos erros dos TCs.

    68 | Principais tipos de relés de proteção


    $$

    I_{SEC1} = \frac{IP_1}{RTC_1} - I_{EXC1}

    $$


    $$

    I_{SEC2} = \frac{IP_2}{RTC_2} - I_{EXC2}

    $$


    $$

    N_1 * IP_1 = N_2 * IP_2

    $$


    $$

    IP_2 = \frac{N_1}{N_2} * IP_1

    $$


    Em condições normais de operação:


    $$

    I_{SEC1} = I_{SEC2}

    $$


    $$

    \frac{IP_1}{RTC_1} - I_{EXC1} = \frac{IP_2}{RTC_2} - I_{EXC2}

    $$


    $$

    \frac{IP_1}{RTC_1} - I_{EXC1} = \frac{N_1}{N_2} * \frac{IP_1}{RTC_1} - I_{EXC2}

    $$


    Figura 3.28 – Ligação de proteção diferencial em transformadores de dois enrolamentos


    A corrente secundária do TC1, Isec1, é a diferença entre a corrente primária refletida para o secundário do TC1 e a corrente
    de excitação do TC1, Iexc1, ou seja:


    $$

    Isec1 = \left(\frac{Ip1}{RTC1}\right) - Iexc1

    $$


    A corrente secundária do TC2, Isec2, é a diferença entre a corrente primária refletida para o secundário do TC2 e a corrente
    de excitação do TC2, Iexc2, ou seja:


    $$

    Isec2 = \left(\frac{Ip2}{RTC2}\right) - Iexc2

    $$


    A corrente de erro ($\Delta I$) que irá circular no circuito de operação do relé diferencial em condições normais de operação
    é:


    $$

    \Delta I = Isec1 - Isec2 = \left(\left(\frac{Ip1}{RTC1}\right) - Iexc1\right) - \left(\left(\frac{Ip2}{RTC2}\right) -
    Iexc2\right)

    $$


    Se for feito o casamento perfeito entre as relações de transformação dos TCs nos dois lados do transformador, teremos:


    $$

    \frac{Ip1}{RTC1} = \frac{Ip2}{RTC2}

    $$

    Equipamentos de Geração e Transmissão | 69


    De modo que:

    $$ \Delta I = Isec1 – Isec2 = \left(\left(\frac{Ip1}{RTC1}\right) - Iexc1\right) - \left(\left(\frac{Ip2}{RTC2}\right)
    - Iexc2\right) = Iexc2 - Iexc1 $$


