    【在校學長姐解答與經驗建議】：

    資工 圖片；土環 延期了，明天中午才會公布；農藝30 再請一次0903的


    【備註】：本解答彙整自中興大學新生大群學長姐社群即時答覆，具體行政流程請以學校各處室官方公告為準。'
  - 特約點心-G惡熊脆皮雞蛋糕 (95折與團購優惠)：位於西區中美街298號。出示學生證享 95 折，社團及系學會團體訂購另享專案特惠。
  - 名師推薦-國際政治研究所 廖舜右教授：【法政學院國政所 廖舜右教授】：廖舜右教授任教於國立中興大學國際政治研究所，專長為國際政治經濟學、亞太區域經濟整合、日本政經、美中台大國博弈關係分析。廖教授為國內各大智庫與媒體深入剖析國際局勢之重要權威學者，學養深厚且授課深入淺出、幽默風趣，長期榮獲中興大學「教學特優教師」肯定，深受研究生與修課學生愛戴與推崇。
- source_sentence: 請問中興大學的僑生宿舍相關規定或資訊？
  sentences:
  - "境外學生校內住宿申請與居留證住宿證明開立：【僑生與外籍新生校內住宿及行政證明申請】：\n• **大一新生住宿保障**：境外大一新生（僑生、外籍生）原則上均保障提供校內宿舍（男生二村、女生樸誠勤齋）。\n• **申辦居留證之住宿證明**：\n\
    \  辦理外僑居留證 (ARC) 需檢附居住地證明。住校生請於完成入住報到後，至學務處住宿輔導組（雲平樓1F或各棟服務中心）申請開立「校內宿舍住宿證明」作為上傳附件。"
  - '新生實戰QA-應數 不好意思想問選課同一個科目名稱但不同老師跟時：【大一新生群真實提問】：應數 不好意思想問選課同一個科目名稱但不同老師跟時段的都選有可能中兩次嗎 還是只會中一個


    【在校學長姐解答與經驗建議】：

    那主修什麼時候選；會計30 必修嗎？；會計30 圖片


    【備註】：本解答彙整自中興大學新生大群學長姐社群即時答覆，具體行政流程請以學校各處室官方公告為準。'
  - "校園資安防護-AI嚴禁代為登入個人校務系統與查詢床位成績：【重要資安防護與個人資料保護聲明：AI 助手嚴禁且無法代表學生登入校務系統】\n\n1. **AI 無法代為登入個人系統**：AI 學長姐助手為校園公開資訊指引工具，為確保同學個人隱私、帳號與機密資料安全，**本系統絕對不會、也嚴格禁止索取密碼或代表任何同學登入學校個人系統**！請切勿在對話框中輸入您的學號、密碼或身分證字號。\n\
    2. **查詢個人床位與宿舍申請**：請同學親自前往【國立中興大學單一入口 Portal】（https://portal.nchu.edu.tw/）使用個人學號與密碼登入，點選「學生宿舍管理系統」查詢個人床位分發結果。若對床位或入住流程有疑問，請洽詢【學生住宿輔導組】（https://www.osa.nchu.edu.tw/osa/dorm/）：\n\
    \   • 男宿服務中心：04-22840473（男宿二村）\n   • 女宿服務中心：04-22840612（女宿誠軒/勤軒/樸軒）\n3. **查詢學期成績與選課課表**：請至【興大單一入口 Portal】（https://portal.nchu.edu.tw/）登入「教務資訊系統」進行查詢。"
- source_sentence: 請問中興大學的外文相關規定或資訊？
  sentences:
  - 校園水域垂釣禁令澄清-中興湖絕對禁止釣魚 (康堤可垂釣)：【中興湖生態保育規範-嚴禁垂釣】：請全體新生特別注意！中興大學校內著名的「中興湖」為校園核心人工生態教育與景觀景點，棲息有黑天鵝、綠頭鴨、鱸鰻與眾多本土水生生物，【校內中興湖絕對嚴禁私自垂釣、撒網捕魚或放生任何生物】！違者將由駐警隊依校規嚴厲取締。若想體驗釣魚，請選修吳政憲教授之「康堤釣魚趣」通識課，或自行前往校外旱溪「康堤」之合法親水垂釣專區活動。
  - '新生實戰QA-外文 請問有人知道通識普化 林柏亨老師，和正課會有：【大一新生群真實提問】：外文 請問有人知道通識普化 林柏亨老師，和正課會有什麼差別嗎？下學期也會有普化二可以選嗎？


    【在校學長姐解答與經驗建議】：

    農藝30 如果你普化是一學年下學期就有課；農藝30 通識應該都是一學期 我們系選修也是一學期上完普化；動科10 有等驗證成功嗎？


    【備註】：本解答彙整自中興大學新生大群學長姐社群即時答覆，具體行政流程請以學校各處室官方公告為準。'
  - 系群-昆蟲系：昆蟲系社群「！中興昆蟲！」：https://line.me/ti/g2/S50K6hcbq2A2L_bOaZoxex09pobFM1TmRZoYQQ
