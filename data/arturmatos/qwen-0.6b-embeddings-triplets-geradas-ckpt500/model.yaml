- source_sentence: Por que a Cemig recebeu multa em vez de advertência por atrasos na ligação de microgeração?
  sentences:
  - 'advertência, pois ainda que a empresa atenda ao requisito objetivo (art. 8º, I, da REN nº 63, de 2004)¹², a

    infração não se enquadra como de pequeno potencial ofensivo (art. 8º, II, da REN nº 63, de 2004).


    23. É certo que a inobservância do cumprimento dos prazos para ligação de micro e

    minigeração distribuídas implica mitigação do direito de acesso dos consumidores à rede de distribuição,

    o que propicia insatisfação e/ou prejuízos, atingindo 35% (trinta e cinco por cento) do universo de pedidos

    de acessos à rede de distribuição da CEMIG D (70 casos entre 200 da amostra), o que também afasta a

    possibilidade, em concreto, de conversão de multa em advertência.


    ## Não Conformidades NC.2


    24. A NC.2 decorre do fato de a CEMIG D não assegurar o atendimento de futura demanda de

    seu mercado de energia elétrica, o que contraria os termos da Cláusula Quarta dos Contratos de

    Concessão nºs 002, 003, 004 e 005, todos de 1997¹³.


    '
  - Para a aplicação das penalidades à CEMIG D, considerou-se o atendimento ao requisito objetivo do artigo 8º, inciso I,
    da REN nº 63 de 2004. Verificou-se que a gestão do universo de pedidos de acesso à rede de micro e minigeração distribuída
    abrangeu 35% da amostra coletada (70 casos em 200), o que serviu de base para a análise técnica da NC.2. Essa não conformidade
    está vinculada ao descumprimento da Cláusula Quarta dos Contratos de Concessão nºs 002, 003, 004 e 005 de 1997, que obriga
    a distribuidora a assegurar o atendimento de toda a demanda futura de energia elétrica em seu mercado. Assim, a aplicação
    da sanção decorre da necessidade de garantir a estabilidade contratual e o cumprimento das normas de acesso à rede de
    distribuição, conforme os parâmetros estabelecidos para o mercado de energia sob a concessão da empresa.
  - '39. Compulsando os autos, verifica-se que a SFE realizou escorreita motivação do ato administrativo punitivo, tendo rigorosamente
    fundamentado as condicionantes da penalidade (art. 15 da REN nº 63, de 2004), além de ter fixado percentuais razoáveis
    e proporcionais ao caráter de desestímulo inerente às sanções regulatórias e, assim, mantém-se a multa aplicada.


    40. Adicionalmente, apresente-se que a SFE diligentemente ponderou condutas envidadas pela Recorrente e tendentes ao restabelecimento
    da conformidade regulatória para efeito de redução do percentual anteriormente adotado quanto à condicionante “gravidade”
    da infração, o que implicou sensível diminuição do valor total da multa, sem se perder o foco de razoabilidade e proporcionalidade
    dos processos administrativos sancionadores.


    41. Reitere-se que, consoante abordado ao longo do Voto, e endossando também as manifestações da SFE e da PF/ANEEL, corroboro
    com as conclusões de impossibilidade de conversão das


