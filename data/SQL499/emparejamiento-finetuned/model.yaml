  sentences:
  - 'INGENIERO DE PLANEAMIENTO. Sector: Construcción. Ocupacion: especialista en ordenación territorial/especialista en planeamiento
    de territorio. Competencias: asesorar sobre temas de arquitectura; asesorar sobre temas de construcción; comparar cálculos
    de estudios; ingeniería civil; principios de ingeniería; procesar datos topográficos recabados; proporcionar experiencia
    técnica; realizar cálculos de agrimensura; realizar levantamientos topográficos; reglamentos de construcción; reunir datos
    de un sistema de información geográfica; reunir datos mediante el sistema de posicionamiento global; sistemas de información
    geográfica; topografía'
  - 'Analista programador (Técnico en Computación e Informática). Sector: Banca/Finanzas/Seguros. Ocupacion: desarrollador
    de bases de datos/desarrolladora de bases de datos. Competencias: crear soluciones para problemas; identificar requisitos
    del cliente; integrar componentes del sistema; recopilar opiniones de clientes sobre aplicaciones'
  - 'Especialista de Pre-Inversión - Lima. Sector: Servicios. Ocupacion: gestor de proyectos/ gestora de proyectos. Competencias:
    evaluar planes de proyectos; gestionar la información de proyectos; gestionar varios proyectos; realizar planificación
    de recursos; utilizar economía de escala en proyectos'
