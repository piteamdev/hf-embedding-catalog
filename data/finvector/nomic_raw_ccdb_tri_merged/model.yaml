  - I am filing a complaint because my bank failed to properly investigate unauthorized transactions on my XXXX XXXX Card
    and did not follow the requirements of the Electronic Fund Transfer Act ( EFTA ) and Regulation E. Two transactionsone
    for {$350.00} and another for XXXX XXXXwere made without my authorization. I did not make these purchases, did not give
    anyone permission to use my card, and did not benefit from the transactions in any way. I reported the unauthorized charges
    immediately after discovering them. At the time of the transactions, I was actively working on the XXXX Eats platform,
    and I had my physical card in my possession. I did not lose my card, and it was never stolen. These charges were processed
    through the XXXX XXXX XXXX system without my consent, and I notified the bank as soon as I saw them. Despite my prompt
    report, my bank closed the dispute without conducting a reasonable investigation. They did not ask me for additional information,
    did not provide any documentation supporting their denial, and did not explain how they determined the transactions were
    authorized. They also did not provide provisional credit, even though Regulation E requires it when an investigation can
    not be completed within 10 business days. I repeatedly requested evidence of their investigation, including transaction
    logs, merchant information, and any data they relied on to claim the charges were authorized. The bank refused to provide
    this information. Instead, they simply stated that the transactions were valid without showing how they reached that conclusion.
    This is a violation of Regulation E, which requires financial institutions to conduct a goodfaith investigation, document
    their findings, and share those findings with the consumer upon request. I am requesting that the CFPB require my bank
    to reopen the dispute, conduct a full and compliant investigation, and provide all documentation they relied on when denying
    my claim. I am also requesting reimbursement for the unauthorized charges in accordance with the Electronic Fund Transfer
    Act and Regulation E. My banks handling of this matter has been inadequate, dismissive, and noncompliant with federal
    law.
- source_sentence: "To Whom It May Concern, I am writing to formally dispute and demand the immediate removal of the following\
    \ fraudulent accounts and inquiries from my credit report due to identity theft. These accounts were opened without my\
    \ consent, and I am invoking my rights under the Fair Credit Reporting Act ( FCRA ) to have these items promptly removed.\
    \ \nI am also writing to formally notify you that I am a victim of identity theft and request the immediate blocking and\
    \ deletion of all fraudulent accounts or information related to the identity theft, as authorized by 15 U.S.C. 1681c-2\
    \ ( a ). I became aware of the breach of my personal information through the XXXX data breach, which has exposed my sensitive\
    \ data to unauthorized individuals. \nThe following fraudulent accounts and inquiries have been identified as a result\
    \ of this breach : TRANSUNION Account Name : XXXX XXXX XXXX Account # : XXXX Balance : {$0.00} Date Opened : XX/XX/XXXX\
    \ Account Status : closed Account Name : XXXX XXXX XXXX XXXX Account # : XXXX Balance : {$0.00} Date Opened : XX/XX/XXXX\
    \ Account Status : closed UNAUTHORIZED INQUIRE ( XXXX ) XXXX XXXX XX/XX/XXXXXXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX\
    \ XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX\
    \ XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXX XXXXXX/XX/XXXX"
  sentences:
