- source_sentence: ما هو يوم التصرف في المحكمة
  sentences:
  - في سياق قضية جنائية ، تاريخ التصرف هو التاريخ الذي حدثت فيه نتيجة قضية معينة . عادة ، لا يتم تضمين الحكم كتصرف .
  - '1 . مائل أو مائل أو مائل . 2 . امتلاك الأفضلية أو التصرف أو الميل : ضغط أعضاء مجلس الشيوخ الذين يميلون بشكل إيجابي للضغط
    من أجل تمرير مشروع القانون .'
  - عادة ما تضع البطة بيضة واحدة إما كل يوم أو كل يوم .
- source_sentence: فعال
  sentences:
  - مصنف تحت اللغة | الفرق بين الفعال وغير الفعال غير الفعال ' هي أن كلمة واحدة هي عكس الأخرى .
  - فالكون هايتس ، مينيسوتا . فالكون هايتس هي إحدى ضواحي سانت بول ومدينة في مقاطعة رامزي ، مينيسوتا ، الولايات المتحدة . كان
    عدد السكان 5321 في تعداد 2010 . أصبحت قرية في عام 1949 ومدينة في عام 1973 .
  - 'الاستنتاجات : تسمح الطبيعة الواسعة لنهج CPTED بتكييفه مع أي وضع ، وتشير النتائج إلى أنه نهج فعال للحد من السرقة . ومع
    ذلك ، لم يتم تقييم معظم التدخلات بشكل مستقل عن العوامل الأخرى المساهمة في مخاطر السرقة .'
- source_sentence: ما هي الزيارة
  sentences:
  - الزيارة هي مسألة تتعلق بقانون الولاية ، ولكن بشكل عام ، تسمح كل ولاية للآباء بممارسة قدر معقول من الزيارة مع أطفالهم ،
    وهو ما يعني عموما وقتا كافيا لإقامة علاقة مفيدة والحفاظ عليها .
  - 2455 Visitation Drive ، Mendota Heights ، MN 55120651 - 683 - 1700 | [رابط] 1 تويتر . 2 فيسبوك . 3 يوتيوب . انستغرام .
  - تيد كافر هو أسطورة الإنترنت . وثق رحلته إلى الجحيم كاملة بالصور ، ليختفي قبل 14 عاما . لا تزال قصته حية .
- source_sentence: ماذا يعني اسم ديونيسوس
  sentences:
  - ديونيسوس . إله الكرمة ، وحصاد العنب ، وصناعة النبيذ ، والنبيذ ، وطقوس الجنون ، والنشوة الدينية ، والمسرح
  - رقم هاتف مطبعة جامعة كامبريدج في نيويورك هو 3900 - 924 - 924 . مطبعة جامعة كامبريدج هي دار نشر مشهورة في الأسواق المحلية
    والدولية وتنشر مجموعة متنوعة من الكتب المتعلقة بالأكاديمية والطب وتعليم اللغة والعلوم الإنسانية وغير ذلك الكثير .
  - 'اسم دينيس هو اسم طفل إنجليزي . في اللغة الإنجليزية ، معنى الاسم Denise هو : من اللاتينية Dionysos أو Dionysus ، في إشارة
    إلى إله النبيذ اليوناني . المعنى الأمريكي : اسم دينيس هو اسم طفل أمريكي .'
