    de asignación de cuentas; revisar registros contables; supervisar el registro de posventa; técnicas de contabilidad'
  - 'Analista de Toma de Pedidos- EXCLUSIVO DISCAPACIDAD. Sector: Industrias varias. Ocupacion: empleado de oficina/empleada
