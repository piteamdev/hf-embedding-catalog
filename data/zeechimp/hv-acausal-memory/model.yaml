configJson:
  model_type: hv_acausal_memory
  version: 1
  dependencies:
  - numpy
  primitive:
    representation: sparse ternary (±1/0)
    default_D: 5000
    default_nnz: 200
    default_max_anchors: 2000
    similarity: weighted cosine
  mechanisms:
    forget_gate:
      beta_base: 0.02
      beta_max: 0.3
      decay: exp(-beta * dt) applied per step
      pressure: n_active / max_anchors
    resurrection:
      threshold: 0.3
      boost: 0.5
      trigger: cosine similarity between reminder and dead anchor's key
    acausal_prefetch:
      partial_query_keep_fraction: user-specified
      similarity_restricted_to_known_dims: true
    retrieval_boost: 0.5
  capacity_bound:
    formula: N ≈ D / (2 log D)
    value_at_D_5000: 290
    applies_to: noise-free recall
    with_noise: effective bound is larger
  storage_estimate:
    dense_bytes_per_anchor: 2 * D
    sparse_bytes_per_anchor: 2 * nnz * 3
    at_D_5000_nnz_200:
      dense_kb_per_anchor: 9.77
      sparse_kb_per_anchor: 1.17
      anchors_in_187KB: 160
  benchmark_results:
